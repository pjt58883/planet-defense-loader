  // ---------- shells and smoke ----------
  //
  //  Shells are real objects with flight time, not instant hitscan. That
  //  introduces the classic overkill problem: three turrets all fire at the
  //  same pod, it dies to the first shell and the other two are wasted. So
  //  damage is RESERVED at the muzzle and released on impact, and targeting
  //  ignores anything already dead on paper.
  const BULLET_MAX = 256;
  const bullets = [];

  //  Two projectile models: the railgun slug fired by turrets/sea cannons
  //  and the heavier battery missile. Both are instanced and swapped in by
  //  buildModels once the GLBs land; until then nothing is in flight.
  let shellMesh = null, missileMesh = null;
  function resetBullets() {
    bullets.length = 0;
    if (shellMesh) shellMesh.count = 0;
    if (missileMesh) missileMesh.count = 0;
  }


  // Smoke is one Points object with a per-particle size and alpha, so a few
  // thousand puffs cost one draw call. PointsMaterial cannot fade per
  // particle in this build of three, hence the small shader.
  const SMOKE_MAX = 6000;    // shared by shell smoke and every engine flame
  const sPos = new Float32Array(SMOKE_MAX * 3);
  const sCol = new Float32Array(SMOKE_MAX * 3);
  const sSize = new Float32Array(SMOKE_MAX);
  const sAlpha = new Float32Array(SMOKE_MAX);
  const sLife = new Float32Array(SMOKE_MAX);
  const sMax = new Float32Array(SMOKE_MAX);
  const sS0 = new Float32Array(SMOKE_MAX);
  const sS1 = new Float32Array(SMOKE_MAX);
  const sA0 = new Float32Array(SMOKE_MAX);
  let sCount = 0;

  const smokeGeo = new THREE.BufferGeometry();
  smokeGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  smokeGeo.setAttribute('pcolor', new THREE.BufferAttribute(sCol, 3));
  smokeGeo.setAttribute('psize', new THREE.BufferAttribute(sSize, 1));
  smokeGeo.setAttribute('palpha', new THREE.BufferAttribute(sAlpha, 1));
  smokeGeo.setDrawRange(0, 0);

  const smokeMat = new THREE.ShaderMaterial({
    uniforms: { uScale: { value: window.innerHeight * 0.5 } },
    transparent: true,
    depthWrite: false,
    vertexShader: `
      attribute vec3 pcolor;
      attribute float psize;
      attribute float palpha;
      varying vec3 vCol;
      varying float vAlpha;
      uniform float uScale;
      void main() {
        vCol = pcolor;
        vAlpha = palpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = psize * (uScale / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vCol;
      varying float vAlpha;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d = dot(c, c);
        if (d > 0.25) discard;
        gl_FragColor = vec4(vCol, vAlpha * (1.0 - smoothstep(0.02, 0.25, d)));
      }`
  });

  const smoke = new THREE.Points(smokeGeo, smokeMat);
  smoke.frustumCulled = false;
  smoke.renderOrder = 2;
  world.add(smoke);

  function puff(p, s0, s1, life, r, g, b, a) {
    const i = sCount < SMOKE_MAX ? sCount++ : (Math.random() * SMOKE_MAX) | 0;
    sPos[i*3] = p.x; sPos[i*3+1] = p.y; sPos[i*3+2] = p.z;
    sCol[i*3] = r; sCol[i*3+1] = g; sCol[i*3+2] = b;
    sS0[i] = s0; sS1[i] = s1; sA0[i] = a;
    sLife[i] = 0; sMax[i] = life;
  }

  function swapSmoke(i, j) {
    for (let k = 0; k < 3; k++) {
      sPos[i*3+k] = sPos[j*3+k];
      sCol[i*3+k] = sCol[j*3+k];
    }
    sS0[i] = sS0[j]; sS1[i] = sS1[j]; sA0[i] = sA0[j];
    sLife[i] = sLife[j]; sMax[i] = sMax[j];
  }

  function updateSmoke(dt) {
    for (let i = 0; i < sCount; i++) {
      sLife[i] += dt;
      if (sLife[i] >= sMax[i]) { swapSmoke(i, --sCount); i--; continue; }
      const t = sLife[i] / sMax[i];
      sSize[i] = sS0[i] + (sS1[i] - sS0[i]) * t;   // puffs expand as they age
      sAlpha[i] = sA0[i] * (1 - t) * (1 - t);
    }
    smokeGeo.setDrawRange(0, sCount);
    if (!sCount) return;               // nothing drawn, nothing to upload
    // upload only the live prefix, not the whole SMOKE_MAX allocation
    const attrs = smokeGeo.attributes;
    attrs.position.updateRange.count = sCount * 3;
    attrs.pcolor.updateRange.count = sCount * 3;
    attrs.psize.updateRange.count = sCount;
    attrs.palpha.updateRange.count = sCount;
    attrs.position.needsUpdate = true;
    attrs.pcolor.needsUpdate = true;
    attrs.psize.needsUpdate = true;
    attrs.palpha.needsUpdate = true;
  }

  const flameAt = new THREE.Vector3();

  //  back is the unit vector out of the tail. Puffs are laid on a fixed
  //  clock rather than per frame so the trail does not thin out when the
  //  frame rate dips, and each one is tinted between yellow and red so the
  //  plume flickers instead of reading as a solid bar.
  function flame(pos, back, span, size, life) {
    flameAt.copy(back).multiplyScalar(span).add(pos);
    const heat = Math.random();
    puff(flameAt,
         size * (0.7 + Math.random() * 0.5),
         size * (1.6 + Math.random() * 0.8),
         life * (0.7 + Math.random() * 0.6),
         1.0, 0.55 + heat * 0.35, 0.15 + heat * 0.35,
         0.85);
  }

  const bDir = new THREE.Vector3(), bStep = new THREE.Vector3(), bTgt = new THREE.Vector3();

  //  A hot, short-lived burst at the muzzle. Three overlapping puffs that
  //  die inside a fifth of a second read as a strobing flash when the gun
  //  cycles, where one long-lived puff would just read as smoke.
  function muzzleFlash(p) {
    for (let k = 0; k < 3; k++) {
      puff(p,
           tiles.meanInr * (0.20 + Math.random() * 0.18),
           tiles.meanInr * (0.55 + Math.random() * 0.35),
           0.10 + Math.random() * 0.08,
           1.0, 0.93, 0.55, 0.95);
    }
  }

  function fireShell(from, dir, target, dmg, splashDmg) {
    if (bullets.length >= BULLET_MAX) return;
    target.incoming += dmg;                        // reserved, not yet dealt
    bullets.push({
      pos: from.clone(),
      vel: dir.clone().multiplyScalar(BAL.shellSpeed),
      target, dmg, splashDmg: splashDmg || 0, life: 0, emit: 0, spent: false
    });
    puff(from, tiles.meanInr * 0.30, tiles.meanInr * 1.1, 0.5, 1.0, 0.82, 0.5, 0.75);
  }

  function updateBullets(dt) {
    const trailGap = BAL.trailGap, scale = tiles.meanInr;
    let live = 0;
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      b.life += dt;

      if (!b.spent && b.target.alive) {
        // gentle homing: it curves onto a falling target instead of leading it
        bTgt.copy(b.target.dir).multiplyScalar(RADIUS + b.target.alt);
        bDir.subVectors(bTgt, b.pos);
        const dist = bDir.length();
        if (dist <= BAL.shellSpeed * dt + scale * 0.25) {
          b.target.hp -= b.dmg;
          b.target.incoming -= b.dmg;
          b.spent = true;
          for (let k = 0; k < 5; k++) {
            puff(bTgt, scale * 0.25, scale * 1.6, 0.55 + Math.random() * 0.3,
                 1.0, 0.72, 0.45, 0.8);
          }
          if (b.splashDmg) {
            // the burst. Splash is not reserved like direct damage: several
            // bursts overlapping the same pod just overkill it, which is
            // the price of area fire, not a targeting bug.
            const rB = BAL.splashRadius * scale;
            for (const a2 of aliens) {
              if (!a2.alive || a2 === b.target) continue;
              if (a2.pos.distanceTo(bTgt) > rB) continue;
              a2.hp -= b.splashDmg;
              if (a2.hp <= 0) {
                a2.alive = false;
                G.gold += a2.pay;
                for (let k = 0; k < 6; k++) {
                  puff(a2.pos, scale * 0.35, scale * 2.2, 0.7 + Math.random() * 0.4,
                       0.72, 0.45, 0.95, 0.7);
                }
              }
            }
            for (let k = 0; k < 8; k++) {
              puff(bTgt, scale * 0.5, scale * 3.0, 0.6 + Math.random() * 0.4,
                   1.0, 0.6, 0.3, 0.8);
            }
          }
          if (b.target.hp <= 0 && b.target.alive) {
            b.target.alive = false;
            G.gold += b.target.pay;
            for (let k = 0; k < 10; k++) {
              puff(bTgt, scale * 0.4, scale * 2.6, 0.8 + Math.random() * 0.5,
                   0.72, 0.45, 0.95, 0.7);
            }
          }
          continue;                                 // dropped this frame
        }
        bDir.divideScalar(dist);
        // a quarter of the remaining error per 60Hz frame, whatever the
        // actual frame rate, so homing strength does not vary by display
        b.vel.lerp(bDir.multiplyScalar(BAL.shellSpeed), 1 - Math.pow(0.75, dt * 60));
      } else if (!b.spent) {
        b.target.incoming -= b.dmg;                 // target died first
        b.spent = true;
      }

      if (b.spent && b.life > BAL.strayLife) continue;   // a miss flies on, then fizzles

      bStep.copy(b.vel).multiplyScalar(dt);
      b.pos.add(bStep);

      // lay the trail at a fixed spacing so speed does not change its density
      b.emit += bStep.length();
      while (b.emit >= trailGap) {
        b.emit -= trailGap;
        puff(b.pos, scale * 0.16, scale * 0.85, 0.9 + Math.random() * 0.4,
             0.62, 0.62, 0.66, 0.5);
      }

      bullets[live++] = b;
    }
    bullets.length = live;

    // shells and missiles are separate instanced models, so each one is
    // packed into its own run and pointed down its own velocity
    let nS = 0, nM = 0;
    for (let i = 0; i < live; i++) {
      const b = bullets[i];
      const mesh = b.splashDmg ? missileMesh : shellMesh;
      if (!mesh) continue;
      dummy.position.copy(b.pos);
      bTgt.copy(b.pos).add(b.vel);
      dummy.lookAt(bTgt);                       // model nose is baked onto -Z
      dummy.scale.setScalar(scale * (b.splashDmg ? 0.22 : 0.13));
      dummy.updateMatrix();
      mesh.setMatrixAt(b.splashDmg ? nM++ : nS++, dummy.matrix);
    }
    if (shellMesh) { shellMesh.count = nS; shellMesh.instanceMatrix.needsUpdate = true; }
    if (missileMesh) { missileMesh.count = nM; missileMesh.instanceMatrix.needsUpdate = true; }

  }

  const alienPos = new THREE.Vector3(), aim = new THREE.Vector3(),
        muzzle = new THREE.Vector3();
  function posOf(a) { return alienPos.copy(a.dir).multiplyScalar(RADIUS + a.alt); }

  // ---------- waves ----------
  // The drop picks a bearing in space and lands a cluster around it, so a
  // wave is a place you can defend rather than noise sprayed over the globe.
  const qWorldGoal = new THREE.Quaternion();
  let worldTween = false;

  function faceBearing(bearing) {
    // Off by default: the planet holding still is worth more than the
    // convenience of being shown the next zone, since the swing fires the
    // moment a wave ends and yanks the view out from under you.
    if (!BAL.autoFace) return;
    camera.updateMatrixWorld();
    const front = camera.position.clone().normalize();
    qWorldGoal.setFromUnitVectors(bearing, front);
    worldTween = true;
  }



  // A drop zone the player only learns about when it starts is not a puzzle,
  // it is a coin toss: turrets are static and a wave is over in twenty
  // seconds. So the NEXT bearing is chosen the moment the last wave ends and
  // drawn on the ground, and the break is the time you get to answer it.
  //  Each ring is a thin ribbon mesh draped on the sphere, not a LineLoop:
  //  WebGL ignores line widths, and a one-pixel thread is exactly the thing
  //  players fail to find on a busy planet.
  const ZONE_SEG = 96;
  const ZONE_HALF = 0.012;           // band half-width, radians on the sphere
  const zoneRings = [];
  const zoneMat = new THREE.MeshBasicMaterial({
    color: 0xff2f2f, transparent: true, opacity: 0.9,
    side: THREE.DoubleSide, depthWrite: false
  });
  const zoneIdx = [];
  for (let i = 0; i < ZONE_SEG; i++) {
    const a = i * 2, b = a + 1, c = ((i + 1) % ZONE_SEG) * 2, d = c + 1;
    zoneIdx.push(a, b, c, b, d, c);
  }
  for (let i = 0; i < MAX_SHIPS; i++) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ZONE_SEG * 6), 3));
    g.setIndex(zoneIdx);
    const r = new THREE.Mesh(g, zoneMat);
    r.frustumCulled = false;
    r.visible = false;
    world.add(r);
    zoneRings.push(r);
  }

  // The bearing WALKS, it does not teleport. A fresh random point on the
  // sphere every wave made the run a lottery: two zones near each other and
  // your existing turrets carry, two zones apart and you owe a whole new
  // defence you cannot afford. Simulated over hundreds of runs that swamped
  // every other number in the game. Drifting the bearing turns the same
  // randomness into a front line that walks around the planet, so the
  // question becomes how far you extend rather than how lucky you were.
  const driftAxis = new THREE.Vector3(), qDrift = new THREE.Quaternion();

  //  Early waves must not open on an ocean. A zone that is mostly water has
  //  almost nowhere to build, so the wave is decided before you touch it,
  //  and losing to the map roll is not the same as losing to the game.
  function waterFrac(bearing, ang) {
    const c = Math.cos(ang);
    let n = 0, w = 0;
    for (let ci = 0; ci < tiles.cells.length; ci++) {
      if (tiles.cells[ci].center.dot(bearing) > c) { n++; if (cellType[ci] === 'lake') w++; }
    }
    return n ? w / n : 0;
  }

  const randDir = () => {
    const b = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1);
    return b.lengthSq() < 1e-6 ? b.set(0, 1, 0) : b.normalize();
  };

  // how far the nearest OTHER ship is. Used to keep them off each other:
  // two juggernauts stacked in the same sky is one front, not two.
  function clearance(v, ships, skip) {
    let d = Math.PI;
    for (let i = 0; i < ships.length; i++) {
      if (i === skip) continue;
      d = Math.min(d, v.angleTo(ships[i].bearing));
    }
    return d;
  }

  function driftFrom(bearing) {
    driftAxis.set(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1);
    driftAxis.addScaledVector(bearing, -driftAxis.dot(bearing));
    if (driftAxis.lengthSq() < 1e-8) driftAxis.set(1, 0, 0);
    driftAxis.normalize();
    const step = BAL.driftMin + Math.random() * (BAL.driftMax - BAL.driftMin);
    qDrift.setFromAxisAngle(driftAxis, step);
    return bearing.clone().applyQuaternion(qDrift).normalize();
  }

  function pickBearing() {
    // everything about the coming wave is decided here, so the break shows
    // you the real thing rather than a placeholder
    const w = G.wave + 1;
    G.zoneAng = zoneAngleFor(w);
    G.shipDist = shipDistFor(w);
    const want = shipCountFor(w);
    const sep = Math.min(2.2, Math.max(BAL.shipSepMin, G.zoneAng * 1.15));

    // during the dry window a candidate must clear the water bar as well as
    // its neighbours; the best dry option wins, and if nothing is dry we fall
    // back to the roomiest rather than refusing to place the ship
    const dry = w <= BAL.dryWaves;
    const passes = v => !dry || waterFrac(v, G.zoneAng) <= BAL.dryMax;

    // existing ships walk, but each picks the drift that keeps it clearest
    // of its neighbours, so they spread instead of converging
    for (let i = 0; i < G.ships.length; i++) {
      const s = G.ships[i];
      let best = null, bestD = -1, dryBest = null, dryBestD = -1;
      for (let t = 0; t < (dry ? 24 : 8); t++) {
        const cand = driftFrom(s.bearing);
        const d = clearance(cand, G.ships, i);
        if (d > bestD) { bestD = d; best = cand; }
        if (passes(cand)) {
          if (d > dryBestD) { dryBestD = d; dryBest = cand; }
          if (d >= sep) break;
        }
      }
      s.bearing.copy(dryBest || best);
    }

    // new arrivals warp in as far from everything as a short search can find
    while (G.ships.length < want) {
      let best = null, bestD = -1, dryBest = null, dryBestD = -1;
      for (let t = 0; t < (dry ? 96 : 64); t++) {
        const cand = randDir();
        const d = clearance(cand, G.ships, -1);
        if (d > bestD) { bestD = d; best = cand; }
        if (passes(cand)) {
          if (d > dryBestD) { dryBestD = d; dryBest = cand; }
          if (d >= sep) break;
        }
      }
      G.ships.push({ bearing: dryBest || best, dist: G.shipDist, ang: G.zoneAng });
    }
    G.ships.length = Math.min(G.ships.length, want);

    for (let i = 0; i < G.ships.length; i++) {
      G.ships[i].dist = G.shipDist;
      G.ships[i].ang = G.zoneAng;
      drawZone(i, G.ships[i].bearing, G.zoneAng);
    }
    for (let i = G.ships.length; i < MAX_SHIPS; i++) zoneRings[i].visible = false;

    G.bearing = G.ships[0].bearing;      // the sim and the camera still want one
    placeMothers();
    faceBearing(meanBearing());
  }

  // the camera swings to the middle of the fleet, which is the best single
  // view when there is more than one of them
  const meanV = new THREE.Vector3();
  function meanBearing() {
    meanV.set(0, 0, 0);
    for (const s of G.ships) meanV.add(s.bearing);
    return meanV.lengthSq() < 0.04 ? G.ships[0].bearing : meanV.normalize();
  }

  const zA = new THREE.Vector3(), zB = new THREE.Vector3(), zP = new THREE.Vector3();
  function drawZone(idx, bearing, ang) {
    const ring = zoneRings[idx];
    if (!ring) return;
    zA.set(0, 0, 1);
    if (Math.abs(bearing.z) > 0.9) zA.set(1, 0, 0);
    zA.addScaledVector(bearing, -zA.dot(bearing)).normalize();
    zB.crossVectors(bearing, zA);
    const arr = ring.geometry.attributes.position.array;
    for (let i = 0; i < ZONE_SEG; i++) {
      const a = (i / ZONE_SEG) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      for (let k = 0; k < 2; k++) {           // inner and outer edge of the band
        const ph = ang + (k ? ZONE_HALF : -ZONE_HALF);
        zP.copy(bearing).multiplyScalar(Math.cos(ph))
          .addScaledVector(zA, Math.sin(ph) * ca)
          .addScaledVector(zB, Math.sin(ph) * sa)
          .setLength(RADIUS * 1.008);
        const o = (i * 2 + k) * 3;
        arr[o] = zP.x; arr[o+1] = zP.y; arr[o+2] = zP.z;
      }
    }
    ring.geometry.attributes.position.needsUpdate = true;
    ring.visible = true;
  }

  function startWave() {
    G.wave++;
    G.inWave = true;

    const n = BAL.alienN(G.wave);
    const hp = BAL.alienHp(G.wave);
    const speed = BAL.alienSpeed(G.wave);
    const fleet = G.ships.length;
    const hf = G.wave >= BAL.hulkFrom ? BAL.hulkFrac(G.wave) : 0;
    const df = G.wave >= BAL.dartFrom ? BAL.dartFrac(G.wave) : 0;

    G.queue = [];
    for (let si = 0; si < fleet; si++) {
      const ship = G.ships[si];
      const spread = Math.cos(ship.ang);
      const cand = [];
      for (let ci = 0; ci < tiles.cells.length; ci++) {
        if (tiles.cells[ci].center.dot(ship.bearing) > spread) cand.push(ci);
      }
      if (!cand.length) cand.push(0);

      // they aim for what you built, not empty ground, so the telegraph is a
      // warning about your own stuff rather than an abstract patch of dirt
      const built = cand.filter(ci => towerAt.has(ci) || fighterAt.has(ci) || foundryAt.has(ci));

      // the wave splits across the fleet; the remainder goes to the first ships
      const share = Math.floor(n / fleet) + (si < n % fleet ? 1 : 0);
      for (let i = 0; i < share; i++) {
        const pool = (built.length && Math.random() < BAL.aimAtBuilt) ? built : cand;
        const r = Math.random();
        const type = r < hf ? 'hulk' : r < hf + df ? 'dart' : 'viper';
        G.queue.push({ ci: pool[(Math.random() * pool.length) | 0], type, hp, speed, ship });
      }
    }
    // interleave, or ship one empties its bays before ship two starts
    for (let i = G.queue.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = G.queue[i]; G.queue[i] = G.queue[j]; G.queue[j] = t;
    }
    G.spawnTimer = 0;
    G.landed = 0;
    hideSummary();                   // a called wave clears the last report
    faceBearing(meanBearing());
    say('WAVE ' + G.wave + ' INBOUND');
  }

  function spawnOne(spec) {
    if (aliens.length >= MAX_ALIENS) return;
    const ship = spec.ship || G.ships[0];
    const E = BAL.enemies[spec.type];
    const tgt = tiles.cells[spec.ci].center;
    const alt = ship.dist - RADIUS;             // it leaves from the ship itself
    const speed = spec.speed * E.speed;
    const sweep = ship.bearing.angleTo(tgt);
    const fall = alt / speed;                   // seconds to the ground
    aliens.push({
      ci: spec.ci,
      type: spec.type,
      dir: ship.bearing.clone(),                // starts under its own ship
      tgt: tgt.clone(),
      turn: sweep / Math.max(fall * BAL.converge, 0.001),   // arrives over its
      alt,                                                  // column part way down
      pos: new THREE.Vector3(),
      prev: new THREE.Vector3(),
      hp: spec.hp * E.hp,
      incoming: 0,
      dmg: Math.round(BAL.landDamage * E.dmg),
      pay: E.pay,
      speed,
      alive: true
    });
  }

  function endWave() {
    G.inWave = false;
    G.breakLeft = BAL.breakTime;
    const pay = BAL.income(G.wave) + foundryIncome();
    G.gold += pay;
    tickRecoveries();                // a wave survived is a wave of digging
    showSummary(G.wave, G.landed, pay);
    pickBearing();                   // you get the next one straight away
  }

  // ---------- tick ----------
  let motherEmit = 0;

  function gameTick(dt) {
    if (!G.started || !G.ready || G.over || G.paused) return;

    // the juggernaut holds station, so its plume is a slow idle burn
    if (G.ships.length) {
      motherEmit += dt;
      const mk = BAL.motherSize / MOTHER_LEN;
      while (motherEmit >= BAL.flameGap * 1.4) {
        motherEmit -= BAL.flameGap * 1.4;
        for (let i = 0; i < G.ships.length; i++) {
          const m = motherMeshes[i];
          if (!m || !m.visible) continue;
          flame(m.position, G.ships[i].bearing, 0.92 * MOTHER_LEN * mk,
                BAL.motherSize * 0.16, BAL.flameLife * 2.2);
        }
      }
    }

    if (!G.inWave) {
      G.breakLeft -= dt;
      if (G.breakLeft <= 0) startWave();
    } else if (G.queue.length) {
      G.spawnTimer -= dt;
      while (G.queue.length && G.spawnTimer <= 0) {
        spawnOne(G.queue.shift());
        G.spawnTimer += BAL.spawnGap;
      }
    }

    // fly out and down
    for (const a of aliens) {
      if (!a.alive) continue;
      const rem = a.dir.angleTo(a.tgt);
      if (rem > 1e-5) {
        const step = Math.min(rem, a.turn * dt);
        fAxis.crossVectors(a.dir, a.tgt);
        if (fAxis.lengthSq() > 1e-12) {
          fAxis.normalize();
          fQ.setFromAxisAngle(fAxis, step);
          a.dir.applyQuaternion(fQ).normalize();
        }
      }
      a.alt -= a.speed * dt;
      if (a.alt <= 0) {
        a.alive = false;
        G.landed++;
        G.hp -= a.dmg;
        const lost = demolish(a.ci);
        killHex(a.ci);
        say(lost || 'HEX DESTROYED');
        if (G.hp <= 0) { G.hp = 0; loseGame(); }
      }
    }

    // fire. Each turret takes whatever is closest to touching down, which
    // is the shot that is actually about to cost you something.
    for (const t of towers) {
      t.cool -= dt;
      let best = null;
      for (const a of aliens) {
        if (!a.alive || a.alt > t.ceiling) continue;
        if (!t.cover.has(a.ci)) continue;
        if (a.hp - a.incoming <= 0) continue;      // already dead, shells in flight
        if (!best || a.alt < best.alt) best = a;
      }
      // the barrel tracks whether or not it can shoot yet, so you can read
      // where a turret is committed at a glance
      aim.copy(best ? posOf(best) : t.up.clone().multiplyScalar(RADIUS + 1)).sub(t.seat);
      if (aim.lengthSq() > 1e-9) {
        aim.normalize();
        t.aimDir.copy(aim);
        t.aimQ.setFromUnitVectors(LOCAL_UP, aim);
      }
      if (!best || t.cool > 0) continue;
      t.cool = t.rate;
      if (t.kind === 'battery') muzzle.copy(t.pos);   // no barrel to clear
      else muzzle.copy(t.aimDir).multiplyScalar(GUN_TIP * t.k).add(t.seat);
      fireShell(muzzle, t.aimDir, best, t.dmg, t.splashDmg);
    }
    for (const t of towers) writeGun(t);
    if (modelsOK && towers.length) gunMesh.instanceMatrix.needsUpdate = true;

    // batteries have no swivelling barrel, so the whole mount slews toward
    // the target's bearing instead, capped by a turn rate like the jets
    for (const t of towers) {
      if (t.kind !== 'battery') continue;
      bV.copy(t.aimDir).addScaledVector(t.up, -t.aimDir.dot(t.up));
      if (bV.lengthSq() > 1e-8) {
        const goal = Math.atan2(-bV.dot(t.b1), -bV.dot(t.b2));
        let d = goal - t.yaw;
        d = ((d + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
        const lim = BAL.batteryTurn * dt;
        t.yaw += THREE.MathUtils.clamp(d, -lim, lim);
      }
      writeBattery(t);
    }
    if (batteryMesh && batteryMesh.count) batteryMesh.instanceMatrix.needsUpdate = true;

    // the dig crews' sidearms: short reach, low ceiling, but every shot
    // leaves a strobing flash at the muzzle so a defended dig reads busy
    for (const r of recoveries) {
      r.cool -= dt;
      let best = null;
      for (const a of aliens) {
        if (!a.alive || a.alt > r.ceiling) continue;
        if (!r.cover.has(a.ci)) continue;
        if (a.hp - a.incoming <= 0) continue;
        if (!best || a.alt < best.alt) best = a;
      }
      if (!best || r.cool > 0) continue;
      r.cool = r.rate;
      aim.copy(posOf(best)).sub(r.pos).normalize();
      fireShell(r.pos, aim, best, r.dmg);
      muzzleFlash(r.pos);
    }

    // compact and draw, each type into its own mesh
    let live = 0;
    const drawn = { viper: 0, hulk: 0, dart: 0 };
    for (let i = 0; i < aliens.length; i++) {
      const a = aliens[i];
      if (!a.alive) continue;
      aliens[live] = a;
      posOf(a);
      a.prev.copy(a.pos);
      a.pos.copy(alienPos);
      dummy.position.copy(alienPos);
      // nose along the actual flight path, which curves as it swings onto
      // its column, rather than always straight down
      fZ.subVectors(a.prev, a.pos);
      if (fZ.lengthSq() < 1e-12) fZ.copy(a.dir);
      fZ.normalize();
      fY.copy(a.dir).addScaledVector(fZ, -a.dir.dot(fZ));
      if (fY.lengthSq() < 1e-12) fY.set(0, 1, 0);
      fY.normalize();
      fX.crossVectors(fY, fZ).normalize();
      fBasis.makeBasis(fX, fY, fZ);
      dummy.quaternion.setFromRotationMatrix(fBasis);
      const vk = tiles.meanInr * BAL.enemies[a.type].size / ENEMY_LEN[a.type];
      dummy.scale.setScalar(vk);

      a.emit = (a.emit || 0) + dt;              // fZ already points out the back
      while (a.emit >= BAL.flameGap) {
        a.emit -= BAL.flameGap;
        flame(alienPos, fZ, 0.94 * vk, tiles.meanInr * 0.10, BAL.flameLife);
      }
      dummy.updateMatrix();
      enemyMeshes[a.type].setMatrixAt(drawn[a.type]++, dummy.matrix);
      live++;
    }
    aliens.length = live;
    for (const t in enemyMeshes) {
      enemyMeshes[t].count = drawn[t];
      enemyMeshes[t].instanceMatrix.needsUpdate = true;
    }

    updateFighters(dt);
    updateBullets(dt);
    updateSmoke(dt);

    if (G.inWave && !G.queue.length && live === 0) endWave();
  }

  function loseGame() {
    G.over = true;
    G.paused = false;
    hideSummary();
    G.inWave = false;
    G.queue.length = 0;
    clearEnemies();                              // nothing left hanging in the sky
    resetBullets();
    hideMothers();
    say('PLANET LOST \u00B7 NEW WORLD TO RESTART', true);
  }

  // ---------- readouts ----------
  const hpVal = document.getElementById('hpVal');
  const hpFill = document.getElementById('hpFill');
  const goldVal = document.getElementById('goldVal');
  const waveVal = document.getElementById('waveVal');
  const nextVal = document.getElementById('nextVal');
  const nextStat = nextVal.parentElement;
  const alertEl = document.getElementById('alert');
  const buildBtn = document.getElementById('buildBtn');
  const jetBtn = document.getElementById('jetBtn');
  const foundryBtn = document.getElementById('foundryBtn');
  const cannonBtn = document.getElementById('cannonBtn');
  const batteryBtn = document.getElementById('batteryBtn');
  const recoveryBtn = document.getElementById('recoveryBtn');
  const waveBtn = document.getElementById('waveBtn');
  let alertUntil = 0;

  function say(msg, sticky) {
    alertEl.textContent = msg;
    alertEl.classList.remove('quiet');
    alertUntil = sticky ? Infinity : performance.now() + 2200;
  }

  function updateHud() {
    const pct = Math.max(0, G.hp / G.hpMax);
    hpVal.textContent = 'integrity ' + Math.ceil(G.hp);
    hpFill.style.width = (pct * 100) + '%';
    hpFill.classList.toggle('low', pct < 0.34);
    hpVal.classList.toggle('low', pct < 0.34);
    goldVal.textContent = Math.floor(G.gold);
    waveVal.textContent = G.over ? G.wave + ' lost' : G.wave;
    // the epsilon stops it sitting on the full break time for an extra second:
    // at breakLeft 19.9999, a plain ceil still reads 20
    const left = Math.max(0, Math.ceil(G.breakLeft - 1e-6));
    nextVal.textContent = G.over ? '\u2014' : G.inWave ? 'inbound' : left + 's';
    nextStat.classList.toggle('soon', !G.over && !G.inWave && left <= 5);
    buildBtn.textContent = 'Build turret (' + BAL.turretCost + ')';
    jetBtn.textContent = 'Build fighter (' + BAL.jetCost + ')';
    foundryBtn.textContent = 'Build foundry (' + BAL.foundryCost + ')';
    cannonBtn.textContent = 'Build sea cannon (' + BAL.cannonCost + ')';
    cannonBtn.disabled = G.gold < BAL.cannonCost && G.build !== 'cannon';
    cannonBtn.setAttribute('aria-pressed', G.build === 'cannon' ? 'true' : 'false');
    batteryBtn.textContent = 'Build missile battery (' + BAL.batteryCost + ')';
    batteryBtn.disabled = G.gold < BAL.batteryCost && G.build !== 'battery';
    batteryBtn.setAttribute('aria-pressed', G.build === 'battery' ? 'true' : 'false');
    recoveryBtn.textContent = 'Build recovery team (' + BAL.recoveryCost + ')';
    recoveryBtn.disabled = G.gold < BAL.recoveryCost && G.build !== 'recovery';
    recoveryBtn.setAttribute('aria-pressed', G.build === 'recovery' ? 'true' : 'false');
    if (selCi !== null) refreshUnitCard();
    foundryBtn.disabled = G.gold < BAL.foundryCost && G.build !== 'foundry';
    foundryBtn.setAttribute('aria-pressed', G.build === 'foundry' ? 'true' : 'false');
    buildBtn.disabled = G.gold < BAL.turretCost && G.build !== 'turret';
    jetBtn.disabled = G.gold < BAL.jetCost && G.build !== 'fighter';
    buildBtn.setAttribute('aria-pressed', G.build === 'turret' ? 'true' : 'false');
    jetBtn.setAttribute('aria-pressed', G.build === 'fighter' ? 'true' : 'false');
    if (summaryUntil && performance.now() > summaryUntil) hideSummary();
    if (alertUntil !== Infinity && alertUntil && performance.now() > alertUntil) {
      alertEl.classList.add('quiet');
      alertUntil = 0;
    }
  }

  function setBuild(mode) {
    G.build = mode || null;
    hint.classList.toggle('live', !!G.build);
    hint.textContent =
        G.build === 'turret'  ? 'Tap a tile to place a turret. Mountains give extra reach. Water is unbuildable.'
      : G.build === 'fighter' ? 'Tap any tile to base a fighter, water included. It patrols that tile\u2019s circle and closes to gun range.'
      : G.build === 'cannon' ? 'Tap a WATER tile to float a sea cannon. Longer reach and a heavier shell than a land turret.'
      : G.build === 'foundry' ? 'Tap a tile to build a foundry. It pays on each wave cleared: mountain 8, desert 7, plain 5, forest 4, swamp 3.'
      : G.build === 'battery' ? 'Tap a land tile to build a missile battery. Slow, heavy shells that burst on impact and damage everything nearby.'
      : G.build === 'recovery' ? 'Tap a crossed-out tile to send a recovery team. The dig takes one wave for every wave the tile has been lost.'
      : '';
    hint.classList.toggle('gone', !G.build);
  }

  buildBtn.addEventListener('click', () => setBuild(G.build === 'turret' ? null : 'turret'));
  jetBtn.addEventListener('click', () => setBuild(G.build === 'fighter' ? null : 'fighter'));
  foundryBtn.addEventListener('click', () => setBuild(G.build === 'foundry' ? null : 'foundry'));
  cannonBtn.addEventListener('click', () => setBuild(G.build === 'cannon' ? null : 'cannon'));
  batteryBtn.addEventListener('click', () => setBuild(G.build === 'battery' ? null : 'battery'));
  recoveryBtn.addEventListener('click', () => setBuild(G.build === 'recovery' ? null : 'recovery'));
  waveBtn.addEventListener('click', () => { if (!G.inWave && !G.over) { G.breakLeft = 0; } });

  // ---------- wave summary ----------
  const waveModal = document.getElementById('waveModal');
  const modalTitle = document.getElementById('modalTitle');
  const rowLanded = document.getElementById('rowLanded');
  const modalPay = document.getElementById('modalPay');
  const modalNext = document.getElementById('modalNext');
  const modalWarn = document.getElementById('modalWarn');
  let summaryUntil = 0;

  function showSummary(wave, landed, pay) {
    modalTitle.textContent = 'Wave ' + wave + ' cleared';
    rowLanded.querySelector('b').textContent = landed;
    rowLanded.classList.toggle('bad', landed > 0);   // a clean wave should look clean
    modalPay.textContent = '+' + pay;
    modalNext.textContent = wave + 1;
    // the coming wave is already decided, so the card can warn about it:
    // a growing fleet is the one thing worth spending the break answering
    const ships = shipCountFor(wave + 1);
    modalWarn.textContent = '⚠ mothership ' + ships + ' warps in';
    modalWarn.classList.toggle('on', ships > shipCountFor(wave));
    waveModal.classList.add('open');
    G.paused = true;                                 // the break stops here
    // autoplay just means the card dismisses itself; without it the game
    // waits, which is the point of pausing rather than running a countdown
    summaryUntil = autoContinue ? performance.now() + BAL.summaryTime * 1000 : 0;
  }

  function hideSummary() {
    if (waveModal.classList.contains('open')) G.paused = false;
    waveModal.classList.remove('open');
    summaryUntil = 0;
  }

  let autoContinue = false;
  const autoBox = document.getElementById('autoBox');
  autoBox.addEventListener('change', () => {
    autoContinue = autoBox.checked;
    if (autoContinue && waveModal.classList.contains('open')) {
      summaryUntil = performance.now() + BAL.summaryTime * 1000;
    } else if (!autoContinue) {
      summaryUntil = 0;
    }
  });

  document.getElementById('modalBtn').addEventListener('click', hideSummary);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { hideSummary(); hideUnitCard(); } });

  // ---------- unit card ----------
  //  Tap one of your buildings (with no build mode armed) and this pops up
  //  beside it: what it is, what it does, and the button to level it up.
  //  It reads live state on every HUD tick, so the numbers stay honest and
  //  the card folds itself away if the building dies under it.
  const unitCard = document.getElementById('unitCard');
  const unitName = document.getElementById('unitName');
  const unitDmgLabel = document.getElementById('unitDmgLabel');
  const unitDmg = document.getElementById('unitDmg');
  const unitRateRow = document.getElementById('unitRateRow');
  const unitRate = document.getElementById('unitRate');
  const unitLvl = document.getElementById('unitLvl');
  const unitUpgBtn = document.getElementById('unitUpgBtn');
  let selCi = null;

  const TOWER_NAMES = { turret: 'Turret', cannon: 'Sea cannon', battery: 'Missile battery' };

  function refreshUnitCard() {
    const b = selCi !== null && buildingAt(selCi);
    if (!b) { hideUnitCard(); return; }
    const t = towerAt.get(selCi), jf = fighterAt.get(selCi);

    if (t) {
      unitName.textContent = TOWER_NAMES[t.kind];
      unitDmgLabel.textContent = 'damage';
      unitDmg.textContent = t.splashDmg ? t.dmg + ' +' + t.splashDmg + ' splash' : t.dmg;
      unitRateRow.style.display = '';
      unitRate.textContent = (1 / t.rate).toFixed(1) + '/s';
    } else if (jf) {
      unitName.textContent = 'Fighter';
      unitDmgLabel.textContent = 'damage';
      unitDmg.textContent = jf.dmg;
      unitRateRow.style.display = '';
      unitRate.textContent = (1 / BAL.jetRate).toFixed(1) + '/s';
    } else if (recoveryAt.get(selCi)) {
      unitName.textContent = 'Recovery team';
      unitDmgLabel.textContent = 'restores in';
      unitDmg.textContent = b.left + (b.left === 1 ? ' wave' : ' waves');
      unitRateRow.style.display = '';
      unitRate.textContent = b.need + (b.need === 1 ? ' wave dig' : ' wave dig');
      unitLvl.textContent = '\u2014';
      unitUpgBtn.textContent = 'No upgrade';
      unitUpgBtn.disabled = true;
      return;
    } else {
      unitName.textContent = 'Foundry';
      unitDmgLabel.textContent = 'yield';
      unitDmg.textContent = b.rate + ' gold/wave';
      unitRateRow.style.display = 'none';
    }
    unitLvl.textContent = b.level + ' / ' + BAL.upgradeMax;

    if (b.level >= BAL.upgradeMax) {
      unitUpgBtn.textContent = 'Max level';
      unitUpgBtn.disabled = true;
    } else {
      const cost = BAL.upgradeCost(upgradeBase(selCi), b.level + 1);
      unitUpgBtn.textContent = 'Upgrade (' + cost + ')';
      unitUpgBtn.disabled = G.gold < cost;
    }
  }

  function openUnitCard(ci, x, y) {
    selCi = ci;
    refreshUnitCard();
    if (selCi === null) return;                    // nothing there after all
    unitCard.classList.add('open');
    // beside the tap, clamped so it never hangs off screen
    const w = unitCard.offsetWidth, h = unitCard.offsetHeight;
    unitCard.style.left = Math.max(10, Math.min(x + 14, window.innerWidth - w - 10)) + 'px';
    unitCard.style.top = Math.max(10, Math.min(y + 14, window.innerHeight - h - 10)) + 'px';
  }

  function hideUnitCard() {
    selCi = null;
    unitCard.classList.remove('open');
  }

  unitUpgBtn.addEventListener('click', () => {
    if (selCi !== null) { upgradeAt(selCi); refreshUnitCard(); }
  });

  // ---------- model loading ----------
  //
  //  Models are fetched as files rather than inlined, so they download in
  //  parallel, get cached between visits, and adding another one costs
  //  nothing at startup. The trade is that this no longer runs from file://,
  //  because fetch refuses local paths: it needs the dev preview or any
  //  static host.
  //
  //  Each model is tried from the repo first (public/assets/), then from the
  //  Lovable asset store this project was built in, so the game works on any
  //  static host once the GLBs are committed. To self-host a model, drop it
  //  in public/assets/ under the name listed here. A model that loads from
  //  neither source renders as a plain placeholder shape instead of
  //  disappearing.
  const MODEL_URLS = {
    pad:     ['/assets/pad.glb',     '/__l5e/assets-v1/ed785583-b953-46d5-ab3f-e50d5d30ff44/pad.glb'],
    gun:     ['/assets/gun.glb',     '/__l5e/assets-v1/133193a7-4cfb-472e-b1b9-78777d72ff7a/gun.glb'],
    jet:     ['/assets/jet.glb',     '/__l5e/assets-v1/aa131bb3-9b03-4489-b483-5ab9fe50aa00/jet.glb'],
    foundry: ['/assets/foundry.glb', '/__l5e/assets-v1/9da45853-b69f-416c-9044-3847846ee13c/foundry.glb'],
    mother:  ['/assets/mother.glb',  '/__l5e/assets-v1/a43bfc6e-27db-4579-b762-be7ff49cf039/mother.glb'],
    // the descending enemy flies the dropship; the old viper stays behind
    // it as a fallback (decimated from the 33 MB source export, nose baked
    // onto -Z - regenerate via gltf-transform if the source changes)
    viper:   ['/assets/dropship.glb', '/assets/viper.glb'],
    hover:   ['/assets/hover.glb',   '/__l5e/assets-v1/7b7459ce-3d39-4b07-9493-11655f707cfa/hover.glb'],
    core:    ['/assets/core.glb',    '/__l5e/assets-v1/6bce7fea-818f-4d63-b513-fa4f5cfa1d57/core.glb'],
    hulk:    ['/assets/hulk.glb'],
    // the dart flies the retired viper model; a dedicated dart.glb in
    // public/assets would take over automatically
    dart:    ['/assets/dart.glb', '/assets/viper.glb'],
    battery: ['/assets/battery.glb'],
    // the recovery team: engineers and their outpost, planted on lost ground
    recovery: ['/assets/recovery.glb'],
    // projectiles: the railgun slug (turrets, sea cannons) and the battery
    // missile. Both are modelled standing on +Y and are laid onto -Z below.
    slug:    ['/assets/railgun_ammo.glb'],
    missile: ['/assets/missile_battery_ammo.glb']

  };

  //  Slots with no shipped GLB yet: they render as placeholders by design,
  //  so a missing file is expected and not worth an on-screen warning.
  //  Drop a model into public/assets under that name to fill the slot
  //  (and measure its length into ENEMY_LEN / footprint constants).
  const OPTIONAL_MODELS = new Set(['hulk']);

  //  Stand-ins for models that fail to load, built to the same footprints
  //  and pivots the real GLBs were measured at, so every scale factor and
  //  seat height in the placement code still applies unchanged.
  function placeholderPart(name) {
    let geo, color;
    switch (name) {
      case 'pad':
        geo = new THREE.CylinderGeometry(PAD_R * 0.7, PAD_R, GUN_SEAT, 12);
        geo.translate(0, GUN_SEAT / 2, 0);              // underside at y=0
        color = 0x5c6a7d; break;
      case 'gun':
        geo = new THREE.ConeGeometry(0.3, GUN_TIP, 8);
        geo.translate(0, GUN_TIP / 2, 0);               // pivot at the ball centre
        color = 0x8fa3bd; break;
      case 'jet':
        geo = new THREE.ConeGeometry(JET_LEN * 0.22, JET_LEN, 6);
        geo.rotateX(-Math.PI / 2);                      // nose down -Z
        color = 0xd0d6df; break;
      case 'foundry':
        geo = new THREE.CylinderGeometry(FOUNDRY_R * 0.75, FOUNDRY_R, 1.0, 8);
        geo.translate(0, 0.5, 0);
        color = 0xb08a4f; break;
      case 'mother':
        geo = new THREE.CylinderGeometry(MOTHER_LEN * 0.18, MOTHER_LEN * 0.26, MOTHER_LEN, 8);
        geo.rotateX(-Math.PI / 2);                      // long axis on Z, nose -Z
        color = 0x6a5c8a; break;
      case 'viper':
        geo = new THREE.ConeGeometry(VIPER_LEN * 0.2, VIPER_LEN, 5);
        geo.rotateX(-Math.PI / 2);                      // nose down -Z
        color = 0xb45cff; break;
      case 'hover':
        geo = new THREE.CylinderGeometry(PLAT_R, PLAT_R, PLAT_DECK, 10);
        geo.translate(0, PLAT_DECK / 2, 0);             // deck top at PLAT_DECK
        color = 0x4a5a6a; break;
      case 'hulk':
        geo = new THREE.ConeGeometry(VIPER_LEN * 0.34, VIPER_LEN, 6);
        geo.rotateX(-Math.PI / 2);                      // nose down -Z
        color = 0xc03a28; break;
      case 'dart':
        geo = new THREE.ConeGeometry(VIPER_LEN * 0.12, VIPER_LEN, 4);
        geo.rotateX(-Math.PI / 2);                      // nose down -Z
        color = 0x58c8ff; break;
      case 'battery':
        geo = new THREE.CylinderGeometry(BATTERY_R * 0.55, BATTERY_R, BATTERY_H, 6);
        geo.translate(0, BATTERY_H / 2, 0);             // base at y=0
        color = 0x7d8a5a; break;
      case 'recovery':
        geo = new THREE.BoxGeometry(RECOV_R * 1.2, RECOV_R * 0.7, RECOV_R * 1.2);
        geo.translate(0, RECOV_R * 0.35, 0);            // base at y=0
        color = 0x4fd08a; break;
      // projectiles: modelled standing on +Y like their GLBs, ~2 units long,
      // so buildModels can lay either one onto -Z with the same rotation
      case 'slug':
        geo = new THREE.ConeGeometry(0.16, 1.9, 6);
        color = 0xffd9a0; break;
      case 'missile':
        geo = new THREE.ConeGeometry(0.37, 1.9, 6);
        color = 0xffb060; break;

      default:  // core
        geo = new THREE.CylinderGeometry(CORE_R * 0.7, CORE_R, CORE_SEAT, 8);
        geo.translate(0, CORE_SEAT / 2, 0);
        color = 0x9aa7b8; break;
    }
    return { geo, mat: new THREE.MeshStandardMaterial({ color, metalness: 0.18, roughness: 0.55, flatShading: true }) };
  }

  function instanced(parsed, max, dynamic) {
    const m = new THREE.InstancedMesh(parsed.geo, parsed.mat, max);
    m.count = 0;
    m.frustumCulled = false;                   // instances are scattered, so the
    if (dynamic) m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);   // origin bound lies
    world.add(m);
    return m;
  }

  function buildModels(parts) {
    padMesh = instanced(parts.pad, MAX_TURRETS, true);
    gunMesh = instanced(parts.gun, MAX_TURRETS, true);
    modelsOK = true;

    jetMesh = instanced(parts.jet, MAX_TURRETS, true);
    foundryMesh = instanced(parts.foundry, MAX_TURRETS, false);
    platMesh = instanced(parts.hover, MAX_TURRETS, true);
    coreMesh = instanced(parts.core, MAX_TURRETS, true);
    batteryMesh = instanced(parts.battery, MAX_TURRETS, true);   // it slews to aim
    // the outpost is modelled centred on its own origin; drop it so the
    // ground plate sits on the tile instead of half-buried
    parts.recovery.geo.computeBoundingBox();
    const rbb = parts.recovery.geo.boundingBox;
    if (rbb) parts.recovery.geo.translate(0, -rbb.min.y, 0);
    recoveryMesh = instanced(parts.recovery, MAX_TURRETS, false);
    rebuildRecoveryMesh();

    // both projectiles are authored nose-up (+Y); lay them onto -Z once so
    // updateBullets can just point the instance down its velocity
    parts.slug.geo.rotateX(-Math.PI / 2);
    parts.missile.geo.rotateX(-Math.PI / 2);
    shellMesh = instanced(parts.slug, BULLET_MAX, true);
    missileMesh = instanced(parts.missile, BULLET_MAX, true);


    for (let i = 0; i < MAX_SHIPS; i++) {
      const m = new THREE.Mesh(parts.mother.geo, parts.mother.mat);  // geo/mat shared
      m.frustumCulled = false;
      m.visible = false;
      world.add(m);
      motherMeshes.push(m);
    }

    // swap the stand-ins out from under the enemy meshes so every existing
    // reference stays valid
    for (const t in enemyMeshes) {
      const m = enemyMeshes[t];
      m.geometry.dispose();
      m.material.dispose();
      m.geometry = parts[t].geo;
      m.material = parts[t].mat;
    }
  }

  const startBtn = document.getElementById('startBtn');

  async function loadModels() {
    startBtn.disabled = true;
    startBtn.textContent = 'Loading models\u2026';
    const names = Object.keys(MODEL_URLS);
    const parts = {}, missing = [];
    // each model loads (or falls back) on its own, so one bad file costs one
    // placeholder rather than the whole set
    await Promise.all(names.map(async n => {
      for (const url of MODEL_URLS[n]) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          parts[n] = parseGLB(await res.arrayBuffer());
          return;
        } catch (e) {
          console.warn(n + ' failed from ' + url, e);
        }
      }
      missing.push(n);
      parts[n] = placeholderPart(n);
    }));
    buildModels(parts);
    if (missing.length) console.warn('models missing, using placeholders:', missing.join(', '));
    const gone = missing.filter(n => !OPTIONAL_MODELS.has(n));
    if (gone.length) say('MODELS MISSING: ' + gone.join(', ').toUpperCase(), true);
    startBtn.disabled = false;
    startBtn.textContent = 'Start';
  }

  // ---------- start card ----------
  const startModal = document.getElementById('startModal');
  loadModels();
  const sizeBtns = [...startModal.querySelectorAll('.sizes button')];
  let chosenFreq = 1;

  for (const b of sizeBtns) {
    b.addEventListener('click', () => {
      chosenFreq = +b.dataset.freq;
      for (const o of sizeBtns) o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
    });
  }

  startBtn.addEventListener('click', () => {
    startModal.classList.remove('open');
    if (chosenFreq !== freqIdx) {                    // only rebuild if it changed
      freqIdx = chosenFreq;
      makeGrid();
      randomise();
    }
    G.started = true;
    resetGame();                                     // picks the first bearing
  });

  // ---------- world menu ----------
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');

  function setMenu(open) {
    menuPanel.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setMenu(menuBtn.getAttribute('aria-expanded') !== 'true');
  });
  // the panel swallows its own clicks so picking an item does not close it
  // out from under the button that was just pressed
  menuPanel.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => setMenu(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

  // ---------- picking ----------
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();

  function cellForFace(f) {
    let lo = 0, hi = cellFaceStart.length - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (cellFaceStart[mid] <= f) lo = mid; else hi = mid - 1;
    }
    return lo;
  }

  function tapAt(clientX, clientY) {
    if (!tileMesh || G.over || !G.started || G.paused) return;
    ndc.x = (clientX / window.innerWidth) * 2 - 1;
    ndc.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObject(tileMesh, false)[0];
    if (!hit || hit.faceIndex === undefined) { hideUnitCard(); return; }
    const ci = cellForFace(hit.faceIndex);

    if (!G.build) {
      // no build mode armed: a tap inspects. Your building opens its card,
      // bare ground closes whatever card was up.
      if (buildingAt(ci)) openUnitCard(ci, clientX, clientY);
      else hideUnitCard();
      return;
    }
    // dead ground is off limits to everything except a recovery team, which
    // is the only thing that can be built there and the only way back
    if (G.build === 'recovery') {
      if (!cellDead[ci]) { say('RECOVERY TEAMS ONLY WORK LOST TILES'); return; }
      if (recoveryAt.has(ci)) { say('TEAM ALREADY WORKING'); return; }
      if (recoveries.length >= MAX_TURRETS) { say('RECOVERY LIMIT REACHED'); return; }
      if (G.gold < BAL.recoveryCost) { say('NOT ENOUGH GOLD'); return; }
      G.gold -= BAL.recoveryCost;
      const r = placeRecovery(ci);
      if (r) say('RECOVERY IN ' + r.need + (r.need === 1 ? ' WAVE' : ' WAVES'));
      return;
    }
    if (cellDead[ci]) { say('DEAD GROUND'); return; }
    // a fighter is based on a tile, not built on it, so it can sit over water
    const wet = cellType[ci] === 'lake';
    if (wet && G.build !== 'fighter' && G.build !== 'cannon') { say('CANNOT BUILD ON WATER'); return; }
    if (!wet && G.build === 'cannon') { say('SEA CANNON NEEDS WATER'); return; }
    if (towerAt.has(ci) || fighterAt.has(ci) || foundryAt.has(ci)) { say('TILE OCCUPIED'); return; }

    if (G.build === 'cannon') {
      if (G.gold < BAL.cannonCost) { say('NOT ENOUGH GOLD'); return; }
      if (!placeCannon(ci)) { say('CANNON LIMIT REACHED'); return; }
      G.gold -= BAL.cannonCost;
      return;
    }

    if (G.build === 'battery') {
      if (G.gold < BAL.batteryCost) { say('NOT ENOUGH GOLD'); return; }
      if (!placeBattery(ci)) { say('BATTERY LIMIT REACHED'); return; }
      G.gold -= BAL.batteryCost;
      return;
    }

    if (G.build === 'foundry') {
      if (foundries.length >= MAX_TURRETS) { say('FOUNDRY LIMIT REACHED'); return; }
      if (G.gold < BAL.foundryCost) { say('NOT ENOUGH GOLD'); return; }
      G.gold -= BAL.foundryCost;
      const fo = placeFoundry(ci);
      if (fo) say('FOUNDRY ' + fo.rate + ' GOLD/WAVE');
      return;
    }
    if (G.build === 'fighter') {
      if (fighters.length >= MAX_TURRETS) { say('FIGHTER LIMIT REACHED'); return; }
      if (G.gold < BAL.jetCost) { say('NOT ENOUGH GOLD'); return; }
      G.gold -= BAL.jetCost;
      placeFighter(ci);
      return;
    }
    if (towers.length >= MAX_TURRETS) { say('TURRET LIMIT REACHED'); return; }
    if (G.gold < BAL.turretCost) { say('NOT ENOUGH GOLD'); return; }
    G.gold -= BAL.turretCost;
    placeTurret(ci);
  }

  // =====================================================================
  //  UPGRADES
  //
  //  Three levels per building, paid for in place through the unit card
  //  that opens when you tap one of your buildings. The price is a share
  //  of the building's own cost times the level being bought, so growing a
  //  cheap turret stays cheap and a foundry tier costs real money. Guns
  //  gain damage and ceiling; foundries pay more. The upgrade dies with
  //  the building - a levelled turret is a bigger bet on the same square
  //  of ground, which is the point.
  // =====================================================================
  const UPG_BASE = {
    turret: 'turretCost', cannon: 'cannonCost', battery: 'batteryCost'
  };

  function buildingAt(ci) {
    return towerAt.get(ci) || fighterAt.get(ci) || foundryAt.get(ci) || recoveryAt.get(ci) || null;
  }

  function upgradeBase(ci) {
    const t = towerAt.get(ci);
    return t ? BAL[UPG_BASE[t.kind]] : fighterAt.has(ci) ? BAL.jetCost : BAL.foundryCost;
  }

  function upgradeAt(ci) {
    if (recoveryAt.has(ci)) return;          // a dig crew has nothing to level
    const b = buildingAt(ci);
    if (!b || b.level >= BAL.upgradeMax) return;
    const cost = BAL.upgradeCost(upgradeBase(ci), b.level + 1);
    if (G.gold < cost) { say('UPGRADE COSTS ' + cost + ' GOLD'); return; }
    G.gold -= cost;
    b.level++;
    if (towerAt.get(ci) === b) {
      b.dmg = Math.round(b.dmg * BAL.upgradeDmg);
      if (b.splashDmg) b.splashDmg = Math.round(b.splashDmg * BAL.upgradeDmg);
      b.ceiling += BAL.upgradeCeil;
    } else if (fighterAt.get(ci) === b) {
      b.dmg = Math.round(b.dmg * BAL.upgradeDmg);
    } else {
      b.rate = Math.ceil(b.rate * BAL.upgradeYield);
    }
    say('LEVEL ' + b.level);
  }

  function resetGame() {
    clearTurrets();
    clearFighters();
    clearFoundries();
    clearRecoveries();
    clearEnemies();
    clearDead();
    resetBullets();
    sCount = 0;
    smokeGeo.setDrawRange(0, 0);
    G.hp = G.hpMax; G.gold = BAL.startGold; G.wave = 0;
    G.inWave = false; G.breakLeft = BAL.breakTime; G.queue = [];
    G.over = false;
    G.paused = false;
    G.landed = 0;
    hideSummary();
    hideUnitCard();
    alertEl.classList.add('quiet');    // a sticky PLANET LOST must not
    alertUntil = 0;                    // outlive the game it belongs to
    G.ships.length = 0;
    hideMothers();
    G.bearing = null;
    pickBearing();
    setBuild(null);
    G.ready = true;
    updateHud();
  }

  // ---------- orbit ----------
  const orient = new THREE.Quaternion();
  const orientGoal = new THREE.Quaternion();
  const OFFSET = new THREE.Vector3(0, 0, 1);
  const UP = new THREE.Vector3(0, 1, 0);
  const RIGHT = new THREE.Vector3(1, 0, 0);
  const TARGET = new THREE.Vector3(0, 0, 0);
  const targetGoal = new THREE.Vector3(0, 0, 0);

  let distance = 6, distanceGoal = 6;
  let MIN_D = 1.15, MAX_D = 18;
  let velX = 0, velY = 0;
  let dragging = false, engaged = false;
  const pointers = new Map();
  let pinchStart = 0, pinchDist = 0;
  let downX = 0, downY = 0, downT = 0, moved = 0;
  const TAP_SLOP = 8, TAP_MS = 600;
  const qTmp = new THREE.Quaternion(), qA = new THREE.Quaternion(), qB = new THREE.Quaternion();
  const tmpDir = new THREE.Vector3();

  // Rotate the globe about its own centre, around the axes the camera is
  // actually looking along, so a drag pushes the surface the way the finger
  // goes no matter where on the ball you are.
  const spinAxis = new THREE.Vector3(), qSpin = new THREE.Quaternion();

  function spinWorld(dx, dy) {
    worldTween = false;              // a hand on the planet beats the auto-swing
    camera.updateMatrixWorld();
    spinAxis.setFromMatrixColumn(camera.matrixWorld, 1).normalize();   // camera up
    qSpin.setFromAxisAngle(spinAxis, dx);
    world.quaternion.premultiply(qSpin);
    spinAxis.setFromMatrixColumn(camera.matrixWorld, 0).normalize();   // camera right
    qSpin.setFromAxisAngle(spinAxis, dy);
    world.quaternion.premultiply(qSpin);
  }

  // one entry point for drag, inertia, drift and the arrow keys: in surface
  // view the world turns, otherwise the camera orbits
  function applySpin(vx, vy) {
    if (surfaceView) spinWorld(-vx, -vy); else rotateBy(vx, vy);
  }

  function rotateBy(dx, dy) {
    qTmp.setFromAxisAngle(UP, dx);    orient.multiply(qTmp);
    qTmp.setFromAxisAngle(RIGHT, dy); orient.multiply(qTmp);
    orientGoal.copy(orient);          // a live drag cancels any running tween
  }
  function applyCamera() {
    camera.position.copy(OFFSET).applyQuaternion(orient).multiplyScalar(distance).add(TARGET);
    camera.up.copy(UP).applyQuaternion(orient);
    camera.lookAt(TARGET);
  }

  // =====================================================================
  //  Two camera modes.
  //
  //  The framed cap sits 39 degrees off the pole, holds about 11% of the
  //  surface area and is 1.26 across. Over that span the surface drops 0.22,
  //  so it reads as a gently domed plane rather than a ball.
  //
  //  The cap is fitted to the frame HEIGHT, never its width. Fitting the width
  //  on a portrait phone would need a distance near 2.8, which puts the whole
  //  sphere back in frame and defeats the point; cropping the sides instead
  //  keeps the view close at every aspect ratio.
  // =====================================================================
  const viewBtn = document.getElementById('viewBtn');
  const CAP_RIM = 0.6323;            // sin(39.2 deg)
  const SURFACE_TILT = 0.50;         // radians above the local tangent plane
  let surfaceView = false;

  const rimPt = new THREE.Vector3(), rimV = new THREE.Vector3();
  const camF = new THREE.Vector3(), camU = new THREE.Vector3(), camC = new THREE.Vector3();

  // half-angle subtended by the cap rim, vertically, from distance d
  function rimHalfAngle(d) {
    const st = Math.sin(SURFACE_TILT), ct = Math.cos(SURFACE_TILT);
    camC.set(0, RADIUS + st * d, ct * d);
    camF.set(0, -st, -ct);
    camU.set(0, ct, -st);
    const y = Math.sqrt(Math.max(RADIUS * RADIUS - CAP_RIM * CAP_RIM, 0));
    let worst = 0;
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * Math.PI * 2;
      rimPt.set(CAP_RIM * Math.sin(a), y, CAP_RIM * Math.cos(a));
      rimV.subVectors(rimPt, camC);
      const depth = rimV.dot(camF);
      if (depth <= 1e-6) continue;
      worst = Math.max(worst, Math.abs(Math.atan2(rimV.dot(camU), depth)));
    }
    return worst;
  }

  // solved rather than hardcoded, so editing CAP_RIM or SURFACE_TILT stays sane
  function surfaceDistance() {
    const goal = THREE.MathUtils.degToRad(camera.fov) / 2 * 0.95;
    let lo = 0.4, hi = 8;
    for (let i = 0; i < 40; i++) {
      const mid = (lo + hi) / 2;
      if (rimHalfAngle(mid) > goal) lo = mid; else hi = mid;
    }
    return hi;
  }

  function setView(on) {
    surfaceView = on;
    viewBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    viewBtn.textContent = on ? 'Whole sphere' : 'Surface view';
    engaged = true;                  // stop the idle drift fighting the tween
    velX = velY = 0;                 // don't carry a camera flick into a world spin

    // swing up from wherever the camera already is, so the move reads as one
    // continuous motion instead of a cut
    tmpDir.copy(OFFSET).applyQuaternion(orient);
    const az = Math.atan2(tmpDir.x, tmpDir.z);

    if (on) {
      targetGoal.set(0, RADIUS, 0);
      MIN_D = 0.3; MAX_D = 4.5;
      distanceGoal = surfaceDistance();
      qA.setFromAxisAngle(UP, az);
      qB.setFromAxisAngle(RIGHT, -SURFACE_TILT);
      orientGoal.copy(qA).multiply(qB);
    } else {
      targetGoal.set(0, 0, 0);
      MIN_D = 1.15; MAX_D = 18;
      distanceGoal = 6;
      qA.setFromAxisAngle(UP, az);
      qB.setFromAxisAngle(RIGHT, -0.35);
      orientGoal.copy(qA).multiply(qB);
    }
  }

  // ---------- placement ----------
  const gridBtn = document.getElementById('gridBtn');
  const randBtn = document.getElementById('randBtn');
  const countEl = document.getElementById('count');
  const hint = document.getElementById('hint');

  gridBtn.addEventListener('click', () => {
    freqIdx = (freqIdx + 1) % FREQS.length;
    makeGrid();
    randomise();                     // a new grid deserves a world on it
  });
  randBtn.addEventListener('click', randomise);
  viewBtn.addEventListener('click', () => setView(!surfaceView));

  function updateCount() {
    if (!cellType) return;
    let land = 0, water = 0;
    for (const t of cellType) t === 'lake' ? water++ : land++;
    countEl.textContent = land + ' land / ' + water + ' water';
  }

  // ---------- input ----------
  function engage() {
    engaged = true;
  }
  function speed() { return 0.005 * (camera.fov / 45); }

  stage.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.setPointerCapture(e.pointerId);
    dragging = true;
    stage.classList.add('dragging');
    velX = velY = 0;
    engage();
    downX = e.clientX; downY = e.clientY; downT = performance.now(); moved = 0;
    if (pointers.size === 2) { pinchStart = pinchSpan(); pinchDist = distanceGoal; }
  });

  stage.addEventListener('pointermove', (e) => {
    const prev = pointers.get(e.pointerId);
    if (!prev) {
      return;
    }
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    prev.x = e.clientX; prev.y = e.clientY;
    moved = Math.max(moved, Math.hypot(e.clientX - downX, e.clientY - downY));

    if (pointers.size >= 2) {
      const span = pinchSpan();
      if (pinchStart > 0) distanceGoal = clamp(pinchDist * (pinchStart / span), MIN_D, MAX_D);
      return;
    }
    velX = -dx * speed();
    velY = -dy * speed();
    applySpin(velX, velY);
  });

  function release(e, isTapCandidate) {
    const wasSingle = pointers.size === 1;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = 0;
    if (pointers.size === 0) { dragging = false; stage.classList.remove('dragging'); }
    if (isTapCandidate && wasSingle && moved < TAP_SLOP &&
        performance.now() - downT < TAP_MS) {
      tapAt(e.clientX, e.clientY);
    }
  }
  stage.addEventListener('pointerup', (e) => release(e, true));
  stage.addEventListener('pointercancel', (e) => release(e, false));
  stage.addEventListener('lostpointercapture', (e) => release(e, false));

  function pinchSpan() {
    const p = [...pointers.values()];
    if (p.length < 2) return 0;
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
  }

  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    engage();
    distanceGoal = clamp(distanceGoal * (1 + Math.sign(e.deltaY) * 0.1), MIN_D, MAX_D);
  }, { passive: false });

  stage.addEventListener('keydown', (e) => {
    const step = 0.06;
    const map = {
      ArrowLeft: [step, 0], ArrowRight: [-step, 0],
      ArrowUp: [0, step], ArrowDown: [0, -step]
    };
    if (map[e.key]) { e.preventDefault(); engage(); applySpin(map[e.key][0], map[e.key][1]); }
    if (e.key === '+' || e.key === '=') distanceGoal = clamp(distanceGoal - 0.5, MIN_D, MAX_D);
    if (e.key === '-' || e.key === '_') distanceGoal = clamp(distanceGoal + 0.5, MIN_D, MAX_D);
    if (e.key === 'v' || e.key === 'V') setView(!surfaceView);
    if (e.key === 'r' || e.key === 'R') randomise();
    if (e.key === 'b' || e.key === 'B') setBuild(G.build === 'turret' ? null : 'turret');
    if (e.key === 'f' || e.key === 'F') setBuild(G.build === 'fighter' ? null : 'fighter');
    if (e.key === 'g' || e.key === 'G') setBuild(G.build === 'foundry' ? null : 'foundry');
    if (e.key === 'c' || e.key === 'C') setBuild(G.build === 'cannon' ? null : 'cannon');
    if (e.key === 'm' || e.key === 'M') setBuild(G.build === 'battery' ? null : 'battery');
    if (e.key === 'x' || e.key === 'X') setBuild(G.build === 'recovery' ? null : 'recovery');
  });

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  let readoutTick = 0;

  let lastT = performance.now();

  function frame() {
    requestAnimationFrame(frame);
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);   // a hidden tab must not
    lastT = now;                                       // land a whole wave at once

    if (worldTween && !dragging) {
      world.quaternion.slerp(qWorldGoal, 0.05);
      if (world.quaternion.angleTo(qWorldGoal) < 0.01) worldTween = false;
    }
    gameTick(dt);

    // the next drop zone flashes slowly through the break so it cannot be
    // missed on the far side of a busy planet; once the wave is live the
    // ring holds steady. Reduced motion keeps it steady throughout.
    zoneMat.opacity = (G.started && !G.over && !G.inWave && !reduced)
      ? 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(now * 0.003))
      : 0.9;

    if (!dragging) {
      if (Math.abs(velX) > 1e-5 || Math.abs(velY) > 1e-5) {
        velX *= 0.94; velY *= 0.94;
        applySpin(velX, velY);
      } else if (!engaged && !reduced) {
        applySpin(0.0016, 0);
      }
    }
    if (!dragging) orient.slerp(orientGoal, 0.12);
    TARGET.lerp(targetGoal, 0.12);
    distance += (distanceGoal - distance) * 0.12;
    applyCamera();
    if (++readoutTick % 4 === 0) updateHud();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    smokeMat.uniforms.uScale.value = window.innerHeight * 0.5;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  makeGrid();
  randomise();                       // a world to look at behind the start card
  updateHud();
  rotateBy(0.5, -0.35);
  orientGoal.copy(orient);
  applyCamera();
  frame();

})();
</script>
</body>
</html>
