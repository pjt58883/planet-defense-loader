        fA1.subVectors(fPos, f.prevPos);
        if (fA1.lengthSq() > 1e-14) {
          f.vel.lerp(fA1.normalize(), Math.min(1, dt * 14));
          if (f.vel.lengthSq() > 1e-8) f.vel.normalize();
          else f.vel.copy(f.head);
        }
        f.prevPos.copy(fPos);
        // the one cosmetic on top is the bank roll - the nose itself stays
        // exactly on the flight path, never yawed off it
        writeJetPose(i, f, f.vel);
        fZ.copy(f.vel).multiplyScalar(-1);         // exhaust out the back

        f.emit += dt;
        while (f.emit >= BAL.flameGap) {
          f.emit -= BAL.flameGap;
          flame(fPos, fZ, JET_LEN * 0.48 * f.k, tiles.meanInr * 0.16, BAL.flameLife);
        }
      }
    }
    if (jetMesh && fighters.length) jetMesh.instanceMatrix.needsUpdate = true;
    if (jetOutlineMesh) {
      jetOutlineMesh.count = fighters.length;
      if (fighters.length) jetOutlineMesh.instanceMatrix.needsUpdate = true;
    }
  }

  //  A landing flattens EVERYTHING on the tile. Since the landing pad, a
  //  hex holds one occupant, but the sweep stays general so old saves or
  //  future stacking cannot leak a survivor.
  function demolish(ci) {
    const lost = [];
    if (towerAt.has(ci)) {
      const kind = towerAt.get(ci).kind;
      towerAt.get(ci).alive = false;      // orbital shells still in flight fizzle
      towers.splice(towers.indexOf(towerAt.get(ci)), 1);
      towerAt.delete(ci);
      rebuildEmplacements();
      lost.push(kind === 'cannon' ? 'SEA CANNON' : kind === 'battery' ? 'BATTERY' : 'TURRET');
    }
    if (fighterAt.has(ci)) {
      fighters.splice(fighters.indexOf(fighterAt.get(ci)), 1);
      fighterAt.delete(ci);
      if (jetMesh) jetMesh.count = fighters.length;
      if (jetOutlineMesh) jetOutlineMesh.count = fighters.length;
      lost.push('FIGHTER');
    }
    if (removeRecovery(ci)) lost.push('RECOVERY TEAM');
    if (removeSat(ci)) lost.push('SATELLITE');
    return lost.length ? lost.join(' + ') + ' LOST' : null;
  }

  // =====================================================================
  //  THE MOTHERSHIP
  //
  //  Difficulty is a distance now. The juggernaut warps in, sits off the
  //  planet, and the break timer is the countdown to it opening its bays.
  //  Early on it comes in close and can only throw vipers at a small cap of
  //  ground. Later it launches from much further out, and the cone it can
  //  reach widens until it covers most of a hemisphere. Nothing about the
  //  turrets changes; the map they have to cover does.
  // =====================================================================
  //  From wave 5 a second juggernaut arrives, another every five after
  //  that. They pick separate bearings, so late waves are not one front you
  //  can stand in but several you have to choose between.
  const MAX_SHIPS = 8;
  const motherMeshes = [];

  function shipCountFor(w) { return Math.min(MAX_SHIPS, 1 + Math.floor(w / BAL.shipEvery)); }

  const MOTHER_LEN = 1.899;
  const moX = new THREE.Vector3(), moY = new THREE.Vector3(), moZ = new THREE.Vector3(),
        moBasis = new THREE.Matrix4(), moQ = new THREE.Quaternion();

  // progress from the first wave to the widest launch, 0..1
  function ramp(w) {
    return Math.min(1, Math.max(0, (w - 1) / Math.max(1, BAL.rampWaves - 1)));
  }
  function shipDistFor(w)  { const t = ramp(w); return BAL.shipNear + (BAL.shipFar - BAL.shipNear) * t; }

  function placeMothers() {
    for (let i = 0; i < MAX_SHIPS; i++) {
      const m = motherMeshes[i];
      if (!m) continue;
      const s = G.ships[i];
      if (!s) { m.visible = false; continue; }
      m.position.copy(s.bearing).multiplyScalar(s.dist);
      // nose down the bearing, toward the planet it is about to seed
      moZ.copy(s.bearing);                     // model nose is -Z, so +Z is up-bearing
      moY.set(0, 1, 0);
      if (Math.abs(moY.dot(moZ)) > 0.9) moY.set(1, 0, 0);
      moY.addScaledVector(moZ, -moY.dot(moZ)).normalize();
      moX.crossVectors(moY, moZ).normalize();
      moBasis.makeBasis(moX, moY, moZ);
      m.quaternion.setFromRotationMatrix(moBasis);
      m.scale.setScalar(BAL.motherSize / MOTHER_LEN);
      m.visible = true;
    }
  }

  function hideMothers() {
    for (const m of motherMeshes) m.visible = false;
    for (const r of zoneRings) r.visible = false;
    for (const c of zoneCaps) c.visible = false;
  }

  // =====================================================================
  //  SEA CANNON
  //
  //  Three parts stacked on one water hex: a pontoon deck floating at the
  //  water line, a round weapons mount seated on the deck, and the same gun
  //  the land turret uses dropped into the mount's socket. Water used to be
  //  dead ground you could only fly over; this is the thing you build on it.
  // =====================================================================
  const PLAT_R = 1.236;        // pontoon deck, widest radius in model units
  const PLAT_DECK = 0.60;      // clear deck height at the middle of it
  const CORE_R = 1.014;        // weapons mount radius
  const CORE_FIT = 0.42;       // how much of the deck the mount is allowed
  const CORE_SEAT = 0.70;      // ball centre, in mount units above its base
  const CORE_GUN = 0.55;       // gun scale relative to the mount

  let platMesh = null, coreMesh = null;

  function placeCannon(ci) {
    if (towers.length >= MAX_TURRETS) return null;
    const f = tileFit(ci);
    const up = f.up;
    const kp = f.fit / PLAT_R;                       // deck spans the hex
    const kc = kp * (PLAT_R * CORE_FIT) / CORE_R;    // mount fits the clear deck
    const kg = kc * CORE_GUN;

    // the deck floats at the water line, which sits below the land shelf
    const base = RADIUS - WATER_DROP;
    const deckY = base + PLAT_DECK * kp;
    const seatY = deckY + CORE_SEAT * kc;

    const tur = {
      ci, kind: 'cannon', k: kg, level: 1,
      up: up.clone(),
      seat: up.clone().multiplyScalar(seatY),
      aimQ: new THREE.Quaternion().setFromUnitVectors(LOCAL_UP, up),
      aimDir: up.clone(),
      pos: up.clone().multiplyScalar(seatY + GUN_TIP * kg),
      cover: ringSet(ci, BAL.range + BAL.cannonRange),
      ceiling: BAL.ceiling + BAL.cannonCeiling,
      rate: BAL.cannonRate, dmg: BAL.cannonDmg, cool: 0,
      turn: BAL.gunTurn
    };

    // both hulls share the tile's axis, so the stack cannot drift apart
    mQuat.setFromUnitVectors(LOCAL_UP, up);
    mPos.copy(up).multiplyScalar(base);
    mScale.setScalar(kp);
    tur.platMat = new THREE.Matrix4().compose(mPos, mQuat, mScale);
    mPos.copy(up).multiplyScalar(deckY);
    mScale.setScalar(kc);
    tur.coreMat = new THREE.Matrix4().compose(mPos, mQuat, mScale);

    armour(tur);
    towers.push(tur);
    towerAt.set(ci, tur);
    rebuildEmplacements();              // also writes the gun, or it would
    return tur;                         // render at the origin until the first shot
  }

  // =====================================================================
  //  MISSILE BATTERY
  //
  //  The anti-crowd emplacement. One slow, heavy missile that homes,
  //  bursts on impact and damages everything near the hit, where a turret
  //  only ever kills what it aimed at. It engages higher than anything
  //  else. The launcher rides the same pad as the railgun turret and
  //  swivels on the pad's socket exactly like the gun does, so it angles
  //  toward whatever it is committed to and stands upright at rest.
  // =====================================================================
  //  The launcher model's measured footprint radius is 0.527; the divisor
  //  keeps it at ~62% of the tile so it sits inside the pad it rides.
  const BATTERY_R = 0.85;      // footprint divisor, model units
  const BATTERY_H = 1.899;     // muzzle = model top, in model units above the seat
  //  A slimmer barrel, recentred: the launcher runs at 80% size, and its
  //  seat drops with it so the smaller assembly nests centred in the
  //  pad's socket instead of perching on the rim.
  const BATTERY_FIT = 0.80;
  const BATTERY_SEAT = 0.85;   // fraction of the railgun's ball height it sits at

  let batteryMesh = null;

  function placeBattery(ci) {
    if (towers.length >= MAX_TURRETS) return null;
    const f = tileFit(ci);
    const up = f.up;
    const kp = f.fit / PAD_R;                 // the railgun's own pad
    const k = f.fit * BATTERY_FIT / BATTERY_R;   // the launcher riding its socket
    const seatY = RADIUS + GUN_SEAT * BATTERY_SEAT * kp;

    const tur = {
      ci, kind: 'battery', k, level: 1,
      up: up.clone(),
      seat: up.clone().multiplyScalar(seatY),
      aimQ: new THREE.Quaternion().setFromUnitVectors(LOCAL_UP, up),
      aimDir: up.clone(),
      pos: up.clone().multiplyScalar(seatY + BATTERY_H * k),
      cover: ringSet(ci, BAL.batteryRange),
      ceiling: BAL.batteryCeiling,
      rate: BAL.batteryRate, dmg: BAL.batteryDmg,
      splashDmg: BAL.splashDmg, cool: 0,
      tubes: new Array(BAL.batteryTubes).fill(0),   // per-tube reload timers
      turn: BAL.batteryTurn
    };
    if (modelsOK) {
      mPos.copy(up).multiplyScalar(RADIUS - f.fit * 0.04);
      mQuat.setFromUnitVectors(LOCAL_UP, up);
      mScale.setScalar(kp);
      tur.padMat = new THREE.Matrix4().compose(mPos, mQuat, mScale);
    }
    armour(tur);
    towers.push(tur);
    towerAt.set(ci, tur);
    rebuildEmplacements();
    return tur;
  }

  function writeBattery(t) {
    if (!batteryMesh || !(t.batSlot >= 0)) return;
    mScale.setScalar(t.k);
    batteryMesh.setMatrixAt(t.batSlot, mMat.compose(t.seat, t.aimQ, mScale));
  }

  //  Turrets, cannons and batteries live in one list so targeting, firing
  //  and demolition need no special cases, but each draws from its own
  //  meshes. Slots are reassigned from scratch whenever the list changes,
  //  which is rare and keeps every index honest after a removal. Batteries
  //  carry no gun barrel, so gun slots are compacted over the rest and each
  //  tower remembers its own (gunSlot -1 means none).
  function rebuildEmplacements() {
    let pads = 0, plats = 0, bats = 0, guns = 0;
    for (const t of towers) {
      if (t.kind === 'cannon') {
        if (platMesh) { platMesh.setMatrixAt(plats, t.platMat); coreMesh.setMatrixAt(plats, t.coreMat); }
        plats++;
      } else if (t.kind === 'battery') {
        if (modelsOK) padMesh.setMatrixAt(pads, t.padMat);   // it rides a railgun pad
        pads++;
        t.batSlot = bats++;
        writeBattery(t);
      } else {
        if (modelsOK) padMesh.setMatrixAt(pads, t.padMat);
        pads++;
      }
      t.gunSlot = t.kind === 'battery' ? -1 : guns++;
      writeGun(t);
    }
    if (modelsOK) { padMesh.count = pads; padMesh.instanceMatrix.needsUpdate = true; }
    if (platMesh) {
      platMesh.count = plats; coreMesh.count = plats;
      platMesh.instanceMatrix.needsUpdate = true;
      coreMesh.instanceMatrix.needsUpdate = true;
    }
    if (batteryMesh) { batteryMesh.count = bats; batteryMesh.instanceMatrix.needsUpdate = true; }
    if (modelsOK) { gunMesh.count = guns; gunMesh.instanceMatrix.needsUpdate = true; }
  }

  // ---------- dead ground ----------
  //  A landing kills its hex for the rest of the run: whatever stood there
  //  is lost, the tile is crossed out in red, and nothing can be built on
  //  it again. Dead ground is the scar a wave leaves behind - integrity
  //  heals nothing back, so the map itself keeps the score.
  let cellDead = null;                 // one flag per cell, set by landings
  let cellDeadWave = null;             // wave each dead cell was lost on
  const deadTris = new Map();          // ci -> X-marker triangles, so a tile can be cleared again
  let deadMesh = null;
  const deadMat = new THREE.MeshBasicMaterial({
    color: 0xff2f2f, transparent: true, opacity: 0.9,
    depthWrite: false, side: THREE.DoubleSide
  });

  function rebuildDeadMesh() {
    if (deadMesh) { world.remove(deadMesh); deadMesh.geometry.dispose(); deadMesh = null; }
    if (!deadTris.size) return;
    let n = 0;
    for (const a of deadTris.values()) n += a.length;
    const pos = new Float32Array(n);
    let o = 0;
    for (const a of deadTris.values()) { pos.set(a, o); o += a.length; }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    deadMesh = new THREE.Mesh(g, deadMat);
    deadMesh.frustumCulled = false;
    world.add(deadMesh);
  }

  function killHex(ci) {
    if (cellDead[ci]) return;
    cellDead[ci] = 1;
    cellDeadWave[ci] = G.wave;
    unlock('recovery');              // the first scar opens the dig yard

    const f = tileFit(ci);
    const up = f.up;
    const e1 = new THREE.Vector3(0, 0, 1);
    if (Math.abs(up.z) > 0.9) e1.set(1, 0, 0);
    e1.addScaledVector(up, -e1.dot(up)).normalize();
    const e2 = new THREE.Vector3().crossVectors(up, e1);

    // two bars at right angles; each is a short strip of quads projected
    // back onto the sphere so the X hugs the ground instead of chording it
    const out = [];
    const L = f.fit * 0.82, W = f.fit * 0.16, SEG = 6;
    const dir = new THREE.Vector3(), side = new THREE.Vector3();
    for (const ang of [Math.PI / 4, -Math.PI / 4]) {
      dir.copy(e1).multiplyScalar(Math.cos(ang)).addScaledVector(e2, Math.sin(ang));
      side.crossVectors(up, dir).normalize();
      const p = (t, w) => new THREE.Vector3().copy(up).multiplyScalar(RADIUS)
        .addScaledVector(dir, t).addScaledVector(side, w).setLength(RADIUS * 1.004);
      for (let s = 0; s < SEG; s++) {
        const t0 = -L + (2 * L * s) / SEG, t1 = -L + (2 * L * (s + 1)) / SEG;
        const a = p(t0, -W), b = p(t0, W), c = p(t1, W), d = p(t1, -W);
        out.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z,
                 a.x, a.y, a.z, c.x, c.y, c.z, d.x, d.y, d.z);
      }
    }
    deadTris.set(ci, new Float32Array(out));
    rebuildDeadMesh();
  }

  //  The one way a scar comes back: a recovery team finishes its dig and
  //  the X is lifted off the tile.
  function reviveHex(ci) {
    if (!cellDead[ci]) return;
    cellDead[ci] = 0;
    cellDeadWave[ci] = -1;
    deadTris.delete(ci);
    rebuildDeadMesh();
  }

  function clearDead() {
    if (cellDead) cellDead.fill(0);
    if (cellDeadWave) cellDeadWave.fill(-1);
    deadTris.clear();
    rebuildDeadMesh();
  }

  // =====================================================================
  //  RECOVERY TEAMS
  //
  //  The only building that goes on ground the enemy has taken. A team digs
  //  a crossed-out tile back out, and the dig costs one wave for every wave
  //  the tile has been lost, so scars you leave alone get more expensive to
  //  undo. When the timer runs out the X comes off, the team packs up, and
  //  the tile is buildable ground again.
  // =====================================================================
  const RECOV_R = 1.27;                 // footprint divisor, model units;
                                        // padded a quarter over the raw fit
                                        // so the team reads as a small crew
  const recoveries = [];
  const recoveryAt = new Map();
  let recoveryMesh = null;
  const rQ = new THREE.Quaternion(), rSpin = new THREE.Quaternion();

  function recoveryWavesFor(ci) {
    const since = cellDeadWave[ci] < 0 ? 1 : G.wave - cellDeadWave[ci];
    return Math.max(1, since);
  }

  function rebuildRecoveryMesh() {
    if (!recoveryMesh) return;
    for (let i = 0; i < recoveries.length; i++) recoveryMesh.setMatrixAt(i, recoveries[i].mat);
    recoveryMesh.count = recoveries.length;
    recoveryMesh.instanceMatrix.needsUpdate = true;
  }

  function placeRecovery(ci) {
    if (recoveries.length >= MAX_TURRETS) return null;
    const f = tileFit(ci);
    const need = recoveryWavesFor(ci);
    const r = {
      ci, kind: 'recovery', level: 1, need, left: need,
      up: f.up.clone(), mat: new THREE.Matrix4(),
      // the dig crew shoots back: short-reach sidearms that only matter
      // when something is coming down on top of them
      cover: ringSet(ci, BAL.recoveryRange),
      ceiling: BAL.recoveryCeiling,
      rate: BAL.recoveryRate, dmg: BAL.recoveryDmg, cool: 0,
      pos: f.up.clone().multiplyScalar(RADIUS + f.fit * 0.5)
    };
    recoveries.push(r);
    recoveryAt.set(ci, r);

    mPos.copy(f.up).multiplyScalar(RADIUS - f.fit * 0.05);
    rQ.setFromUnitVectors(LOCAL_UP, f.up);
    rSpin.setFromAxisAngle(LOCAL_UP, Math.random() * Math.PI * 2);
    rQ.multiply(rSpin);
    mScale.setScalar(f.fit / RECOV_R);
    r.mat.compose(mPos, rQ, mScale);
    rebuildRecoveryMesh();
    return r;
  }

  function removeRecovery(ci) {
    const r = recoveryAt.get(ci);
    if (!r) return false;
    recoveries.splice(recoveries.indexOf(r), 1);
    recoveryAt.delete(ci);
    rebuildRecoveryMesh();
    return true;
  }

  function clearRecoveries() {
    recoveries.length = 0;
    recoveryAt.clear();
    if (recoveryMesh) recoveryMesh.count = 0;
  }

  //  One tick per wave cleared: finished teams hand their tile back, and
  //  every reclaimed hex restores a share of the planet's defense.
  function tickRecoveries() {
    let done = 0;
    for (const r of recoveries.slice()) {
      r.left--;
      if (r.left <= 0) { reviveHex(r.ci); removeRecovery(r.ci); done++; }
    }
    if (done) {
      G.hp = Math.min(G.hpMax, G.hp + BAL.recoverHeal * G.hpMax * done);
      const heal = Math.round(BAL.recoverHeal * 100 * done);
      say((done === 1 ? 'TILE RECOVERED' : done + ' TILES RECOVERED') + ' · +' + heal + '% DEFENSE');
    }
  }


  // ---------- descending drops ----------
  const MAX_ALIENS = 400;
  //  Model length per enemy type, in model units. Placeholders are built to
  //  the viper's length so the size maths is identical either way; when a
  //  real hulk or dart GLB lands in public/assets, measure it and update
  //  its entry here.
  // dart = viper model's length; dread = its placeholder slab until a GLB lands
  const ENEMY_LEN = { viper: 1.898, hulk: 1.898, dart: 1.884, dread: 1.900 };
  const VIPER_LEN = 1.884;           // placeholder cones are built to this

  // one instanced mesh per enemy type, all drawn from the same alien list
  function protoEnemyMesh(color, emissive) {
    const m = new THREE.InstancedMesh(
      new THREE.OctahedronGeometry(1, 0),      // stand-in until models arrive
      new THREE.MeshStandardMaterial({ color, emissive }),
      MAX_ALIENS
    );
    m.count = 0;
    m.frustumCulled = false;
    world.add(m);
    return m;
  }
  const enemyMeshes = {
    viper: protoEnemyMesh(0xb45cff, 0x3a0d5c),
    hulk:  protoEnemyMesh(0xc03a28, 0x400d08),
    dart:  protoEnemyMesh(0x58c8ff, 0x0d2c48),
    dread: protoEnemyMesh(0x8a2c50, 0x2c0d1a)
  };

  //  Inverted-hull outlines: each enemy mesh gets a back-face twin drawn a
  //  few percent larger in the same slot, so every hostile carries a light
  //  red silhouette that separates it from terrain and sky alike.
  const OUTLINE_SCALE = 1.06;
  const outlineMat = new THREE.MeshBasicMaterial({ color: 0xe01f14, side: THREE.BackSide });      // hostile: the integrity bar's red
  const allyOutlineMat = new THREE.MeshBasicMaterial({ color: 0x14e01f, side: THREE.BackSide });  // friendly: the same, in green

  //  Friendly outlines for the buildings. Each building mesh gets a green
  //  back-face twin whose instance matrices are mirrored from the original
  //  with a local scale-up, so whatever moves (gun barrels, launchers)
  //  drags its outline along for free.
  let padOutline = null, gunOutline = null, platOutline = null, coreOutline = null,
      batteryOutline = null, recoveryOutline = null;
  const OUTLINE_M = new THREE.Matrix4().makeScale(OUTLINE_SCALE, OUTLINE_SCALE, OUTLINE_SCALE);
  const oTmp = new THREE.Matrix4();

  function makeAllyOutline(geo, max) {
    const m = new THREE.InstancedMesh(geo, allyOutlineMat, max);
    m.count = 0;
    m.frustumCulled = false;
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    world.add(m);
    return m;
  }

  function mirrorOutline(src, dst) {
    if (!src || !dst) return;
    for (let i = 0; i < src.count; i++) {
      oTmp.fromArray(src.instanceMatrix.array, i * 16).multiply(OUTLINE_M);
      dst.setMatrixAt(i, oTmp);
    }
    dst.count = src.count;
    dst.instanceMatrix.needsUpdate = true;
  }
  const outlineMeshes = {};
  for (const t in enemyMeshes) {
    const m = new THREE.InstancedMesh(enemyMeshes[t].geometry, outlineMat, MAX_ALIENS);
    m.count = 0;
    m.frustumCulled = false;
    world.add(m);
    outlineMeshes[t] = m;
  }

  //  The dreadnaught's cannon: its own instanced mesh (plus hostile outline)
  //  slung under each hull, slewed onto whatever that ship is shelling.
  let dreadGunMesh = null, dreadGunOutline = null;
  let DREAD_GUN_DROP = 0.42;        // ball-centre depth under the hull centre; measured in buildModels
  const DREAD_GUN_K = 0.55;         // cannon scale relative to the hull

  //  Energy shields: one faint red shell per shielded enemy, drawn until
  //  the hull under it has lost the roster's shield fraction of its health.
  const SHIELD_R = 1.2;                // shell radius, in enemy scale units
  const shieldMesh = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1, 16, 12),
    new THREE.MeshBasicMaterial({
      color: 0xff2f2f, transparent: true, opacity: 0.10, depthWrite: false
    }),
    MAX_ALIENS
  );
  shieldMesh.count = 0;
  shieldMesh.frustumCulled = false;
  world.add(shieldMesh);

  function clearEnemies() {
    aliens.length = 0;
    for (const t in enemyMeshes) {
      enemyMeshes[t].count = 0;
      outlineMeshes[t].count = 0;
    }
    if (dreadGunMesh) dreadGunMesh.count = 0;
    if (dreadGunOutline) dreadGunOutline.count = 0;
    shieldMesh.count = 0;
  }
  const dummy = new THREE.Object3D();

  // ---------- shells and smoke ----------
  //
  //  Shells are real objects with flight time, not instant hitscan. That
  //  introduces the classic overkill problem: three turrets all fire at the
  //  same pod, it dies to the first shell and the other two are wasted. So
  //  damage is RESERVED at the muzzle and released on impact, and targeting
  //  ignores anything already dead on paper.
  const BULLET_MAX = 256;
  const bullets = [];

  //  Two projectile models: the railgun slug fired by turrets/sea cannons
  //  and the heavier battery missile. Both are instanced and swapped in by
  //  buildModels once the GLBs land; until then nothing is in flight.
  let shellMesh = null, missileMesh = null;
  function resetBullets() {
    bullets.length = 0;
    if (shellMesh) shellMesh.count = 0;
    if (missileMesh) missileMesh.count = 0;
  }


  // Smoke is one Points object with a per-particle size and alpha, so a few
  // thousand puffs cost one draw call. PointsMaterial cannot fade per
  // particle in this build of three, hence the small shader.
  const SMOKE_MAX = 6000;    // shared by shell smoke and every engine flame
  const sPos = new Float32Array(SMOKE_MAX * 3);
  const sCol = new Float32Array(SMOKE_MAX * 3);
  const sSize = new Float32Array(SMOKE_MAX);
  const sAlpha = new Float32Array(SMOKE_MAX);
  const sLife = new Float32Array(SMOKE_MAX);
  const sMax = new Float32Array(SMOKE_MAX);
  const sS0 = new Float32Array(SMOKE_MAX);
  const sS1 = new Float32Array(SMOKE_MAX);
  const sA0 = new Float32Array(SMOKE_MAX);
  let sCount = 0;

  const smokeGeo = new THREE.BufferGeometry();
  smokeGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  smokeGeo.setAttribute('pcolor', new THREE.BufferAttribute(sCol, 3));
  smokeGeo.setAttribute('psize', new THREE.BufferAttribute(sSize, 1));
  smokeGeo.setAttribute('palpha', new THREE.BufferAttribute(sAlpha, 1));
  smokeGeo.setDrawRange(0, 0);

  // shared by the smoke and the starfield: round soft points with
  // per-particle colour, size and alpha
  const POINT_VERT = `
      attribute vec3 pcolor;
      attribute float psize;
      attribute float palpha;
      varying vec3 vCol;
      varying float vAlpha;
      uniform float uScale;
      void main() {
        vCol = pcolor;
        vAlpha = palpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = psize * (uScale / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`;
  const POINT_FRAG = `
      varying vec3 vCol;
      varying float vAlpha;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d = dot(c, c);
        if (d > 0.25) discard;
        gl_FragColor = vec4(vCol, vAlpha * (1.0 - smoothstep(0.02, 0.25, d)));
      }`;

  const smokeMat = new THREE.ShaderMaterial({
    uniforms: { uScale: { value: window.innerHeight * 0.5 } },
    transparent: true,
    depthWrite: false,
    vertexShader: POINT_VERT,
    fragmentShader: POINT_FRAG
  });

  const smoke = new THREE.Points(smokeGeo, smokeMat);
  smoke.frustumCulled = false;
  smoke.renderOrder = 2;
  world.add(smoke);

  // ---------- starfield ----------
  //  A thick shell of stars around the whole scene: near ones sweep past as
  //  the camera orbits and far ones crawl, which is what sells the depth.
  //  It hangs on the scene, not the world, so dragging the planet leaves
  //  the sky fixed behind it, and the planet occludes it naturally.
  const STAR_N = 1500;
  const stPos = new Float32Array(STAR_N * 3);
  const stCol = new Float32Array(STAR_N * 3);
  const stSize = new Float32Array(STAR_N);
  const stAlpha = new Float32Array(STAR_N);
  for (let i = 0; i < STAR_N; i++) {
    let x, y, z, l;
    do {
      x = Math.random() * 2 - 1; y = Math.random() * 2 - 1; z = Math.random() * 2 - 1;
      l = Math.hypot(x, y, z);
    } while (l < 1e-4 || l > 1);
    const r = 25 + Math.pow(Math.random(), 0.7) * 65;   // biased near, for parallax
    stPos[i*3] = x / l * r; stPos[i*3+1] = y / l * r; stPos[i*3+2] = z / l * r;
    const t = Math.random();
    const c = t < 0.15 ? [0.72, 0.82, 1.0]              // blue-white
            : t < 0.30 ? [1.0, 0.88, 0.72]              // warm
            : [0.92, 0.94, 1.0];                        // neutral
    const b = 0.7 + Math.random() * 0.3;
    stCol[i*3] = c[0] * b; stCol[i*3+1] = c[1] * b; stCol[i*3+2] = c[2] * b;
    stSize[i] = 0.22 + Math.random() * 0.65;
    stAlpha[i] = 0.35 + Math.random() * 0.65;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(stPos, 3));
  starGeo.setAttribute('pcolor', new THREE.BufferAttribute(stCol, 3));
  starGeo.setAttribute('psize', new THREE.BufferAttribute(stSize, 1));
  starGeo.setAttribute('palpha', new THREE.BufferAttribute(stAlpha, 1));
  const starMat = new THREE.ShaderMaterial({
    uniforms: { uScale: { value: window.innerHeight * 0.5 } },
    transparent: true,
    depthWrite: false,
    vertexShader: POINT_VERT,
    fragmentShader: POINT_FRAG
  });
  const stars = new THREE.Points(starGeo, starMat);
  stars.frustumCulled = false;
  scene.add(stars);

  function puff(p, s0, s1, life, r, g, b, a) {
    const i = sCount < SMOKE_MAX ? sCount++ : (Math.random() * SMOKE_MAX) | 0;
    sPos[i*3] = p.x; sPos[i*3+1] = p.y; sPos[i*3+2] = p.z;
    sCol[i*3] = r; sCol[i*3+1] = g; sCol[i*3+2] = b;
    sS0[i] = s0; sS1[i] = s1; sA0[i] = a;
    sLife[i] = 0; sMax[i] = life;
  }

  function swapSmoke(i, j) {
    for (let k = 0; k < 3; k++) {
      sPos[i*3+k] = sPos[j*3+k];
      sCol[i*3+k] = sCol[j*3+k];
    }
    sS0[i] = sS0[j]; sS1[i] = sS1[j]; sA0[i] = sA0[j];
    sLife[i] = sLife[j]; sMax[i] = sMax[j];
  }

  function updateSmoke(dt) {
    for (let i = 0; i < sCount; i++) {
      sLife[i] += dt;
      if (sLife[i] >= sMax[i]) { swapSmoke(i, --sCount); i--; continue; }
      const t = sLife[i] / sMax[i];
      sSize[i] = sS0[i] + (sS1[i] - sS0[i]) * t;   // puffs expand as they age
      sAlpha[i] = sA0[i] * (1 - t) * (1 - t);
    }
    smokeGeo.setDrawRange(0, sCount);
    if (!sCount) return;               // nothing drawn, nothing to upload
    // upload only the live prefix, not the whole SMOKE_MAX allocation
    const attrs = smokeGeo.attributes;
    attrs.position.updateRange.count = sCount * 3;
    attrs.pcolor.updateRange.count = sCount * 3;
    attrs.psize.updateRange.count = sCount;
    attrs.palpha.updateRange.count = sCount;
    attrs.position.needsUpdate = true;
    attrs.pcolor.needsUpdate = true;
    attrs.psize.needsUpdate = true;
    attrs.palpha.needsUpdate = true;
  }

  const flameAt = new THREE.Vector3();

  //  back is the unit vector out of the tail. Puffs are laid on a fixed
  //  clock rather than per frame so the trail does not thin out when the
  //  frame rate dips, and each one is tinted between yellow and red so the
  //  plume flickers instead of reading as a solid bar.
  function flame(pos, back, span, size, life) {
    flameAt.copy(back).multiplyScalar(span).add(pos);
    const heat = Math.random();
    puff(flameAt,
         size * (0.7 + Math.random() * 0.5),
         size * (1.6 + Math.random() * 0.8),
         life * (0.7 + Math.random() * 0.6),
         1.0, 0.55 + heat * 0.35, 0.15 + heat * 0.35,
         0.85);
  }

  const bDir = new THREE.Vector3(), bStep = new THREE.Vector3(), bTgt = new THREE.Vector3();

  //  A hot, short-lived burst at the muzzle. Three overlapping puffs that
  //  die inside a fifth of a second read as a strobing flash when the gun
  //  cycles, where one long-lived puff would just read as smoke.
  function muzzleFlash(p) {
    for (let k = 0; k < 3; k++) {
      puff(p,
           tiles.meanInr * (0.20 + Math.random() * 0.18),
           tiles.meanInr * (0.55 + Math.random() * 0.35),
           0.10 + Math.random() * 0.08,
           1.0, 0.93, 0.55, 0.95);
    }
  }

  function fireShell(from, dir, target, dmg, splashDmg) {
    if (bullets.length >= BULLET_MAX) return;
    target.incoming += dmg;                        // reserved, not yet dealt
    bullets.push({
      pos: from.clone(),
      vel: dir.clone().multiplyScalar(splashDmg ? BAL.shellSpeed : BAL.slugSpeed),
      target, dmg, splashDmg: splashDmg || 0, life: 0, emit: 0, spent: false
    });
    puff(from, tiles.meanInr * 0.30, tiles.meanInr * 1.1, 0.5, 1.0, 0.82, 0.5, 0.75);
  }

  function updateBullets(dt) {
    const trailGap = BAL.trailGap, scale = tiles.meanInr;
    let live = 0;
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      b.life += dt;

      const speed = b.splashDmg ? BAL.shellSpeed : BAL.slugSpeed;
      if (!b.spent && b.target.alive) {
        bTgt.copy(b.target.dir).multiplyScalar(RADIUS + b.target.alt);
        bDir.subVectors(bTgt, b.pos);
        const dist = bDir.length();
        if (dist <= speed * dt + scale * 0.25) {
          b.target.hp -= b.dmg;
          b.target.incoming -= b.dmg;
          b.spent = true;
          for (let k = 0; k < 5; k++) {
            puff(bTgt, scale * 0.25, scale * 1.6, 0.55 + Math.random() * 0.3,
                 1.0, 0.72, 0.45, 0.8);
          }
          if (b.splashDmg) {
            // the burst. Splash is not reserved like direct damage: several
            // bursts overlapping the same pod just overkill it, which is
            // the price of area fire, not a targeting bug.
            const rB = BAL.splashRadius * scale;
            for (const a2 of aliens) {
              if (!a2.alive || a2 === b.target) continue;
              if (a2.pos.distanceTo(bTgt) > rB) continue;
              a2.hp -= b.splashDmg;
              if (a2.hp <= 0) {
                a2.alive = false;
                G.gold += a2.pay;
                for (let k = 0; k < 6; k++) {
                  puff(a2.pos, scale * 0.35, scale * 2.2, 0.7 + Math.random() * 0.4,
                       0.72, 0.45, 0.95, 0.7);
                }
              }
            }
            for (let k = 0; k < 8; k++) {
              puff(bTgt, scale * 0.5, scale * 3.0, 0.6 + Math.random() * 0.4,
                   1.0, 0.6, 0.3, 0.8);
            }
          }
          if (b.target.hp <= 0 && b.target.alive) {
            b.target.alive = false;
            G.gold += b.target.pay;
            for (let k = 0; k < 10; k++) {
              puff(bTgt, scale * 0.4, scale * 2.6, 0.8 + Math.random() * 0.5,
                   0.72, 0.45, 0.95, 0.7);
            }
          }
          continue;                                 // dropped this frame
        }
        if (b.splashDmg) {
          // only the battery's missile homes; the slug's path is its aim
          bDir.divideScalar(dist);
          // a quarter of the remaining error per 60Hz frame, whatever the
          // actual frame rate, so homing strength does not vary by display
          b.vel.lerp(bDir.multiplyScalar(speed), 1 - Math.pow(0.75, dt * 60));
        }
      } else if (!b.spent) {
        b.target.incoming -= b.dmg;                 // target died first
        b.spent = true;
      }

      // a slug that runs out its range detonates in place
      if (!b.splashDmg && b.life * BAL.slugSpeed >= BAL.slugRange) {
        if (!b.spent) b.target.incoming -= b.dmg;   // the shot is officially a miss
        for (let k = 0; k < 6; k++) {
          puff(b.pos, scale * 0.3, scale * 2.0, 0.5 + Math.random() * 0.3,
               1.0, 0.65, 0.35, 0.85);
        }
        continue;
      }
      if (b.spent && b.life > BAL.strayLife) continue;   // a stray missile fizzles

      bStep.copy(b.vel).multiplyScalar(dt);
      b.pos.add(bStep);

      // lay the trail at a fixed spacing so speed does not change its density
      b.emit += bStep.length();
      while (b.emit >= trailGap) {
        b.emit -= trailGap;
        puff(b.pos, scale * 0.16, scale * 0.85, 0.9 + Math.random() * 0.4,
             0.62, 0.62, 0.66, 0.5);
      }

      bullets[live++] = b;
    }
    bullets.length = live;

    // shells and missiles are separate instanced models, so each one is
    // packed into its own run and pointed down its own velocity
    let nS = 0, nM = 0;
    for (let i = 0; i < live; i++) {
      const b = bullets[i];
      const mesh = b.splashDmg ? missileMesh : shellMesh;
      if (!mesh) continue;
      dummy.position.copy(b.pos);
      bTgt.copy(b.pos).add(b.vel);
      dummy.lookAt(bTgt);                       // model nose is baked onto -Z
      dummy.scale.setScalar(scale * (b.splashDmg ? 0.22 : 0.13));
      dummy.updateMatrix();
      mesh.setMatrixAt(b.splashDmg ? nM++ : nS++, dummy.matrix);
    }
    if (shellMesh) { shellMesh.count = nS; shellMesh.instanceMatrix.needsUpdate = true; }
    if (missileMesh) { missileMesh.count = nM; missileMesh.instanceMatrix.needsUpdate = true; }

  }

  const alienPos = new THREE.Vector3(), aim = new THREE.Vector3(),
        muzzle = new THREE.Vector3(), qAimGoal = new THREE.Quaternion();
  function posOf(a) { return alienPos.copy(a.dir).multiplyScalar(RADIUS + a.alt); }

  function nearestCell(dir) {
    let best = 0, bd = -2;
    for (let ci = 0; ci < tiles.cells.length; ci++) {
      const d = tiles.cells[ci].center.dot(dir);
      if (d > bd) { bd = d; best = ci; }
    }
    return best;
  }

  // ---------- fire control ----------
  //
  //  Slugs fly straight, so every railgun leads its shot: aim at where the
  //  target will be when the slug arrives, not where it is. One iteration
  //  of time-of-flight is plenty at railgun speed.
  const pDir = new THREE.Vector3(), pAxis = new THREE.Vector3(),
        pQ = new THREE.Quaternion(), pPred = new THREE.Vector3();

  function predictAlien(a, tFly, out) {
    // a dreadnaught on station drifts too slowly to be worth leading
    if (a.type === 'dread' && a.alt <= BAL.dreadOrbit) {
      return out.copy(a.dir).multiplyScalar(RADIUS + a.alt);
    }
    pDir.copy(a.dir);
    let alt = a.alt;
    if (a.hunting) {
      // a hunting dart is closing on its prey's bearing
      const rem = pDir.angleTo(a.hunting.dir);
      if (rem > 1e-6) {
        pAxis.crossVectors(pDir, a.hunting.dir);
        if (pAxis.lengthSq() > 1e-12) {
          pQ.setFromAxisAngle(pAxis.normalize(), Math.min(rem, BAL.dartHunt * tFly));
          pDir.applyQuaternion(pQ);
        }
      }
      alt += THREE.MathUtils.clamp(a.hunting.alt - alt, -BAL.dartClimb * tFly, BAL.dartClimb * tFly);
    } else {
      // a descending ship swings onto its column and keeps falling
      const rem = pDir.angleTo(a.tgt);
      if (rem > 1e-6) {
        pAxis.crossVectors(pDir, a.tgt);
        if (pAxis.lengthSq() > 1e-12) {
          pQ.setFromAxisAngle(pAxis.normalize(), Math.min(rem, a.turn * tFly));
          pDir.applyQuaternion(pQ);
        }
      }
      alt -= a.speed * tFly;
    }
    return out.copy(pDir).multiplyScalar(RADIUS + Math.max(alt, 0));
  }

  function predictFighter(f, tFly, out) {
    // a jet parked on (or settling onto) its pad is not going anywhere
    if (f.state !== 'flying') return out.copy(f.dir).multiplyScalar(RADIUS + f.alt);
    // the jet flies its great circle at a known rate
    pDir.copy(f.dir);
    pAxis.crossVectors(f.dir, f.head);
    if (pAxis.lengthSq() > 1e-12) {
      pQ.setFromAxisAngle(pAxis.normalize(), BAL.jetSpeed * tFly);
      pDir.applyQuaternion(pQ);
    }
    return out.copy(pDir).multiplyScalar(RADIUS + f.alt);
  }

  // ---------- waves ----------
  // The drop picks a bearing in space and lands a cluster around it, so a
  // wave is a place you can defend rather than noise sprayed over the globe.
  const qWorldGoal = new THREE.Quaternion();
  let worldTween = false;

  // swing the world so the bearing faces the camera. Centring a zone also
  // ends the idle spin: the first thing the game shows you must not then
  // drift back out of view.
  function swingTo(bearing) {
    camera.updateMatrixWorld();
    const front = camera.position.clone().normalize();
    qWorldGoal.setFromUnitVectors(bearing, front);
    worldTween = true;
    engaged = true;
  }

  function faceBearing(bearing) {
    // Off by default: the planet holding still is worth more than the
    // convenience of being shown the next zone, since this swing fires the
    // moment a wave ends and yanks the view out from under you. Dismissing
    // the wave report swings unconditionally instead - see hideSummary -
    // because that moment is the player's own.
    if (!BAL.autoFace) return;
    swingTo(bearing);
  }



  // A drop zone the player only learns about when it starts is not a puzzle,
  // it is a coin toss: turrets are static and a wave is over in twenty
  // seconds. So the NEXT bearing is chosen the moment the last wave ends and
  // drawn on the ground, and the break is the time you get to answer it.
  //  Each ring is a thin ribbon mesh draped on the sphere, not a LineLoop:
  //  WebGL ignores line widths, and a one-pixel thread is exactly the thing
  //  players fail to find on a busy planet.
  const ZONE_SEG = 96;
  const ZONE_HALF = 0.012;           // band half-width, radians on the sphere
  const zoneRings = [];
  const zoneMat = new THREE.MeshBasicMaterial({
    color: 0xff2f2f, transparent: true, opacity: 0.9,
    side: THREE.DoubleSide, depthWrite: false
  });
  const zoneIdx = [];
  for (let i = 0; i < ZONE_SEG; i++) {
    const a = i * 2, b = a + 1, c = ((i + 1) % ZONE_SEG) * 2, d = c + 1;
    zoneIdx.push(a, b, c, b, d, c);
  }
  for (let i = 0; i < MAX_SHIPS; i++) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ZONE_SEG * 6), 3));
    g.setIndex(zoneIdx);
    const r = new THREE.Mesh(g, zoneMat);
    r.frustumCulled = false;
    r.visible = false;
    world.add(r);
    zoneRings.push(r);
  }

  //  Inside each zone, faint red rings ripple INWARD from the rim toward
  //  the centre. When several huge zones overlap, the direction of travel
  //  is what tells you which side of a line is inside: ripples always run
  //  away from the boundary you are looking at, toward its own middle.
  const CAP_K = 18, CAP_S = 64, CAP_FLO = 0.12;   // radial rings, segments, innermost fraction
  const rippleMat = new THREE.ShaderMaterial({
    uniforms: { uT: { value: 0 } },
    transparent: true,
    depthWrite: false,
    vertexShader: `
      attribute float frac;
      varying float vF;
      void main() {
        vF = frac;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform float uT;
      varying float vF;
      void main() {
        // three bands per zone, drifting toward lower frac as uT grows
        float d = abs(fract(vF * 3.0 + uT * 0.4) - 0.5);
        float ring = smoothstep(0.10, 0.02, d);
        float a = ring * 0.28 * smoothstep(0.08, 0.35, vF);   // dissolve before the middle
        if (a < 0.003) discard;
        gl_FragColor = vec4(1.0, 0.184, 0.184, a);
      }`
  });
  const capIdx = [];
  for (let j = 0; j < CAP_K - 1; j++) {
    for (let i = 0; i < CAP_S; i++) {
      const a = j * CAP_S + i, b = j * CAP_S + (i + 1) % CAP_S;
      const c = a + CAP_S, d = b + CAP_S;
      capIdx.push(a, b, c, b, d, c);
    }
  }
  const zoneCaps = [];
  for (let i = 0; i < MAX_SHIPS; i++) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(CAP_K * CAP_S * 3), 3));
    const fr = new Float32Array(CAP_K * CAP_S);
    for (let j = 0; j < CAP_K; j++) {
      const f = CAP_FLO + (1 - CAP_FLO) * j / (CAP_K - 1);
      for (let s = 0; s < CAP_S; s++) fr[j * CAP_S + s] = f;
    }
    g.setAttribute('frac', new THREE.BufferAttribute(fr, 1));
    g.setIndex(capIdx);
    const m = new THREE.Mesh(g, rippleMat);
    m.frustumCulled = false;
    m.visible = false;
    world.add(m);
    zoneCaps.push(m);
  }

  //  Early waves must not open on an ocean. A zone that is mostly water has
  //  almost nowhere to build, so the wave is decided before you touch it,
  //  and losing to the map roll is not the same as losing to the game.
  function waterFrac(bearing, ang) {
    const c = Math.cos(ang);
    let n = 0, w = 0;
    for (let ci = 0; ci < tiles.cells.length; ci++) {
      if (tiles.cells[ci].center.dot(bearing) > c) { n++; if (cellType[ci] === 'lake') w++; }
    }
    return n ? w / n : 0;
  }

  const randDir = () => {
    const b = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1);
    return b.lengthSq() < 1e-6 ? b.set(0, 1, 0) : b.normalize();
  };

  // how far the nearest OTHER ship is. Used to keep them off each other:
  // two juggernauts stacked in the same sky is one front, not two.
  function clearance(v, ships, skip) {
    let d = Math.PI;
    for (let i = 0; i < ships.length; i++) {
      if (i === skip) continue;
      d = Math.min(d, v.angleTo(ships[i].bearing));
    }
    return d;
  }

  //  The wave's manifest - how many of what - is rolled here, when the
  //  previous wave ends, so the summary card can print exactly what is
  //  coming rather than an estimate. startWave consumes the same list.
  function rollComposition(w) {
    const n = BAL.alienN(w);
    const hf = w >= BAL.hulkFrom ? BAL.hulkFrac(w) : 0;
    const df = w >= BAL.dartFrom ? BAL.dartFrac(w) : 0;
    const gf = w >= BAL.dreadFrom ? BAL.dreadFrac(w) : 0;
    const list = [];
    const counts = { viper: 0, hulk: 0, dart: 0, dread: 0 };
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      const type = r < hf ? 'hulk' : r < hf + df ? 'dart'
                 : r < hf + df + gf ? 'dread' : 'viper';
      list.push(type);
      counts[type]++;
    }
    return { list, counts };
  }

  function pickBearing() {
    // everything about the coming wave is decided here, so the break shows
    // you the real thing rather than a placeholder
    const w = G.wave + 1;
    G.shipDist = shipDistFor(w);
    const want = shipCountFor(w);

    // A mothership's spot is claimed ONCE, when it warps in, and kept for
    // the rest of the run. Only the zone changes: it opens at a couple of
    // hex rings' reach and widens every wave the ship has been aboard,
    // always centred on the bearing it locked on arrival. The pressure a
    // ship applies is a place that deepens, not a front that wanders.
    const startAng = (BAL.zoneRings * 2 + 1) * tiles.meanInr;
    for (const s of G.ships) {
      s.ang = Math.min(BAL.zoneMax, s.ang0 + (w - s.born) * BAL.zoneGrow);
    }

    // during the dry window a candidate must clear the water bar as well as
    // its neighbours; the best dry option wins, and if nothing is dry we fall
    // back to the roomiest rather than refusing to place the ship
    const dry = w <= BAL.dryWaves;
    const passes = v => !dry || waterFrac(v, startAng) <= BAL.dryMax;

    // a new arrival picks its own spot: far enough out that its opening
    // zone clears every established zone, as best a short search can find
    let sep = BAL.shipSepMin;
    for (const s of G.ships) sep = Math.max(sep, s.ang + startAng);
    sep = Math.min(2.2, sep);
    while (G.ships.length < want) {
      let best = null, bestD = -1, dryBest = null, dryBestD = -1;
      for (let t = 0; t < (dry ? 96 : 64); t++) {
        const cand = randDir();
        const d = clearance(cand, G.ships, -1);
        if (d > bestD) { bestD = d; best = cand; }
        if (passes(cand)) {
          if (d > dryBestD) { dryBestD = d; dryBest = cand; }
          if (d >= sep) break;
        }
      }
      G.ships.push({ bearing: dryBest || best, dist: G.shipDist,
                     ang: startAng, ang0: startAng, born: w });
      // the next camera swing shows the player where the new front opened
      G.newShip = G.ships[G.ships.length - 1].bearing;
    }
    G.ships.length = Math.min(G.ships.length, want);

    // need unlocks the tool: water under any zone opens the sea cannon
    // yard, and the cloaking era opens the satellite uplink - both during
    // the break, so the answer is buyable before the problem descends
    if (!G.unlocked.cannon) {
      for (const s of G.ships) {
        if (waterFrac(s.bearing, s.ang) > 0) { unlock('cannon'); break; }
      }
    }
    if (w >= BAL.cloakFrom) unlock('sat');

    // every ship rolls the manifest its own age has earned; the card
    // prints the fleet's total
    const counts = { viper: 0, hulk: 0, dart: 0, dread: 0 };
    for (const s of G.ships) {
      s.age = w - s.born + 1;
      s.comp = rollComposition(s.age);
      for (const t in s.comp.counts) counts[t] += s.comp.counts[t];
    }
    G.nextComp = { counts };

    for (let i = 0; i < G.ships.length; i++) {
      G.ships[i].dist = G.shipDist;
      drawZone(i, G.ships[i].bearing, G.ships[i].ang);
    }
    for (let i = G.ships.length; i < MAX_SHIPS; i++) {
      zoneRings[i].visible = false;
      zoneCaps[i].visible = false;
    }

    G.bearing = G.ships[0].bearing;      // the sim and the camera still want one
    placeMothers();
    faceBearing(meanBearing());
  }

  // the camera swings to the middle of the fleet, which is the best single
  // view when there is more than one of them
  const meanV = new THREE.Vector3();
  function meanBearing() {
    meanV.set(0, 0, 0);
    for (const s of G.ships) meanV.add(s.bearing);
    return meanV.lengthSq() < 0.04 ? G.ships[0].bearing : meanV.normalize();
  }

  const zA = new THREE.Vector3(), zB = new THREE.Vector3(), zP = new THREE.Vector3();
  function drawZone(idx, bearing, ang) {
    const ring = zoneRings[idx];
    if (!ring) return;
    zA.set(0, 0, 1);
    if (Math.abs(bearing.z) > 0.9) zA.set(1, 0, 0);
    zA.addScaledVector(bearing, -zA.dot(bearing)).normalize();
    zB.crossVectors(bearing, zA);
    const arr = ring.geometry.attributes.position.array;
    for (let i = 0; i < ZONE_SEG; i++) {
      const a = (i / ZONE_SEG) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      for (let k = 0; k < 2; k++) {           // inner and outer edge of the band
        const ph = ang + (k ? ZONE_HALF : -ZONE_HALF);
        zP.copy(bearing).multiplyScalar(Math.cos(ph))
          .addScaledVector(zA, Math.sin(ph) * ca)
          .addScaledVector(zB, Math.sin(ph) * sa)
          .setLength(RADIUS * 1.008);
        const o = (i * 2 + k) * 3;
        arr[o] = zP.x; arr[o+1] = zP.y; arr[o+2] = zP.z;
      }
    }
    ring.geometry.attributes.position.needsUpdate = true;

    // Venn clipping: a rim segment that runs INSIDE another zone is not a
    // boundary of anything, so it is dropped from the index - overlapping
    // rings then read as one merged outline around the union of territory.
    const index = ring.geometry.index.array;
    let n = 0;
    for (let i = 0; i < ZONE_SEG; i++) {
      const am = ((i + 0.5) / ZONE_SEG) * Math.PI * 2;
      zP.copy(bearing).multiplyScalar(Math.cos(ang))
        .addScaledVector(zA, Math.sin(ang) * Math.cos(am))
        .addScaledVector(zB, Math.sin(ang) * Math.sin(am)).normalize();
      let hidden = false;
      for (let j = 0; j < G.ships.length; j++) {
        if (j === idx) continue;
        const o = G.ships[j];
        if (zP.angleTo(o.bearing) < o.ang - ZONE_HALF) { hidden = true; break; }
      }
      if (hidden) continue;
      const a = i * 2, b = a + 1, c = ((i + 1) % ZONE_SEG) * 2, d = c + 1;
      index[n++] = a; index[n++] = b; index[n++] = c;
      index[n++] = b; index[n++] = d; index[n++] = c;
    }
    ring.geometry.index.needsUpdate = true;
    ring.geometry.setDrawRange(0, n);
    ring.visible = true;

    // the ripple cap under the ring: same basis, graded cone angles
    const cap = zoneCaps[idx];
    const cArr = cap.geometry.attributes.position.array;
    for (let j = 0; j < CAP_K; j++) {
      const ph = ang * (CAP_FLO + (1 - CAP_FLO) * j / (CAP_K - 1));
      const cp = Math.cos(ph), sp = Math.sin(ph);
      for (let s = 0; s < CAP_S; s++) {
        const a = (s / CAP_S) * Math.PI * 2;
        zP.copy(bearing).multiplyScalar(cp)
          .addScaledVector(zA, sp * Math.cos(a))
          .addScaledVector(zB, sp * Math.sin(a))
          .setLength(RADIUS * 1.006);
        const o = (j * CAP_S + s) * 3;
        cArr[o] = zP.x; cArr[o + 1] = zP.y; cArr[o + 2] = zP.z;
      }
    }
    cap.geometry.attributes.position.needsUpdate = true;
    cap.visible = true;
  }

  function startWave() {
    G.wave++;
    G.inWave = true;

    G.queue = [];
    for (const ship of G.ships) {
      // Each mothership launches the wave ITS OWN AGE has earned: a new
      // arrival opens with a wave-1 manifest and escalates from there,
      // while the founders keep sending everything their years afford.
      const age = G.wave - ship.born + 1;
      const hp = BAL.alienHp(age);
      const speed = BAL.alienSpeed(age);
      // the manifest the summary card promised; re-rolled only if stale
      const comp = (ship.comp && ship.age === age)
        ? ship.comp.list.slice() : rollComposition(age).list;

      const spread = Math.cos(ship.ang);
      const cand = [];
      for (let ci = 0; ci < tiles.cells.length; ci++) {
        if (tiles.cells[ci].center.dot(ship.bearing) > spread) cand.push(ci);
      }
      if (!cand.length) cand.push(0);

      // they aim for what you built, not empty ground, so the telegraph is a
      // warning about your own stuff rather than an abstract patch of dirt
      const built = cand.filter(ci => towerAt.has(ci) || fighterAt.has(ci));

      while (comp.length) {
        const pool = (built.length && Math.random() < BAL.aimAtBuilt) ? built : cand;
        G.queue.push({ ci: pool[(Math.random() * pool.length) | 0], type: comp.pop(), hp, speed, ship });
      }
    }
    // interleave, or ship one empties its bays before ship two starts
    for (let i = G.queue.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = G.queue[i]; G.queue[i] = G.queue[j]; G.queue[j] = t;
    }
    G.spawnTimer = 0;
    G.landed = 0;
    hideSummary();                   // a called wave clears the last report
    faceBearing(meanBearing());
    say('WAVE ' + G.wave + ' INBOUND');
  }

  function spawnOne(spec) {
    if (aliens.length >= MAX_ALIENS) return;
    const ship = spec.ship || G.ships[0];
    const E = BAL.enemies[spec.type];
    const tgt = tiles.cells[spec.ci].center;
    const alt = ship.dist - RADIUS;             // it leaves from the ship itself
    const speed = spec.speed * E.speed;
    const sweep = ship.bearing.angleTo(tgt);
    const fall = alt / speed;                   // seconds to the ground
    aliens.push({
      ci: spec.ci,
      type: spec.type,
      ship,                                     // whose zone it belongs to
      dir: ship.bearing.clone(),                // starts under its own ship
      tgt: tgt.clone(),
      turn: sweep / Math.max(fall * BAL.converge, 0.001),   // arrives over its
      alt,                                                  // column part way down
      pos: new THREE.Vector3(),
      prev: new THREE.Vector3(),
      hp: spec.hp * E.hp,
      hp0: spec.hp * E.hp,               // spawn health, for the shield readout
      incoming: 0,
      dmg: G.hpMax * E.dmg,
      pay: E.pay,
      speed,
      // late-war ships come cloaked: hull hidden, guns blind to them,
      // until a satellite's dome sweeps the veil off
      cloak: G.wave >= BAL.cloakFrom,
      seen: false,
      alive: true
    });
  }

  function endWave() {
    G.inWave = false;
    G.breakLeft = BAL.breakTime;
    const pay = BAL.income(G.wave);
    G.gold += pay;
    tickRecoveries();                // a wave survived is a wave of digging
    pickBearing();                   // the next wave exists before the card
    showSummary(G.wave, G.landed, pay);   // ...so the card can describe it
  }

  // ---------- tick ----------
  let motherEmit = 0;

  function gameTick(dt) {
    if (!G.started || !G.ready || G.over || G.paused) return;

    // the juggernaut holds station, so its plume is a slow idle burn
    if (G.ships.length) {
      motherEmit += dt;
      const mk = BAL.motherSize / MOTHER_LEN;
      while (motherEmit >= BAL.flameGap * 1.4) {
        motherEmit -= BAL.flameGap * 1.4;
        for (let i = 0; i < G.ships.length; i++) {
          const m = motherMeshes[i];
          if (!m || !m.visible) continue;
          flame(m.position, G.ships[i].bearing, 0.92 * MOTHER_LEN * mk,
                BAL.motherSize * 0.16, BAL.flameLife * 2.2);
        }
      }
    }

    if (!G.inWave) {
      G.breakLeft -= dt;
      if (G.breakLeft <= 0) startWave();
    } else if (G.queue.length) {
      G.spawnTimer -= dt;
      while (G.queue.length && G.spawnTimer <= 0) {
        spawnOne(G.queue.shift());
        G.spawnTimer += BAL.spawnGap;
      }
    }

    // fly out and down
    for (const a of aliens) {
      if (!a.alive) continue;

      // Darts fight before they land: while a fighter flies inside this
      // dart's own landing zone, it breaks off to chase the nearest one,
      // matches its altitude, and shoots. Fighters elsewhere on the planet
      // are none of its business; over a clear zone it goes in to land.
      a.hunting = null;
      if (a.type === 'dart' && fighters.length) {
        let tgt = null, near = Infinity;
        for (const jf of fighters) {
          if (jf.dir.angleTo(a.ship.bearing) > a.ship.ang) continue;
          const d = a.dir.angleTo(jf.dir);
          if (d < near) { near = d; tgt = jf; }
        }
        a.hunting = tgt;
        if (tgt) {
          if (near > 1e-5) {
            fAxis.crossVectors(a.dir, tgt.dir);
            if (fAxis.lengthSq() > 1e-12) {
              fAxis.normalize();
              fQ.setFromAxisAngle(fAxis, Math.min(near, BAL.dartHunt * dt));
              a.dir.applyQuaternion(fQ).normalize();
            }
          }
          a.alt += THREE.MathUtils.clamp(tgt.alt - a.alt, -BAL.dartClimb * dt, BAL.dartClimb * dt);
          a.cool = (a.cool || 0) - dt;
          aim.copy(a.dir).multiplyScalar(RADIUS + a.alt);          // the dart
          fA2.copy(tgt.dir).multiplyScalar(RADIUS + tgt.alt);      // its prey
          if (a.cool <= 0 && aim.distanceTo(fA2) < BAL.dartReach * tiles.meanInr) {
            a.cool = BAL.dartRate;
            // straight slugs against a fast jet: the dart leads its shot too
            fA1.copy(predictFighter(tgt, aim.distanceTo(fA2) / BAL.slugSpeed, pPred)).sub(aim).normalize();
            fireShell(aim, fA1, tgt, BAL.dartDmg);
            muzzleFlash(aim);
          }
          continue;
        }
      }

      // A dreadnaught never lands. It rides the drop down to holding
      // altitude, then creeps across the sky toward whatever you have
      // built and shells it - with exactly a railgun's ring reach, so
      // the emplacement it is pounding can always answer back.
      if (a.type === 'dread' && a.alt - a.speed * dt <= BAL.dreadOrbit) {
        a.alt = BAL.dreadOrbit;
        a.aim = a.aim || null;
        let prey = null, near = Infinity;
        for (const t of towers) {
          if (t.hp - t.incoming <= 0) continue;      // already falling
          const d = a.dir.angleTo(t.up);
          if (d < near) { near = d; prey = t; }
        }
        if (prey) {
          // the cannon tracks its prey continuously, not just when it fires
          (a.aim || (a.aim = new THREE.Vector3())).copy(prey.seat);
          const over = nearestCell(a.dir);
          if (over !== a.ci || !a.reach) { a.ci = over; a.reach = ringSet(over, BAL.range); }
          // The ball mount is bolted flat to the hull, so the barrel can
          // only trim BAL.dreadTilt off vertical. The needed tilt is the
          // real fire gate, and the ship closes the rest itself.
          fA2.copy(a.dir).multiplyScalar(RADIUS + a.alt);
          fA1.copy(prey.seat).sub(fA2).normalize();
          const tilt = Math.acos(THREE.MathUtils.clamp(-fA1.dot(a.dir), -1, 1));
          if (a.reach.has(prey.ci) && tilt <= BAL.dreadTilt) {
            a.cool = (a.cool || 0) - dt;
            if (a.cool <= 0) {
              a.cool = BAL.dreadRate;
              fireShell(fA2, fA1, prey, BAL.dreadDmg);
              muzzleFlash(fA2);
            }
          }
          if (tilt > BAL.dreadTrim && near > 1e-5) {
            // still off the vertical: keep creeping toward overhead, and
            // keep shooting on the way in once the barrel can bear
            fAxis.crossVectors(a.dir, prey.up);
            if (fAxis.lengthSq() > 1e-12) {
              fAxis.normalize();
              fQ.setFromAxisAngle(fAxis, Math.min(near, BAL.dreadDrift * dt));
              a.dir.applyQuaternion(fQ).normalize();
            }
          }
        }
        continue;
      }

      const rem = a.dir.angleTo(a.tgt);
      if (rem > 1e-5) {
        const step = Math.min(rem, a.turn * dt);
        fAxis.crossVectors(a.dir, a.tgt);
        if (fAxis.lengthSq() > 1e-12) {
          fAxis.normalize();
          fQ.setFromAxisAngle(fAxis, step);
          a.dir.applyQuaternion(fQ).normalize();
        }
      }
      a.alt -= a.speed * dt;
      if (a.alt <= 0) {
        // a dart that spent its descent dogfighting comes down wherever it
        // actually is, not on the tile it was assigned at launch
        if (a.type === 'dart') a.ci = nearestCell(a.dir);
        a.alive = false;
        G.landed++;
        G.hp -= a.dmg;
        breachFlash();
        const lost = demolish(a.ci);
        killHex(a.ci);
        say(lost || 'HEX DESTROYED');
        if (G.hp <= 0) { G.hp = 0; loseGame(); }
      }
    }

    // fire. Each turret takes whatever is closest to touching down, which
    // is the shot that is actually about to cost you something.
    for (const t of towers) {
      t.cool -= dt;
      // a battery's five tubes reload independently of the salvo gate
      if (t.tubes) for (let j = 0; j < t.tubes.length; j++) t.tubes[j] -= dt;
      let best = null;
      for (const a of aliens) {
        if (!a.alive || a.alt > t.ceiling) continue;
        if (a.cloak && !a.seen) continue;          // no target the mount can see
        if (!t.cover.has(a.ci)) continue;
        if (a.hp - a.incoming <= 0) continue;      // already dead, shells in flight
        if (!best || a.alt < best.alt) best = a;
      }
      // the barrel tracks whether or not it can shoot yet, so you can read
      // where a turret is committed at a glance. Railguns aim at the lead
      // point; the battery aims at the target itself, its missile homes.
      if (best && t.kind !== 'battery') {
        const tFly = posOf(best).distanceTo(t.seat) / BAL.slugSpeed;
        aim.copy(predictAlien(best, tFly, pPred)).sub(t.seat);
      } else {
        aim.copy(best ? posOf(best) : t.up.clone().multiplyScalar(RADIUS + 1)).sub(t.seat);
      }
      if (aim.lengthSq() > 1e-9) {
        aim.normalize();
        // the mount slews toward the solution at its own rate instead of
        // snapping, and the barrel direction is wherever it actually points
        qAimGoal.setFromUnitVectors(LOCAL_UP, aim);
        t.aimQ.rotateTowards(qAimGoal, t.turn * dt);
        t.aimDir.copy(LOCAL_UP).applyQuaternion(t.aimQ);
      }
      if (!best || t.cool > 0) continue;
      // a gun can only shoot where its barrel points: hold fire until the
      // swing has settled onto the firing solution
      if (t.aimDir.angleTo(aim) > BAL.aimSettle) continue;
      if (t.tubes) {
        // fire from the first loaded tube; the ripple gate spaces the
        // launches, and each launch re-runs targeting, so a salvo walks
        // across the wave instead of dogpiling one doomed pod
        let tube = -1;
        for (let j = 0; j < t.tubes.length; j++) if (t.tubes[j] <= 0) { tube = j; break; }
        if (tube < 0) continue;                     // every tube reloading
        t.tubes[tube] = t.rate;
        t.cool = BAL.batterySalvo;
      } else {
        t.cool = t.rate;
      }
      // both kinds fire from the tip of whatever is doing the aiming
      muzzle.copy(t.aimDir)
        .multiplyScalar((t.kind === 'battery' ? BATTERY_H : GUN_TIP) * t.k)
        .add(t.seat);
      fireShell(muzzle, t.aimDir, best, t.dmg, t.splashDmg);
    }
    for (const t of towers) { writeGun(t); writeBattery(t); }
    if (modelsOK && towers.length) gunMesh.instanceMatrix.needsUpdate = true;
    if (batteryMesh && batteryMesh.count) batteryMesh.instanceMatrix.needsUpdate = true;

    // friendly outlines shadow every building mesh, swivelling parts included
    mirrorOutline(padMesh, padOutline);
    mirrorOutline(gunMesh, gunOutline);
    mirrorOutline(platMesh, platOutline);
    mirrorOutline(coreMesh, coreOutline);
    mirrorOutline(batteryMesh, batteryOutline);
    mirrorOutline(recoveryMesh, recoveryOutline);

    // the dig crews' sidearms: short reach, low ceiling, but every shot
    // leaves a strobing flash at the muzzle so a defended dig reads busy
    for (const r of recoveries) {
      r.cool -= dt;
      let best = null;
      for (const a of aliens) {
        if (!a.alive || a.alt > r.ceiling) continue;
        if (a.cloak && !a.seen) continue;
        if (!r.cover.has(a.ci)) continue;
        if (a.hp - a.incoming <= 0) continue;
        if (!best || a.alt < best.alt) best = a;
      }
      if (!best || r.cool > 0) continue;
      r.cool = r.rate;
      const rFly = posOf(best).distanceTo(r.pos) / BAL.slugSpeed;
      aim.copy(predictAlien(best, rFly, pPred)).sub(r.pos).normalize();
      fireShell(r.pos, aim, best, r.dmg);
      muzzleFlash(r.pos);
    }

    // compact and draw, each type into its own mesh. A cloaked, unseen
    // ship draws ONLY its red outline: the silhouette is the warning.
    let live = 0, shields = 0, guns = 0;
    const drawn = { viper: 0, hulk: 0, dart: 0, dread: 0 };
    const drawnO = { viper: 0, hulk: 0, dart: 0, dread: 0 };
    for (let i = 0; i < aliens.length; i++) {
      const a = aliens[i];
      if (!a.alive) continue;
      aliens[live] = a;
      const hidden = a.cloak && !a.seen;
      posOf(a);
      a.prev.copy(a.pos);
      a.pos.copy(alienPos);
      dummy.position.copy(alienPos);
      if (a.type === 'dread') {
        // a dreadnaught is a flat platform, not a diving ship: it rides
        // belly to the planet, deck out, bow swung toward its work - the
        // emplacement it is shelling, or its drop column on approach.
        // (The hull is authored deck-up: length on X, belly on -Y.)
        fY.copy(a.dir);
        if (a.aim) gX.copy(a.aim).sub(a.pos); else gX.copy(a.tgt);
        gX.addScaledVector(fY, -gX.dot(fY));
        if (gX.lengthSq() < 1e-10) gX.set(0, 0, 1).addScaledVector(fY, -fY.z);
        if (gX.lengthSq() < 1e-10) gX.set(1, 0, 0).addScaledVector(fY, -fY.x);
        gX.normalize();
        gZ.crossVectors(gX, fY).normalize();
        fBasis.makeBasis(gX, fY, gZ);
        dummy.quaternion.setFromRotationMatrix(fBasis);
        fZ.copy(a.dir);              // station-keeping thrust vents off the deck
      } else {
        // nose along the actual flight path, which curves as it swings onto
        // its column, rather than always straight down
        fZ.subVectors(a.prev, a.pos);
        if (fZ.lengthSq() < 1e-12) fZ.copy(a.dir);
        fZ.normalize();
        fY.copy(a.dir).addScaledVector(fZ, -a.dir.dot(fZ));
        if (fY.lengthSq() < 1e-12) fY.set(0, 1, 0);
        fY.normalize();
        fX.crossVectors(fY, fZ).normalize();
        fBasis.makeBasis(fX, fY, fZ);
        dummy.quaternion.setFromRotationMatrix(fBasis);
      }
      const vk = tiles.meanInr * BAL.enemies[a.type].size / ENEMY_LEN[a.type];
      dummy.scale.setScalar(vk);

      // a cloaked hull vents nothing: the exhaust would give it away
      if (!hidden) {
        a.emit = (a.emit || 0) + dt;            // fZ already points out the back
        while (a.emit >= BAL.flameGap) {
          a.emit -= BAL.flameGap;
          flame(alienPos, fZ, 0.94 * vk, tiles.meanInr * 0.10, BAL.flameLife);
        }
        dummy.updateMatrix();
        enemyMeshes[a.type].setMatrixAt(drawn[a.type]++, dummy.matrix);
      }

      // the outline twin: same pose, a few percent larger. It draws for
      // hidden ships too - it is all of them the player gets to see.
      dummy.scale.setScalar(vk * (hidden ? 1 : OUTLINE_SCALE));
      dummy.updateMatrix();
      outlineMeshes[a.type].setMatrixAt(drawnO[a.type]++, dummy.matrix);

      // the cannon under a dreadnaught: hung below the hull and swung onto
      // whatever it is shelling, falling back to straight down when idle
      if (a.type === 'dread' && dreadGunMesh && !hidden) {
        gPos.copy(alienPos).addScaledVector(a.dir, -DREAD_GUN_DROP * vk);
        if (a.aim) gDir.subVectors(a.aim, gPos);
        else gDir.copy(a.dir).multiplyScalar(-1);
        if (gDir.lengthSq() < 1e-12) gDir.copy(a.dir).multiplyScalar(-1);
        gDir.normalize();
        // the flat of the ball stays against the flat of the hull: the
        // barrel is clamped to slight angles about straight down, and the
        // ship's own station-keeping lines up anything past that
        gUp.copy(a.dir).multiplyScalar(-1);
        if (gUp.angleTo(gDir) > BAL.dreadTilt) {
          gX.crossVectors(gUp, gDir);
          if (gX.lengthSq() > 1e-12) {
            gDir.copy(gUp).applyAxisAngle(gX.normalize(), BAL.dreadTilt);
          } else gDir.copy(gUp);
        }
        gUp.copy(a.dir).addScaledVector(gDir, -a.dir.dot(gDir));
        if (gUp.lengthSq() < 1e-12) gUp.copy(fY);
        gUp.normalize();
        gZ.copy(gDir).multiplyScalar(-1);                 // barrel baked onto -Z
        gX.crossVectors(gUp, gZ).normalize();
        gBasis.makeBasis(gX, gUp, gZ);
        dummy.position.copy(gPos);
        dummy.quaternion.setFromRotationMatrix(gBasis);
        dummy.scale.setScalar(vk * DREAD_GUN_K);
        dummy.updateMatrix();
        dreadGunMesh.setMatrixAt(guns, dummy.matrix);
        dummy.scale.setScalar(vk * DREAD_GUN_K * OUTLINE_SCALE);
        dummy.updateMatrix();
        dreadGunOutline.setMatrixAt(guns++, dummy.matrix);
        dummy.position.copy(alienPos);
        dummy.scale.setScalar(vk);
      }

      // the shell rides the hull until half its health is gone (a hidden
      // hull hides its shield with it)
      const sh = BAL.enemies[a.type].shield;
      if (sh && !hidden && a.hp > a.hp0 * sh) {
        dummy.quaternion.set(0, 0, 0, 1);
        dummy.scale.setScalar(vk * SHIELD_R);
        dummy.updateMatrix();
        shieldMesh.setMatrixAt(shields++, dummy.matrix);
      }
      live++;
    }
    aliens.length = live;
    for (const t in enemyMeshes) {
      enemyMeshes[t].count = drawn[t];
      enemyMeshes[t].instanceMatrix.needsUpdate = true;
      outlineMeshes[t].count = drawnO[t];
      outlineMeshes[t].instanceMatrix.needsUpdate = true;
    }
    if (dreadGunMesh) {
      dreadGunMesh.count = guns;
      dreadGunMesh.instanceMatrix.needsUpdate = true;
      dreadGunOutline.count = guns;
      dreadGunOutline.instanceMatrix.needsUpdate = true;
    }
    shieldMesh.count = shields;
    shieldMesh.instanceMatrix.needsUpdate = true;

    updateSats(dt);
    updateFighters(dt);
    updateBullets(dt);
    updateSmoke(dt);

    // an emplacement shelled to death from orbit falls alone: unlike a
    // landing, the hex under it survives and can be built on again
    for (let i = towers.length - 1; i >= 0; i--) {
      const t = towers[i];
      if (t.alive) continue;
      towers.splice(i, 1);
      if (towerAt.get(t.ci) === t) towerAt.delete(t.ci);
      say(TOWER_NAMES[t.kind].toUpperCase() + ' DESTROYED FROM ORBIT');
      rebuildEmplacements();
    }

    if (G.inWave && !G.queue.length && live === 0) endWave();
  }

  function loseGame() {
    G.over = true;
    G.paused = false;
    hideSummary();
    G.inWave = false;
    G.queue.length = 0;
    clearEnemies();                              // nothing left hanging in the sky
    resetBullets();
    hideMothers();
    say('PLANET LOST \u00B7 NEW WORLD TO RESTART', true);
    // the obituary: the wave that killed you was not survived
    document.getElementById('lossWaves').textContent = Math.max(0, G.wave - 1);
    document.getElementById('lossSpent').textContent = Math.round(G.spent);
    document.getElementById('lossModal').classList.add('open');
  }

  // ---------- readouts ----------
  const hpVal = document.getElementById('hpVal');
  const hpFill = document.getElementById('hpFill');
  const goldVal = document.getElementById('goldVal');
  const waveVal = document.getElementById('waveVal');
  const nextVal = document.getElementById('nextVal');
  const nextStat = nextVal.parentElement;
  const alertEl = document.getElementById('alert');
  const buildBtn = document.getElementById('buildBtn');
  const jetBtn = document.getElementById('jetBtn');
  const cannonBtn = document.getElementById('cannonBtn');
  const batteryBtn = document.getElementById('batteryBtn');
  const recoveryBtn = document.getElementById('recoveryBtn');
  const satBtn = document.getElementById('satBtn');
  const waveBtn = document.getElementById('waveBtn');
  let alertUntil = 0;

  // the shop buttons carry their price beside the art
  for (const [id, cost] of [['buildBtn', BAL.turretCost], ['jetBtn', BAL.jetCost],
       ['cannonBtn', BAL.cannonCost], ['batteryBtn', BAL.batteryCost],
       ['recoveryBtn', BAL.recoveryCost], ['satBtn', BAL.satCost]]) {
    const b = document.getElementById(id);
    b.querySelector('.cost').textContent = cost;
    b.title += ' (' + cost + ' gold)';
  }

  //  Need unlocks the tool. Three of the buildables stay off the shelf
  //  until the game first poses the problem they answer.
  const UNLOCKS = {
    cannon:   { btn: 'cannonBtn',   msg: 'WATER IN THE DROP ZONE · SEA CANNON UNLOCKED' },
    recovery: { btn: 'recoveryBtn', msg: 'GROUND LOST · RECOVERY TEAM UNLOCKED' },
    sat:      { btn: 'satBtn',      msg: 'CLOAKED SIGNATURES · RECON SATELLITE UNLOCKED' }
  };

  function unlock(kind) {
    if (G.unlocked[kind]) return;
    G.unlocked[kind] = true;
    document.getElementById(UNLOCKS[kind].btn).classList.remove('locked');
    say(UNLOCKS[kind].msg);
  }

  function applyLocks() {
    for (const k in UNLOCKS) {
      document.getElementById(UNLOCKS[k].btn).classList.toggle('locked', !G.unlocked[k]);
    }
  }

  // a landing strobes BREACH! across the bar that just paid for it; the
  // reflow restart lets back-to-back landings each get their own flash
  const breachEl = document.getElementById('breachFlash');
  function breachFlash() {
    breachEl.classList.remove('on');
    void breachEl.offsetWidth;
    breachEl.classList.add('on');
  }

  // every purchase and upgrade goes through here, so the loss card can
  // say what the whole defence effort cost
  function spend(n) {
    G.gold -= n;
    G.spent += n;
  }

  function say(msg, sticky) {
    alertEl.textContent = msg;
    alertEl.classList.remove('quiet');
    alertUntil = sticky ? Infinity : performance.now() + 2200;
  }

  function updateHud() {
    const pct = Math.max(0, G.hp / G.hpMax);
    hpVal.textContent = 'planet defense ' + Math.ceil(G.hp);
    hpFill.style.width = (pct * 100) + '%';
    hpFill.classList.toggle('low', pct < 0.34);
    hpVal.classList.toggle('low', pct < 0.34);
    goldVal.textContent = Math.floor(G.gold);
    waveVal.textContent = G.over ? G.wave + ' lost' : G.wave;
    // the epsilon stops it sitting on the full break time for an extra second:
    // at breakLeft 19.9999, a plain ceil still reads 20
    const left = Math.max(0, Math.ceil(G.breakLeft - 1e-6));
    nextVal.textContent = G.over ? '\u2014' : G.inWave ? 'inbound' : left + 's';
    nextStat.classList.toggle('soon', !G.over && !G.inWave && left <= 5);
    waveBtn.disabled = G.inWave || G.over;
    cannonBtn.disabled = G.gold < BAL.cannonCost && G.build !== 'cannon';
    cannonBtn.setAttribute('aria-pressed', G.build === 'cannon' ? 'true' : 'false');
    batteryBtn.disabled = G.gold < BAL.batteryCost && G.build !== 'battery';
    batteryBtn.setAttribute('aria-pressed', G.build === 'battery' ? 'true' : 'false');
    recoveryBtn.disabled = G.gold < BAL.recoveryCost && G.build !== 'recovery';
    recoveryBtn.setAttribute('aria-pressed', G.build === 'recovery' ? 'true' : 'false');
    satBtn.disabled = G.gold < BAL.satCost && G.build !== 'sat';
    satBtn.setAttribute('aria-pressed', G.build === 'sat' ? 'true' : 'false');
    if (selCi !== null) refreshUnitCard();
    buildBtn.disabled = G.gold < BAL.turretCost && G.build !== 'turret';
    jetBtn.disabled = G.gold < BAL.jetCost && G.build !== 'fighter';
    buildBtn.setAttribute('aria-pressed', G.build === 'turret' ? 'true' : 'false');
    jetBtn.setAttribute('aria-pressed', G.build === 'fighter' ? 'true' : 'false');
    if (summaryUntil && performance.now() > summaryUntil) hideSummary();
    if (alertUntil !== Infinity && alertUntil && performance.now() > alertUntil) {
      alertEl.classList.add('quiet');
      alertUntil = 0;
    }
  }

  function setBuild(mode) {
    // a tool the situation has not demanded yet cannot be armed
    if (mode && mode in G.unlocked && !G.unlocked[mode]) mode = null;
    G.build = mode || null;
    hint.classList.toggle('live', !!G.build);
    hint.textContent =
        G.build === 'turret'  ? 'Tap a tile to place a turret. Mountains give extra reach. Water is unbuildable.'
      : G.build === 'fighter' ? 'Tap any tile to base a fighter, water included. It patrols that tile\u2019s circle and closes to gun range.'
      : G.build === 'cannon' ? 'Tap a WATER tile to float a sea cannon. Longer reach and a heavier shell than a land turret.'
      : G.build === 'battery' ? 'Tap a land tile to build a missile battery. Slow, heavy shells that burst on impact and damage everything nearby.'
      : G.build === 'recovery' ? 'Tap a crossed-out tile to send a recovery team. The dig takes one wave for every wave the tile has been lost.'
      : G.build === 'sat' ? 'Tap a tile to park a recon satellite in orbit above it. It reveals cloaked ships in the rings beneath, so your guns can fire on them.'
      : '';
    hint.classList.toggle('gone', !G.build);
  }

  buildBtn.addEventListener('click', () => setBuild(G.build === 'turret' ? null : 'turret'));
  jetBtn.addEventListener('click', () => setBuild(G.build === 'fighter' ? null : 'fighter'));
  cannonBtn.addEventListener('click', () => setBuild(G.build === 'cannon' ? null : 'cannon'));
  batteryBtn.addEventListener('click', () => setBuild(G.build === 'battery' ? null : 'battery'));
  recoveryBtn.addEventListener('click', () => setBuild(G.build === 'recovery' ? null : 'recovery'));
  satBtn.addEventListener('click', () => setBuild(G.build === 'sat' ? null : 'sat'));
  waveBtn.addEventListener('click', () => { if (!G.inWave && !G.over) { G.breakLeft = 0; } });

  // ---------- wave summary ----------
  const waveModal = document.getElementById('waveModal');
  const wcTitle = document.getElementById('wcTitle');
  const wcPay = document.getElementById('wcPay');
  const wcLanded = document.getElementById('wcLanded');
  const wcLandedLine = document.getElementById('wcLandedLine');
  const wcNext = document.getElementById('wcNext');
  const wcNew = document.getElementById('wcNew');
  const wcNewDesc = document.getElementById('wcNewDesc');
  const modalWarn = document.getElementById('modalWarn');
  const ENEMY_ONE = { viper: 'dropship', hulk: 'hulk', dart: 'dart', dread: 'dreadnaught' };
  //  Shown on the card before a type's first wave, so its debut is a
  //  briefing rather than a surprise.
  const ENEMY_INTRO = {
    dart: 'Darts are fast enemy fighters that hunt down your fighters before landing.',
    hulk: 'Hulks are armoured transports behind energy shields. The shield falls at half health, and a landed hulk hits the ground twice as hard.',
    dread: 'Dreadnaughts are orbital bombardment ships. One stops at railgun height and shells your buildings with a railgun’s own reach — its wave does not end until it is shot down.',
    cloak: 'The motherships now cloak every ship they launch: hulls vanish, and your units will not fire at what they cannot see — only the red outlines betray the approach. Park recon satellites in orbit to reveal everything beneath them.'
  };
  //  Most debuts introduce a unit; the cloak is a capability, and the
  //  card's header says so.
  const INTRO_HEAD = { cloak: 'New Enemy Tech:' };
  const wcNewHead = wcNew.querySelector('.wc-new-h');
  let summaryUntil = 0;
  const wcTimers = [];

  //  The number rides up from zero to its value while its line is landing.
  function countUp(el, target, delay) {
    if (reduced) { el.textContent = target; return; }
    el.textContent = 0;
    const t0 = performance.now() + delay;
    const dur = 700;
    function step(now) {
      if (!waveModal.classList.contains('open')) { el.textContent = target; return; }
      const p = Math.min(1, Math.max(0, (now - t0) / dur));
      el.textContent = Math.round(target * (1 - (1 - p) * (1 - p)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function showSummary(wave, landed, pay) {
    wcTitle.textContent = 'Wave ' + wave + ' Cleared!';
    wcLandedLine.classList.toggle('bad', landed > 0);   // a clean wave should look clean

    // the coming wave is already rolled, so the card prints its manifest
    const parts = [];
    if (G.nextComp) {
      for (const t of ['viper', 'dart', 'hulk', 'dread']) {
        const c = G.nextComp.counts[t];
        if (c) parts.push(c + ' ' + ENEMY_ONE[t] + (c === 1 ? '' : 's'));
      }
    }
    wcNext.textContent = parts.join(', ');

    // ...announces a debuting enemy type...
    const debut = wave + 1 === BAL.dartFrom ? 'dart'
                : wave + 1 === BAL.hulkFrom ? 'hulk'
                : wave + 1 === BAL.dreadFrom ? 'dread'
                : wave + 1 === BAL.cloakFrom ? 'cloak' : null;
    wcNew.style.display = debut ? '' : 'none';
    if (debut) {
      wcNewHead.textContent = INTRO_HEAD[debut] || 'New Enemy Unit:';
      wcNewDesc.textContent = ENEMY_INTRO[debut];
    }

    // ...and warns about the one thing worth spending the whole break on
    modalWarn.classList.toggle('show', shipCountFor(wave + 1) > shipCountFor(wave));

    waveModal.classList.add('open');
