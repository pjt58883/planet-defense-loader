    G.paused = true;                                 // the break stops here

    // the reveal: each visible line lands after the one before it, and the
    // two counters start rolling the moment their lines appear
    while (wcTimers.length) clearTimeout(wcTimers.pop());
    const lines = [...waveModal.querySelectorAll('.wc-line')]
      .filter(el => getComputedStyle(el).display !== 'none');
    lines.forEach(el => el.classList.remove('on'));
    let delay = 150;
    for (const el of lines) {
      if (reduced) { el.classList.add('on'); continue; }
      const at = delay;
      wcTimers.push(setTimeout(() => el.classList.add('on'), at));
      if (el.contains(wcPay)) countUp(wcPay, pay, at);
      if (el.contains(wcLanded)) countUp(wcLanded, landed, at);
      delay += 350;
    }
    if (reduced) { wcPay.textContent = pay; wcLanded.textContent = landed; }

    // autoplay just means the card dismisses itself; without it the game
    // waits, which is the point of pausing rather than running a countdown
    summaryUntil = autoContinue ? performance.now() + BAL.summaryTime * 1000 : 0;
  }

  function hideSummary() {
    // G.paused distinguishes a player dismissing the report from the card
    // being cleaned up by a reset or a loss, which set paused false first
    if (waveModal.classList.contains('open') && G.paused) {
      G.paused = false;
      // the report is done: hand the view to the next problem - a newly
      // arrived mothership's zone if one just opened, else the fleet's midst
      if (G.ships.length && !G.over) {
        swingTo(G.newShip || meanBearing());
        G.newShip = null;
      }
    }
    G.paused = false;
    waveModal.classList.remove('open');
    while (wcTimers.length) clearTimeout(wcTimers.pop());
    summaryUntil = 0;
  }

  let autoContinue = false;
  const autoBox = document.getElementById('autoBox');
  autoBox.addEventListener('change', () => {
    autoContinue = autoBox.checked;
    if (autoContinue && waveModal.classList.contains('open')) {
      summaryUntil = performance.now() + BAL.summaryTime * 1000;
    } else if (!autoContinue) {
      summaryUntil = 0;
    }
  });

  document.getElementById('modalBtn').addEventListener('click', hideSummary);
  // the way back in: same world, fresh run
  document.getElementById('lossBtn').addEventListener('click', () => {
    document.getElementById('lossModal').classList.remove('open');
    resetGame();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      hideSummary();
      hideUnitCard();
      document.getElementById('catalogModal').classList.remove('open');
      // dismissable without restarting: the menu's new-world path remains
      document.getElementById('lossModal').classList.remove('open');
    }
  });

  // ---------- unit card ----------
  //  Tap one of your buildings (with no build mode armed) and this pops up
  //  beside it: what it is, what it does, and the button to level it up.
  //  It reads live state on every HUD tick, so the numbers stay honest and
  //  the card folds itself away if the building dies under it.
  const unitCard = document.getElementById('unitCard');
  const unitName = document.getElementById('unitName');
  const unitDmgLabel = document.getElementById('unitDmgLabel');
  const unitDmg = document.getElementById('unitDmg');
  const unitRateRow = document.getElementById('unitRateRow');
  const unitRate = document.getElementById('unitRate');
  const unitLvl = document.getElementById('unitLvl');
  const unitUpgBtn = document.getElementById('unitUpgBtn');
  let selCi = null;

  const TOWER_NAMES = { turret: 'Turret', cannon: 'Sea cannon', battery: 'Missile battery' };

  function refreshUnitCard() {
    const b = selCi !== null && buildingAt(selCi);
    if (!b) { hideUnitCard(); return; }
    const t = towerAt.get(selCi), jf = fighterAt.get(selCi);

    if (t) {
      unitName.textContent = TOWER_NAMES[t.kind];
      unitDmgLabel.textContent = 'damage';
      unitDmg.textContent = t.splashDmg ? t.dmg + ' +' + t.splashDmg + ' splash' : t.dmg;
      unitRateRow.style.display = '';
      unitRate.textContent = t.tubes
        ? t.tubes.length + ' tubes · ' + (1 / t.rate).toFixed(2) + '/s each'
        : (1 / t.rate).toFixed(1) + '/s';
    } else if (jf) {
      unitName.textContent = 'Fighter';
      unitDmgLabel.textContent = 'damage';
      unitDmg.textContent = jf.dmg;
      unitRateRow.style.display = '';
      unitRate.textContent = (1 / BAL.jetRate).toFixed(1) + '/s';
    } else if (recoveryAt.get(selCi)) {
      unitName.textContent = 'Recovery team';
      unitDmgLabel.textContent = 'restores in';
      unitDmg.textContent = b.left + (b.left === 1 ? ' wave' : ' waves');
      unitRateRow.style.display = '';
      unitRate.textContent = b.need + (b.need === 1 ? ' wave dig' : ' wave dig');
      unitLvl.textContent = '\u2014';
      unitUpgBtn.textContent = 'No upgrade';
      unitUpgBtn.disabled = true;
      return;
    } else if (satAt.get(selCi)) {
      unitName.textContent = 'Recon satellite';
      unitDmgLabel.textContent = 'reveals';
      unitDmg.textContent = 'cloaked ships';
      unitRateRow.style.display = '';
      unitRate.textContent = BAL.satRange + ' rings';
      unitLvl.textContent = '\u2014';
      unitUpgBtn.textContent = 'No upgrade';
      unitUpgBtn.disabled = true;
      return;
    } else {
      hideUnitCard();
      return;
    }
    unitLvl.textContent = b.level + ' / ' + BAL.upgradeMax;

    if (b.level >= BAL.upgradeMax) {
      unitUpgBtn.textContent = 'Max level';
      unitUpgBtn.disabled = true;
    } else {
      const cost = BAL.upgradeCost(upgradeBase(selCi), b.level + 1);
      unitUpgBtn.textContent = 'Upgrade (' + cost + ')';
      unitUpgBtn.disabled = G.gold < cost;
    }
  }

  function openUnitCard(ci, x, y) {
    selCi = ci;
    refreshUnitCard();
    if (selCi === null) return;                    // nothing there after all
    unitCard.classList.add('open');
    // beside the tap, clamped so it never hangs off screen
    const w = unitCard.offsetWidth, h = unitCard.offsetHeight;
    unitCard.style.left = Math.max(10, Math.min(x + 14, window.innerWidth - w - 10)) + 'px';
    unitCard.style.top = Math.max(10, Math.min(y + 14, window.innerHeight - h - 10)) + 'px';
  }

  function hideUnitCard() {
    selCi = null;
    unitCard.classList.remove('open');
  }

  unitUpgBtn.addEventListener('click', () => {
    if (selCi !== null) { upgradeAt(selCi); refreshUnitCard(); }
  });

  // ---------- model loading ----------
  //
  //  Models are fetched as files rather than inlined, so they download in
  //  parallel, get cached between visits, and adding another one costs
  //  nothing at startup. The trade is that this no longer runs from file://,
  //  because fetch refuses local paths: it needs the dev preview or any
  //  static host.
  //
  //  Each model is tried from the repo first (public/assets/), then from the
  //  Lovable asset store this project was built in, so the game works on any
  //  static host once the GLBs are committed. To self-host a model, drop it
  //  in public/assets/ under the name listed here. A model that loads from
  //  neither source renders as a plain placeholder shape instead of
  //  disappearing.
  const MODEL_URLS = {
    pad:     ['/assets/pad.glb',     '/__l5e/assets-v1/ed785583-b953-46d5-ab3f-e50d5d30ff44/pad.glb'],
    gun:     ['/assets/gun.glb',     '/__l5e/assets-v1/133193a7-4cfb-472e-b1b9-78777d72ff7a/gun.glb'],
    jet:     ['/assets/jet.glb',     '/__l5e/assets-v1/aa131bb3-9b03-4489-b483-5ab9fe50aa00/jet.glb'],
    mother:  ['/assets/mother.glb',  '/__l5e/assets-v1/a43bfc6e-27db-4579-b762-be7ff49cf039/mother.glb'],
    // the descending enemy flies the dropship; the old viper stays behind
    // it as a fallback (decimated from the 33 MB source export, nose baked
    // onto -Z - regenerate via gltf-transform if the source changes)
    viper:   ['/assets/dropship.glb', '/assets/viper.glb'],
    hover:   ['/assets/hover.glb',   '/__l5e/assets-v1/7b7459ce-3d39-4b07-9493-11655f707cfa/hover.glb'],
    core:    ['/assets/core.glb',    '/__l5e/assets-v1/6bce7fea-818f-4d63-b513-fa4f5cfa1d57/core.glb'],
    hulk:    ['/assets/hulk.glb', '/assets/viper.glb'],
    // the dart flies the retired viper model; a dedicated dart.glb in
    // public/assets would take over automatically
    dart:    ['/assets/dart.glb', '/assets/viper.glb'],
    // the fighter's landing pad, marking the hex it is based from
    jetpad:  ['/assets/jetpad.glb'],
    // the recon satellite: the orbital cube sentinel
    sat:     ['/assets/sat.glb'],
    // its ground station, claiming the hex; placeholder until satpad.glb lands
    satpad:  ['/assets/satpad.glb'],
    // the dreadnaught: hull and the bombardment cannon slung under it. The
    // cannon is a separate part so it can slew onto its target in flight.
    dread:    ['/assets/dread.glb'],
    dreadgun: ['/assets/dread_cannon.glb'],
    battery: ['/assets/battery.glb'],
    // the recovery team: engineers and their outpost, planted on lost ground
    recovery: ['/assets/recovery.glb'],
    // projectiles: the railgun slug (turrets, sea cannons) and the battery
    // missile. Both are modelled standing on +Y and are laid onto -Z below.
    slug:    ['/assets/railgun_ammo.glb'],
    missile: ['/assets/missile_battery_ammo.glb']

  };

  //  Slots with no shipped GLB yet render as placeholders by design, so a
  //  missing file is expected and not worth an on-screen warning. New units
  //  sit here until their GLB lands in public/assets.
  const OPTIONAL_MODELS = new Set(['satpad']);

  //  Stand-ins for models that fail to load, built to the same footprints
  //  and pivots the real GLBs were measured at, so every scale factor and
  //  seat height in the placement code still applies unchanged.
  function placeholderPart(name) {
    let geo, color;
    switch (name) {
      case 'pad':
        geo = new THREE.CylinderGeometry(PAD_R * 0.7, PAD_R, GUN_SEAT, 12);
        geo.translate(0, GUN_SEAT / 2, 0);              // underside at y=0
        color = 0x5c6a7d; break;
      case 'gun':
        geo = new THREE.ConeGeometry(0.3, GUN_TIP, 8);
        geo.translate(0, GUN_TIP / 2, 0);               // pivot at the ball centre
        color = 0x8fa3bd; break;
      case 'jet':
        geo = new THREE.ConeGeometry(JET_LEN * 0.22, JET_LEN, 6);
        geo.rotateX(-Math.PI / 2);                      // nose down -Z
        color = 0xd0d6df; break;
      case 'jetpad':                                    // flat square deck, base at y=0
        geo = new THREE.BoxGeometry(JETPAD_R * 2, 0.16, JETPAD_R * 2);
        geo.translate(0, 0.08, 0);
        color = 0x55606e; break;
      case 'sat':                                       // a solar array bar, centred
        geo = new THREE.BoxGeometry(SAT_LEN, 0.10, SAT_LEN * 0.28);
        color = 0x9ad0e0; break;
      case 'satpad':                                    // ground-station drum, base at y=0
        geo = new THREE.CylinderGeometry(SATPAD_R * 0.82, SATPAD_R, 0.34, 10);
        geo.translate(0, 0.17, 0);
        color = 0x4a6a72; break;
      case 'mother':
        geo = new THREE.CylinderGeometry(MOTHER_LEN * 0.18, MOTHER_LEN * 0.26, MOTHER_LEN, 8);
        geo.rotateX(-Math.PI / 2);                      // long axis on Z, nose -Z
        color = 0x6a5c8a; break;
      case 'viper':
        geo = new THREE.ConeGeometry(VIPER_LEN * 0.2, VIPER_LEN, 5);
        geo.rotateX(-Math.PI / 2);                      // nose down -Z
        color = 0xb45cff; break;
      case 'hover':
        geo = new THREE.CylinderGeometry(PLAT_R, PLAT_R, PLAT_DECK, 10);
        geo.translate(0, PLAT_DECK / 2, 0);             // deck top at PLAT_DECK
        color = 0x4a5a6a; break;
      case 'hulk':
        geo = new THREE.ConeGeometry(VIPER_LEN * 0.34, VIPER_LEN, 6);
        geo.rotateX(-Math.PI / 2);                      // nose down -Z
        color = 0xc03a28; break;
      case 'dart':
        geo = new THREE.ConeGeometry(VIPER_LEN * 0.12, VIPER_LEN, 4);
        geo.rotateX(-Math.PI / 2);                      // nose down -Z
        color = 0x58c8ff; break;
      case 'dread':                                     // a broad gun deck, long axis on Z
        geo = new THREE.BoxGeometry(VIPER_LEN * 0.55, VIPER_LEN * 0.18, VIPER_LEN);
        color = 0x8a2c50; break;
      case 'dreadgun':                                  // stub barrel, muzzle down -X like the GLB
        geo = new THREE.CylinderGeometry(VIPER_LEN * 0.07, VIPER_LEN * 0.07, VIPER_LEN * 0.5, 8);
        geo.rotateZ(-Math.PI / 2);
        color = 0x8a2c50; break;
      case 'battery':
        geo = new THREE.CylinderGeometry(BATTERY_R * 0.55, BATTERY_R, BATTERY_H, 6);
        geo.translate(0, BATTERY_H / 2, 0);             // base at y=0
        color = 0x7d8a5a; break;
      case 'recovery':
        geo = new THREE.BoxGeometry(RECOV_R * 1.2, RECOV_R * 0.7, RECOV_R * 1.2);
        geo.translate(0, RECOV_R * 0.35, 0);            // base at y=0
        color = 0x4fd08a; break;
      // projectiles: modelled standing on +Y like their GLBs, ~2 units long,
      // so buildModels can lay either one onto -Z with the same rotation
      case 'slug':
        geo = new THREE.ConeGeometry(0.16, 1.9, 6);
        color = 0xffd9a0; break;
      case 'missile':
        geo = new THREE.ConeGeometry(0.37, 1.9, 6);
        color = 0xffb060; break;

      default:  // core
        geo = new THREE.CylinderGeometry(CORE_R * 0.7, CORE_R, CORE_SEAT, 8);
        geo.translate(0, CORE_SEAT / 2, 0);
        color = 0x9aa7b8; break;
    }
    return { geo, mat: new THREE.MeshStandardMaterial({ color, metalness: 0.18, roughness: 0.55, flatShading: true }) };
  }

  function instanced(parsed, max, dynamic) {
    const m = new THREE.InstancedMesh(parsed.geo, parsed.mat, max);
    m.count = 0;
    m.frustumCulled = false;                   // instances are scattered, so the
    if (dynamic) m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);   // origin bound lies
    world.add(m);
    return m;
  }

  function buildModels(parts) {
    padMesh = instanced(parts.pad, MAX_TURRETS, true);
    gunMesh = instanced(parts.gun, MAX_TURRETS, true);
    modelsOK = true;

    jetMesh = instanced(parts.jet, MAX_TURRETS, true);
    // the friendly outline: same geometry, green back-face twin
    jetOutlineMesh = new THREE.InstancedMesh(parts.jet.geo, allyOutlineMat, MAX_TURRETS);
    jetOutlineMesh.count = 0;
    jetOutlineMesh.frustumCulled = false;
    jetOutlineMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    world.add(jetOutlineMesh);
    platMesh = instanced(parts.hover, MAX_TURRETS, true);
    coreMesh = instanced(parts.core, MAX_TURRETS, true);
    batteryMesh = instanced(parts.battery, MAX_TURRETS, true);   // it slews to aim
    // the outpost is modelled centred on its own origin; drop it so the
    // ground plate sits on the tile instead of half-buried
    parts.recovery.geo.computeBoundingBox();
    const rbb = parts.recovery.geo.boundingBox;
    if (rbb) parts.recovery.geo.translate(0, -rbb.min.y, 0);
    recoveryMesh = instanced(parts.recovery, MAX_TURRETS, false);
    rebuildRecoveryMesh();

    // the fighter's landing pad: base at y=0 like the other ground plates,
    // and the deck top measured so a parked jet rests on it exactly
    parts.jetpad.geo.computeBoundingBox();
    const jpb = parts.jetpad.geo.boundingBox;
    if (jpb) {
      parts.jetpad.geo.translate(0, -jpb.min.y, 0);
      JETPAD_H = jpb.max.y - jpb.min.y;
    }
    // the interceptor is modelled nose-on -X; lay it onto -Z like everything
    // else that flies, then measure its belly for the resting altitude
    parts.jet.geo.rotateY(-Math.PI / 2);
    parts.jet.geo.computeBoundingBox();
    if (parts.jet.geo.boundingBox) JET_BELLY = -parts.jet.geo.boundingBox.min.y;
    jetpadMesh = instanced(parts.jetpad, MAX_TURRETS, true);
    jetpadOutline = makeAllyOutline(parts.jetpad.geo, MAX_TURRETS);

    // the recon satellite, floating free: no grounding translate
    satMesh = instanced(parts.sat, MAX_TURRETS, true);
    satOutline = makeAllyOutline(parts.sat.geo, MAX_TURRETS);

    // its ground station: base at y=0 like the other ground plates
    parts.satpad.geo.computeBoundingBox();
    const spb = parts.satpad.geo.boundingBox;
    if (spb) parts.satpad.geo.translate(0, -spb.min.y, 0);
    satpadMesh = instanced(parts.satpad, MAX_TURRETS, true);
    satpadOutline = makeAllyOutline(parts.satpad.geo, MAX_TURRETS);

    // green twins for everything the player builds
    padOutline = makeAllyOutline(parts.pad.geo, MAX_TURRETS);
    gunOutline = makeAllyOutline(parts.gun.geo, MAX_TURRETS);
    platOutline = makeAllyOutline(parts.hover.geo, MAX_TURRETS);
    coreOutline = makeAllyOutline(parts.core.geo, MAX_TURRETS);
    batteryOutline = makeAllyOutline(parts.battery.geo, MAX_TURRETS);
    recoveryOutline = makeAllyOutline(parts.recovery.geo, MAX_TURRETS);

    // The dreadnaught's cannon is modelled as a ground turret: ball base
    // below, barrel riding on top, muzzle down -X. Slung under a hull it
    // hangs the other way up, so the barrel is laid onto -Z, the assembly
    // is rolled over, and the pivot is moved to the centre of the ball -
    // the ball seats against the hull's belly like a socket joint and the
    // barrel swings about it toward whatever the ship is shelling.
    parts.dreadgun.geo.rotateY(-Math.PI / 2);
    parts.dreadgun.geo.computeBoundingBox();
    const dgb = parts.dreadgun.geo.boundingBox;
    if (dgb) {
      const gp = parts.dreadgun.geo.attributes.position;
      // the ball is the lowest feature: its bottom cap locates its axis...
      let x0 = 0, z0 = 0, n = 0;
      for (let i = 0; i < gp.count; i++) {
        if (gp.getY(i) < dgb.min.y + 0.06) { x0 += gp.getX(i); z0 += gp.getZ(i); n++; }
      }
      if (n) { x0 /= n; z0 /= n; }
      // ...and the widest reach of the lower half measures its radius
      let ballR = 0;
      for (let i = 0; i < gp.count; i++) {
        if (gp.getY(i) < (dgb.min.y + dgb.max.y) / 2) {
          ballR = Math.max(ballR, Math.hypot(gp.getX(i) - x0, gp.getZ(i) - z0));
        }
      }
      parts.dreadgun.geo.translate(-x0, -(dgb.min.y + ballR), -z0);
      parts.dreadgun.geo.rotateZ(Math.PI);
      // hang the ball so its top presses into the hull's own measured belly
      parts.dread.geo.computeBoundingBox();
      DREAD_GUN_DROP = -parts.dread.geo.boundingBox.min.y + ballR * DREAD_GUN_K - 0.06;
    }
    dreadGunMesh = instanced(parts.dreadgun, MAX_ALIENS, true);
    dreadGunOutline = new THREE.InstancedMesh(parts.dreadgun.geo, outlineMat, MAX_ALIENS);
    dreadGunOutline.count = 0;
    dreadGunOutline.frustumCulled = false;
    dreadGunOutline.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    world.add(dreadGunOutline);

    // both projectiles are authored nose-up (+Y); lay them onto -Z once so
    // updateBullets can just point the instance down its velocity
    parts.slug.geo.rotateX(-Math.PI / 2);
    parts.missile.geo.rotateX(-Math.PI / 2);
    shellMesh = instanced(parts.slug, BULLET_MAX, true);
    missileMesh = instanced(parts.missile, BULLET_MAX, true);


    for (let i = 0; i < MAX_SHIPS; i++) {
      const m = new THREE.Mesh(parts.mother.geo, parts.mother.mat);  // geo/mat shared
      m.frustumCulled = false;
      m.visible = false;
      // the hostile outline rides along as a slightly larger back-face child
      const o = new THREE.Mesh(parts.mother.geo, outlineMat);
      o.scale.setScalar(OUTLINE_SCALE);
      o.frustumCulled = false;
      m.add(o);
      world.add(m);
      motherMeshes.push(m);
    }

    // swap the stand-ins out from under the enemy meshes so every existing
    // reference stays valid; the outline twin shares the same geometry
    for (const t in enemyMeshes) {
      const m = enemyMeshes[t];
      m.geometry.dispose();
      m.material.dispose();
      m.geometry = parts[t].geo;
      m.material = parts[t].mat;
      outlineMeshes[t].geometry = parts[t].geo;
    }
  }

  // ---------- catalog & button art ----------
  //
  //  Every button and catalog entry shows the unit's real model: each rig
  //  is assembled from the loaded parts and rendered once to a small
  //  canvas, so the art always matches whatever GLB is actually shipped.
  const thumbs = {};

  function setArt(img, key) {
    img.src = thumbs[key];
  }

  function texturesReady(parts) {
    const maps = [];
    for (const n in parts) {
      const m = parts[n].mat;
      for (const t of [m.map, m.emissiveMap]) if (t && !t.image) maps.push(t);
    }
    if (!maps.length) return Promise.resolve();
    const t0 = performance.now();
    return new Promise(res => {
      const tick = () =>
        (maps.every(t => t.image) || performance.now() - t0 > 3000) ? res() : setTimeout(tick, 30);
      tick();
    });
  }

  function makeThumbs(parts) {
    const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    r.setSize(128, 128);
    r.outputEncoding = THREE.sRGBEncoding;
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xcfe0ff, 0x333322, 0.9));
    const sun = new THREE.DirectionalLight(0xfff0dd, 1.5);
    sun.position.set(3, 5, 4);
    sc.add(sun);
    const cam = new THREE.PerspectiveCamera(35, 1, 0.01, 100);

    const part = (p, s, y) => {
      const m = new THREE.Mesh(p.geo, p.mat);
      if (s) m.scale.setScalar(s);
      if (y) m.position.y = y;
      return m;
    };
    const kc = PLAT_R * CORE_FIT / CORE_R;
    const RIGS = {
      turret:   () => [part(parts.pad), part(parts.gun, 1, GUN_SEAT)],
      battery:  () => [part(parts.pad), part(parts.battery, PAD_R * BATTERY_FIT / BATTERY_R, GUN_SEAT * BATTERY_SEAT)],
      cannon:   () => [part(parts.hover), part(parts.core, kc, PLAT_DECK),
                       part(parts.gun, kc * CORE_GUN, PLAT_DECK + CORE_SEAT * kc)],
      jet:      () => [part(parts.jetpad, JETPAD_FIT), part(parts.jet, 1, 0.85)],
      recovery: () => [part(parts.recovery)],
      sat:      () => [part(parts.satpad, SATPAD_FIT), part(parts.sat, 0.5, 1.1)],
      dropship: () => [part(parts.viper)],
      dart:     () => [part(parts.dart)],
      hulk:     () => [part(parts.hulk)],
      dread:    () => {
        const gun = part(parts.dreadgun, DREAD_GUN_K);
        gun.position.y = -DREAD_GUN_DROP;
        gun.rotation.x = -Math.PI / 2;                 // barrel pointing down, at rest
        return [part(parts.dread), gun];
      },
      mothership: () => [part(parts.mother)]
    };
    const box = new THREE.Box3(), sph = new THREE.Sphere();
    for (const k in RIGS) {
      const g = new THREE.Group();
      for (const m of RIGS[k]()) g.add(m);
      g.rotation.y = Math.PI;        // face the other way in the portrait
      sc.add(g);
      box.setFromObject(g).getBoundingSphere(sph);
      const d = sph.radius * 2.7;
      cam.position.set(sph.center.x + d * 0.62, sph.center.y + d * 0.42, sph.center.z + d * 0.66);
      cam.lookAt(sph.center);
      r.render(sc, cam);
      thumbs[k] = r.domElement.toDataURL();
      sc.remove(g);
    }
    r.dispose();

    for (const [id, k] of [['img-turret', 'turret'], ['img-jet', 'jet'],
         ['img-cannon', 'cannon'], ['img-battery', 'battery'],
         ['img-recovery', 'recovery'], ['img-sat', 'sat']]) {
      setArt(document.getElementById(id), k);
    }
    buildCatalog();
  }

  //  What each thing is FOR, in one breath apiece.
  const CATALOG = [
    ['side', 'Your forces'],
    ['turret', 'Railgun Turret', BAL.turretCost,
     'The line gun. Leads its shots and slews fast; mountains stretch its reach and ceiling.'],
    ['jet', 'Fighter', BAL.jetCost,
     'Patrols a circle around its base hex and dives on anything inside it. Its landing pad claims the hex it flies from. Darts hunt it.'],
    ['cannon', 'Sea Cannon', BAL.cannonCost,
     'The water build: a floating railgun with longer reach, a heavier slug and a higher ceiling than a land turret. Unlocks when a drop zone first covers water.'],
    ['battery', 'Missile Battery', BAL.batteryCost,
     'Five homing missiles on independent reloads: it ripples off a full salvo, each burst splashing everything near the hit, then the tubes come back one by one. Engages highest of all.'],
    ['recovery', 'Recovery Team', BAL.recoveryCost,
     'The only thing that builds on dead ground. Digs a crossed-out tile back out, one wave of work per wave it has been lost, and defends itself with sidearms. Unlocks the first time a hex is lost.'],
    ['sat', 'Recon Satellite', BAL.satCost,
     'Parks in stationary orbit over its hex, above every gun’s reach, and reveals cloaked ships in the rings beneath so your units can target them. No weapons of its own. Unlocks when the enemy starts cloaking.'],
    ['side', 'The enemy'],
    ['dropship', 'Dropship', null,

    ['dart', 'Dart', null,

    ['hulk', 'Hulk', null,

    ['dread', 'Dreadnaught', null,
     'Orbital bombardment ship. Holds station at railgun height and shells your emplacements with a railgun’s own reach — it never lands, so its wave ends only when it falls.'],
    ['mothership', 'Mothership', null,
     'Holds station off-planet and launches the wave into its drop zone. More arrive as the waves go on, each picking its own bearing.']
  ];

  function buildCatalog() {
    const list = document.getElementById('catalogList');
    list.innerHTML = '';
    for (const e of CATALOG) {
      if (e[0] === 'side') {
        const h = document.createElement('div');
        h.className = 'cat-side';
        h.textContent = e[1];
        list.appendChild(h);
        continue;
      }
      const row = document.createElement('div');
      row.className = 'cat-row';
      const img = document.createElement('img');

      setArt(img, e[0]);
      const txt = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'cat-name';

        name.appendChild(b);

      txt.appendChild(desc);

  }

  const startBtn = document.getElementById('startBtn');

  async function loadModels() {
    startBtn.disabled = true;
    startBtn.textContent = 'Loading models\u2026';
    const names = Object.keys(MODEL_URLS);
    const parts = {}, missing = [];
    // each model loads (or falls back) on its own, so one bad file costs one
    // placeholder rather than the whole set
    await Promise.all(names.map(async n => {
      for (const url of MODEL_URLS[n]) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          parts[n] = parseGLB(await res.arrayBuffer());
          return;
        } catch (e) {
          console.warn(n + ' failed from ' + url, e);
        }
      }
      missing.push(n);
      parts[n] = placeholderPart(n);
    }));
    buildModels(parts);
    // parseGLB's textures decode asynchronously, and a thumb rendered
    // before its map arrives comes out fully transparent (the stand-in
    // sampler writes alpha 0). The maps are data: URIs, so waiting for
    // them costs milliseconds; the timeout covers a map whose load failed
    // and will never arrive.
    await texturesReady(parts);
    makeThumbs(parts);
    if (missing.length) console.warn('models missing, using placeholders:', missing.join(', '));
    const gone = missing.filter(n => !OPTIONAL_MODELS.has(n));
    if (gone.length) say('MODELS MISSING: ' + gone.join(', ').toUpperCase(), true);
    startBtn.disabled = false;
    startBtn.textContent = 'Start';
  }

  // ---------- start card ----------
  const startModal = document.getElementById('startModal');
  loadModels();
  const sizeBtns = [...startModal.querySelectorAll('.sizes button')];
  let chosenFreq = 1;

  for (const b of sizeBtns) {
    b.addEventListener('click', () => {
      chosenFreq = +b.dataset.freq;
      for (const o of sizeBtns) o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
    });
  }

  startBtn.addEventListener('click', () => {
    startModal.classList.remove('open');
    if (chosenFreq !== freqIdx) {                    // only rebuild if it changed
      freqIdx = chosenFreq;
      makeGrid();
      randomise();
    }
    G.started = true;
    resetGame();                                     // picks the first bearing
  });

  // ---------- world menu ----------
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');

  function setMenu(open) {
    menuPanel.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();

  // the panel swallows its own clicks so picking an item does not close it

  document.addEventListener('click', () => setMenu(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

  // ---------- catalog ----------
  const catalogModal = document.getElementById('catalogModal');
  document.getElementById('catalogBtn').addEventListener('click', () => {
    setMenu(false);
    catalogModal.classList.add('open');
  });
  document.getElementById('catalogClose').addEventListener('click', () => catalogModal.classList.remove('open'));

  // ---------- picking ----------
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();

  function cellForFace(f) {
    let lo = 0, hi = cellFaceStart.length - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (cellFaceStart[mid] <= f) lo = mid; else hi = mid - 1;
    }
    return lo;
  }

  function tapAt(clientX, clientY) {
    if (!tileMesh || G.over || !G.started || G.paused) return;
    ndc.x = (clientX / window.innerWidth) * 2 - 1;
    ndc.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObject(tileMesh, false)[0];
    if (!hit || hit.faceIndex === undefined) { hideUnitCard(); return; }
    const ci = cellForFace(hit.faceIndex);

    if (!G.build) {
      // no build mode armed: a tap inspects. Your building opens its card,
      // bare ground closes whatever card was up.
      if (buildingAt(ci)) openUnitCard(ci, clientX, clientY);
      else hideUnitCard();
      return;
    }
    // dead ground is off limits to everything except a recovery team, which
    // is the only thing that can be built there and the only way back
    if (G.build === 'recovery') {
      if (!cellDead[ci]) { say('RECOVERY TEAMS ONLY WORK LOST TILES'); return; }
      if (recoveryAt.has(ci)) { say('TEAM ALREADY WORKING'); return; }
      if (recoveries.length >= MAX_TURRETS) { say('RECOVERY LIMIT REACHED'); return; }
      if (G.gold < BAL.recoveryCost) { say('NOT ENOUGH GOLD'); return; }
      spend(BAL.recoveryCost);
      const r = placeRecovery(ci);
      if (r) say('RECOVERY IN ' + r.need + (r.need === 1 ? ' WAVE' : ' WAVES'));
      return;
    }
    if (cellDead[ci]) { say('DEAD GROUND'); return; }
    // fighters and satellites anchor to a tile rather than build on it,
    // so both can sit over water
    const wet = cellType[ci] === 'lake';
    if (wet && G.build !== 'fighter' && G.build !== 'cannon' && G.build !== 'sat') { say('CANNOT BUILD ON WATER'); return; }
    if (!wet && G.build === 'cannon') { say('SEA CANNON NEEDS WATER'); return; }
    // every unit claims its hex outright: one occupant per tile
    if (towerAt.has(ci) || fighterAt.has(ci) || satAt.has(ci)) {
      say(G.build === 'fighter' && fighterAt.has(ci) ? 'FIGHTER ALREADY BASED HERE' : 'TILE OCCUPIED');
      return;
    }

    if (G.build === 'sat') {
      if (G.gold < BAL.satCost) { say('NOT ENOUGH GOLD'); return; }
      if (!placeSat(ci)) { say('SATELLITE LIMIT REACHED'); return; }
      spend(BAL.satCost);
      return;
    }

    if (G.build === 'cannon') {
      if (G.gold < BAL.cannonCost) { say('NOT ENOUGH GOLD'); return; }
      if (!placeCannon(ci)) { say('CANNON LIMIT REACHED'); return; }
      spend(BAL.cannonCost);
      return;
    }

    if (G.build === 'battery') {
      if (G.gold < BAL.batteryCost) { say('NOT ENOUGH GOLD'); return; }
      if (!placeBattery(ci)) { say('BATTERY LIMIT REACHED'); return; }
      spend(BAL.batteryCost);
      return;
    }

    if (G.build === 'fighter') {
      if (fighters.length >= MAX_TURRETS) { say('FIGHTER LIMIT REACHED'); return; }
      if (G.gold < BAL.jetCost) { say('NOT ENOUGH GOLD'); return; }
      spend(BAL.jetCost);
      placeFighter(ci);
      return;
    }
    if (towers.length >= MAX_TURRETS) { say('TURRET LIMIT REACHED'); return; }
    if (G.gold < BAL.turretCost) { say('NOT ENOUGH GOLD'); return; }
    spend(BAL.turretCost);
    placeTurret(ci);
  }

  // =====================================================================
  //  UPGRADES
  //
  //  Three levels per building, paid for in place through the unit card
  //  that opens when you tap one of your buildings. The price is a share
  //  of the building's own cost times the level being bought, so growing a
  //  cheap turret stays cheap. Guns gain damage and ceiling; fighters
  //  gain damage. The upgrade dies with
  //  the building - a levelled turret is a bigger bet on the same square
  //  of ground, which is the point.
  // =====================================================================
  const UPG_BASE = {
    turret: 'turretCost', cannon: 'cannonCost', battery: 'batteryCost'
  };

  function buildingAt(ci) {
    return towerAt.get(ci) || recoveryAt.get(ci) || fighterAt.get(ci) || satAt.get(ci) || null;
  }

  function upgradeBase(ci) {
    const t = towerAt.get(ci);
    return t ? BAL[UPG_BASE[t.kind]] : BAL.jetCost;
  }

  function upgradeAt(ci) {
    if (recoveryAt.has(ci) || satAt.has(ci)) return;   // nothing to level
    const b = buildingAt(ci);
    if (!b || b.level >= BAL.upgradeMax) return;
    const cost = BAL.upgradeCost(upgradeBase(ci), b.level + 1);
    if (G.gold < cost) { say('UPGRADE COSTS ' + cost + ' GOLD'); return; }
    spend(cost);
    b.level++;
    if (towerAt.get(ci) === b) {
      b.dmg = Math.round(b.dmg * BAL.upgradeDmg);
      if (b.splashDmg) b.splashDmg = Math.round(b.splashDmg * BAL.upgradeDmg);
      b.ceiling += BAL.upgradeCeil;
    } else {
      b.dmg = Math.round(b.dmg * BAL.upgradeDmg);   // the fighter's guns
    }
    say('LEVEL ' + b.level);
  }

  function resetGame() {
    clearTurrets();
    clearFighters();
    clearRecoveries();
    clearSats();
    clearEnemies();
    clearDead();
    resetBullets();
    sCount = 0;
    smokeGeo.setDrawRange(0, 0);
    G.hp = G.hpMax; G.gold = BAL.startGold; G.wave = 0; G.spent = 0;
    G.inWave = false; G.breakLeft = BAL.breakTime; G.queue = [];
    G.over = false;
    G.paused = false;
    G.landed = 0;
    hideSummary();
    hideUnitCard();
    document.getElementById('lossModal').classList.remove('open');
    alertEl.classList.add('quiet');    // a sticky PLANET LOST must not
    alertUntil = 0;                    // outlive the game it belongs to
    G.ships.length = 0;
    hideMothers();
    G.bearing = null;
    // a fresh run re-locks the situational tools; the first pickBearing
    // below may immediately re-open the cannon yard if the zone is wet
    G.unlocked.cannon = G.unlocked.recovery = G.unlocked.sat = false;
    applyLocks();
    pickBearing();
    G.newShip = null;                  // the founding ship is not "news"
    // open on the first drop zone, so nobody starts a run by hunting for it
    if (G.ships.length) swingTo(meanBearing());
    setBuild(null);
    G.ready = true;
    updateHud();
  }

  // ---------- orbit ----------
  const orient = new THREE.Quaternion();
  const orientGoal = new THREE.Quaternion();
  const OFFSET = new THREE.Vector3(0, 0, 1);
  const UP = new THREE.Vector3(0, 1, 0);
  const RIGHT = new THREE.Vector3(1, 0, 0);
  const TARGET = new THREE.Vector3(0, 0, 0);
  const targetGoal = new THREE.Vector3(0, 0, 0);

  let distance = 6, distanceGoal = 6;
  let MIN_D = 1.15, MAX_D = 18;
  let velX = 0, velY = 0;
  let dragging = false, engaged = false;
  const pointers = new Map();
  let pinchStart = 0, pinchDist = 0;
  let downX = 0, downY = 0, downT = 0, moved = 0;
  const TAP_SLOP = 8, TAP_MS = 600;
  const qTmp = new THREE.Quaternion(), qA = new THREE.Quaternion(), qB = new THREE.Quaternion();
  const tmpDir = new THREE.Vector3();

  // Rotate the globe about its own centre, around the axes the camera is
  // actually looking along, so a drag pushes the surface the way the finger
  // goes no matter where on the ball you are.
  const spinAxis = new THREE.Vector3(), qSpin = new THREE.Quaternion();

  function spinWorld(dx, dy) {
    worldTween = false;              // a hand on the planet beats the auto-swing
    camera.updateMatrixWorld();
    spinAxis.setFromMatrixColumn(camera.matrixWorld, 1).normalize();   // camera up
    qSpin.setFromAxisAngle(spinAxis, dx);
    world.quaternion.premultiply(qSpin);
    spinAxis.setFromMatrixColumn(camera.matrixWorld, 0).normalize();   // camera right
    qSpin.setFromAxisAngle(spinAxis, dy);
    world.quaternion.premultiply(qSpin);
  }

  // one entry point for drag, inertia, drift and the arrow keys: in surface
  // view the world turns, otherwise the camera orbits
  function applySpin(vx, vy) {
    if (surfaceView) spinWorld(-vx, -vy); else rotateBy(vx, vy);
  }

  function rotateBy(dx, dy) {
    qTmp.setFromAxisAngle(UP, dx);    orient.multiply(qTmp);
    qTmp.setFromAxisAngle(RIGHT, dy); orient.multiply(qTmp);
    orientGoal.copy(orient);          // a live drag cancels any running tween
  }
  function applyCamera() {
    camera.position.copy(OFFSET).applyQuaternion(orient).multiplyScalar(distance).add(TARGET);
    camera.up.copy(UP).applyQuaternion(orient);
    camera.lookAt(TARGET);
  }

  // =====================================================================
  //  Two camera modes.
  //
  //  The framed cap sits 39 degrees off the pole, holds about 11% of the
  //  surface area and is 1.26 across. Over that span the surface drops 0.22,
  //  so it reads as a gently domed plane rather than a ball.
  //
  //  The cap is fitted to the frame HEIGHT, never its width. Fitting the width
  //  on a portrait phone would need a distance near 2.8, which puts the whole
  //  sphere back in frame and defeats the point; cropping the sides instead
  //  keeps the view close at every aspect ratio.
  // =====================================================================
  const viewBtn = document.getElementById('viewBtn');
  const CAP_RIM = 0.6323;            // sin(39.2 deg)
  const SURFACE_TILT = 0.50;         // radians above the local tangent plane
  let surfaceView = false;

  const rimPt = new THREE.Vector3(), rimV = new THREE.Vector3();
  const camF = new THREE.Vector3(), camU = new THREE.Vector3(), camC = new THREE.Vector3();

  // half-angle subtended by the cap rim, vertically, from distance d
  function rimHalfAngle(d) {
    const st = Math.sin(SURFACE_TILT), ct = Math.cos(SURFACE_TILT);
    camC.set(0, RADIUS + st * d, ct * d);
    camF.set(0, -st, -ct);
    camU.set(0, ct, -st);
    const y = Math.sqrt(Math.max(RADIUS * RADIUS - CAP_RIM * CAP_RIM, 0));
    let worst = 0;
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * Math.PI * 2;
      rimPt.set(CAP_RIM * Math.sin(a), y, CAP_RIM * Math.cos(a));
      rimV.subVectors(rimPt, camC);
      const depth = rimV.dot(camF);
      if (depth <= 1e-6) continue;
      worst = Math.max(worst, Math.abs(Math.atan2(rimV.dot(camU), depth)));
    }
    return worst;
  }

  // solved rather than hardcoded, so editing CAP_RIM or SURFACE_TILT stays sane
  function surfaceDistance() {
    const goal = THREE.MathUtils.degToRad(camera.fov) / 2 * 0.95;
    let lo = 0.4, hi = 8;
    for (let i = 0; i < 40; i++) {
      const mid = (lo + hi) / 2;
      if (rimHalfAngle(mid) > goal) lo = mid; else hi = mid;
    }
    return hi;
  }

  function setView(on) {
    surfaceView = on;
    viewBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    viewBtn.textContent = on ? 'Whole sphere' : 'Surface view';
    engaged = true;                  // stop the idle drift fighting the tween
    velX = velY = 0;                 // don't carry a camera flick into a world spin

    // swing up from wherever the camera already is, so the move reads as one
    // continuous motion instead of a cut
    tmpDir.copy(OFFSET).applyQuaternion(orient);
    const az = Math.atan2(tmpDir.x, tmpDir.z);

    if (on) {
      targetGoal.set(0, RADIUS, 0);
      MIN_D = 0.3; MAX_D = 4.5;
      distanceGoal = surfaceDistance();
      qA.setFromAxisAngle(UP, az);
      qB.setFromAxisAngle(RIGHT, -SURFACE_TILT);
      orientGoal.copy(qA).multiply(qB);
    } else {
      targetGoal.set(0, 0, 0);
      MIN_D = 1.15; MAX_D = 18;
      distanceGoal = 6;
      qA.setFromAxisAngle(UP, az);
      qB.setFromAxisAngle(RIGHT, -0.35);
      orientGoal.copy(qA).multiply(qB);
    }
  }

  // ---------- placement ----------
  const gridBtn = document.getElementById('gridBtn');
  const randBtn = document.getElementById('randBtn');
  const countEl = document.getElementById('count');
  const hint = document.getElementById('hint');

  gridBtn.addEventListener('click', () => {
    freqIdx = (freqIdx + 1) % FREQS.length;
    makeGrid();
    randomise();                     // a new grid deserves a world on it
  });
  randBtn.addEventListener('click', randomise);
  viewBtn.addEventListener('click', () => setView(!surfaceView));

  function updateCount() {
    if (!cellType) return;
    let land = 0, water = 0;
    for (const t of cellType) t === 'lake' ? water++ : land++;
    countEl.textContent = land + ' land / ' + water + ' water';
  }

  // ---------- input ----------
  function engage() {
    engaged = true;
  }
  function speed() { return 0.005 * (camera.fov / 45); }

  stage.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.setPointerCapture(e.pointerId);
    dragging = true;
    stage.classList.add('dragging');
    velX = velY = 0;
    engage();
    downX = e.clientX; downY = e.clientY; downT = performance.now(); moved = 0;
    if (pointers.size === 2) { pinchStart = pinchSpan(); pinchDist = distanceGoal; }
  });

  stage.addEventListener('pointermove', (e) => {
    const prev = pointers.get(e.pointerId);
    if (!prev) {
      return;
    }
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    prev.x = e.clientX; prev.y = e.clientY;
    moved = Math.max(moved, Math.hypot(e.clientX - downX, e.clientY - downY));

    if (pointers.size >= 2) {
      const span = pinchSpan();
      if (pinchStart > 0) distanceGoal = clamp(pinchDist * (pinchStart / span), MIN_D, MAX_D);
      return;
    }
    velX = -dx * speed();
    velY = -dy * speed();
    applySpin(velX, velY);
  });

  function release(e, isTapCandidate) {
    const wasSingle = pointers.size === 1;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = 0;
    if (pointers.size === 0) { dragging = false; stage.classList.remove('dragging'); }
    if (isTapCandidate && wasSingle && moved < TAP_SLOP &&
        performance.now() - downT < TAP_MS) {
      tapAt(e.clientX, e.clientY);
    }
  }
  stage.addEventListener('pointerup', (e) => release(e, true));
  stage.addEventListener('pointercancel', (e) => release(e, false));
  stage.addEventListener('lostpointercapture', (e) => release(e, false));

  function pinchSpan() {
    const p = [...pointers.values()];
    if (p.length < 2) return 0;
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
  }

  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    engage();
    distanceGoal = clamp(distanceGoal * (1 + Math.sign(e.deltaY) * 0.1), MIN_D, MAX_D);
  }, { passive: false });

  stage.addEventListener('keydown', (e) => {
    const step = 0.06;
    const map = {
      ArrowLeft: [step, 0], ArrowRight: [-step, 0],
      ArrowUp: [0, step], ArrowDown: [0, -step]
    };
    if (map[e.key]) { e.preventDefault(); engage(); applySpin(map[e.key][0], map[e.key][1]); }
    if (e.key === '+' || e.key === '=') distanceGoal = clamp(distanceGoal - 0.5, MIN_D, MAX_D);
    if (e.key === '-' || e.key === '_') distanceGoal = clamp(distanceGoal + 0.5, MIN_D, MAX_D);
    if (e.key === 'v' || e.key === 'V') setView(!surfaceView);
    if (e.key === 'r' || e.key === 'R') randomise();
    if (e.key === 'b' || e.key === 'B') setBuild(G.build === 'turret' ? null : 'turret');
    if (e.key === 'f' || e.key === 'F') setBuild(G.build === 'fighter' ? null : 'fighter');
    if (e.key === 'c' || e.key === 'C') setBuild(G.build === 'cannon' ? null : 'cannon');
    if (e.key === 'm' || e.key === 'M') setBuild(G.build === 'battery' ? null : 'battery');
    if (e.key === 'x' || e.key === 'X') setBuild(G.build === 'recovery' ? null : 'recovery');
    if (e.key === 'o' || e.key === 'O') setBuild(G.build === 'sat' ? null : 'sat');
  });

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  let readoutTick = 0;

  let lastT = performance.now();

  function frame() {
    requestAnimationFrame(frame);
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);   // a hidden tab must not
    lastT = now;                                       // land a whole wave at once

    if (worldTween && !dragging) {
      world.quaternion.slerp(qWorldGoal, 0.05);
      if (world.quaternion.angleTo(qWorldGoal) < 0.01) worldTween = false;
    }
    gameTick(dt);

    // the next drop zone flashes slowly through the break so it cannot be
    // missed on the far side of a busy planet; once the wave is live the
    // ring holds steady. Reduced motion keeps it steady throughout.
    zoneMat.opacity = (G.started && !G.over && !G.inWave && !reduced)
      ? 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(now * 0.003))
      : 0.9;
    // the interior ripples crawl inward; reduced motion holds them still
    if (!reduced) rippleMat.uniforms.uT.value = now * 0.001;

    if (!dragging) {
      if (Math.abs(velX) > 1e-5 || Math.abs(velY) > 1e-5) {
        velX *= 0.94; velY *= 0.94;
        applySpin(velX, velY);
      } else if (!engaged && !reduced) {
        applySpin(0.0016, 0);
      }
    }
    if (!dragging) orient.slerp(orientGoal, 0.12);
    TARGET.lerp(targetGoal, 0.12);
    distance += (distanceGoal - distance) * 0.12;
    applyCamera();
    if (++readoutTick % 4 === 0) updateHud();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    smokeMat.uniforms.uScale.value = window.innerHeight * 0.5;
    starMat.uniforms.uScale.value = window.innerHeight * 0.5;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  makeGrid();
  randomise();                       // a world to look at behind the start card
  updateHud();
  rotateBy(0.5, -0.35);
  orientGoal.copy(orient);
  applyCamera();
  frame();

})();
</script>
</body>
</html>
