<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Planet Defense</title>
<!--
  Both models were supplied by the user, merged, decimated and re-encoded as
  quantised vertex data with palette colours sampled from their textures.
  Neither glTF carried licence metadata.
-->
<style>
  :root{
    --void:#0b0e13;
    --void-2:#151b25;
    --line:#2a3442;
    --ink:#c9d4e2;
    --ink-dim:#5c6a7d;
    --hot:#ffb454;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--void)}
  body{
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:fixed;inset:0;
    touch-action:none;
    cursor:grab;
    background:radial-gradient(circle at 50% 45%, var(--void-2) 0%, var(--void) 70%);
  }
  #stage.dragging{cursor:grabbing}
  canvas{display:block}

  .hud{
    position:fixed;
    z-index:2;
    pointer-events:none;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .hud.tl{top:20px;left:20px}
  .hud.bl{bottom:20px;left:20px}
  .hud.br{bottom:20px;right:20px;text-align:right}
  .hud.tc{top:20px;left:50%;transform:translateX(-50%);text-align:center}

  /* Wave summary. It sits above the HUD but only the card itself takes
     clicks, so the planet stays draggable behind it. The game pauses while
     the card is open; autoplay just dismisses it after a few seconds. */
  .modal{
    position:fixed;z-index:100;
    top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);
    pointer-events:none;opacity:0;
    transition:opacity .18s ease, transform .18s ease;
  }
  .modal.open{opacity:1;transform:translate(-50%,-50%) scale(1)}
  /* The card never leaves the DOM, it just fades. pointer-events:auto on a
     child overrides the parent's none, so while closed it was an invisible
     300px slab parked over the middle of the screen eating every tap on the
     planet. It only accepts clicks when it is actually open. */
  .modal-card{
    pointer-events:none;
    visibility:hidden;
    min-width:300px;
    padding:22px 26px 18px;
    background:rgba(9,11,14,.985);
    border:1px solid var(--hot);
    box-shadow:0 18px 48px rgba(0,0,0,.65), 0 0 26px rgba(255,180,84,.10);
    text-align:center;
  }
  .modal-title{
    font-size:20px;letter-spacing:.30em;color:var(--hot);
    text-transform:uppercase;
  }
  .modal-rows{margin:18px 0 4px;display:flex;flex-direction:column;gap:10px}
  .modal-row{
    display:flex;justify-content:space-between;gap:28px;
    font-size:15px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-dim);font-variant-numeric:tabular-nums;
  }
  .modal-row b{color:var(--ink);font-weight:400}
  .modal-row.bad b{color:#ff5f56}
  .modal-row.pay b{color:var(--hot)}

  /* The wave report: every line starts hidden and fades in on its own cue,
     one after another, with the numbers counting up as their line lands. */
  .wave-card{min-width:340px;max-width:420px}
  .wc-line{
    opacity:0;transform:translateY(8px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .wc-line.on{opacity:1;transform:none}
  .wc-title{
    font-size:26px;letter-spacing:.26em;color:var(--hot);
    text-transform:uppercase;
  }
  .wc-stat{
    margin-top:13px;font-size:16px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }
  .wc-stat b{color:var(--ink);font-weight:400}
  .wc-stat.pay b{color:var(--hot)}
  .wc-stat.bad b{color:#ff5f56}
  .wc-new{margin:16px auto 0;max-width:36ch;text-align:left}
  .wc-new-h{color:var(--hot);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  .wc-new-d{margin-top:6px;color:var(--ink);font-size:13px;line-height:1.65}
  .wc-continue{
    margin-top:18px;width:100%;
    font-size:16px;letter-spacing:.26em;padding:12px;
  }
  /* fleet warning: only present on the cards before a wave that adds a
     mothership, and loud, because the answer to it costs a whole break */
  .modal-warn{
    display:none;
    margin-top:14px;
    color:#ff5f56;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;
    animation:hpPulse .9s ease-in-out infinite;
  }
  .modal-warn.show{display:block}
  .modal.open .modal-card{pointer-events:auto;visibility:visible}
  .modal-card button{margin-top:16px;width:100%}

  /* Start card. Same click rules as the wave summary: only the card takes
     pointer events, so the planet stays draggable behind it. */
  .start-title{
    font-size:26px;letter-spacing:.34em;color:var(--ink);
    text-transform:uppercase;
  }
  .start-sub{margin-top:10px;color:var(--ink-dim);letter-spacing:.16em}
  .sizes{display:flex;gap:8px;margin:18px 0 4px}
  .sizes button{flex:1;padding:10px 6px;line-height:1.5}
  .sizes button .n{display:block;color:var(--ink-dim);margin-top:4px}
  .sizes button[aria-pressed="true"]{
    border-color:var(--hot);color:var(--hot);
    background:rgba(255,180,84,.10);
  }
  .sizes button[aria-pressed="true"] .n{color:var(--hot)}
  .check{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:14px;color:var(--ink-dim);cursor:pointer;user-select:none;
  }
  .check input{
    appearance:none;-webkit-appearance:none;
    width:14px;height:14px;margin:0;
    border:1px solid var(--line);background:transparent;cursor:pointer;
  }
  .check input:checked{background:var(--hot);border-color:var(--hot)}
  /* the menu outranks every other panel. Without this, paint order is
     document order and the top-centre block, which comes last, draws its
     bar straight over an open menu. */
  .hud.tr{top:20px;right:20px;text-align:right;z-index:50}

  /* world controls live behind one button so they stay out of the way of
     the things you touch every wave */
  /* .hud is pointer-events:none so the panels never block dragging the
     planet. Anything clickable inside one has to opt back in, or the click
     falls through to the canvas and starts an orbit instead. */
  .menu{position:relative;display:inline-block;pointer-events:auto}
  .menu-panel{
    position:absolute;top:calc(100% + 8px);right:0;
    display:none;flex-direction:column;gap:6px;
    padding:8px;
    background:rgba(9,11,14,.985);
    border:1px solid var(--line);
    border-radius:2px;
    min-width:168px;
    box-shadow:0 10px 24px rgba(0,0,0,.55);
  }
  .menu-panel.open{display:flex}
  .menu-panel button{width:100%;text-align:left}
  .menu-panel .count{padding:2px 2px 0;text-align:left}

  /* Unit card: pops up beside a tapped building. Its own fixed element, not
     inside a .hud, so it takes clicks without opting a whole panel back in. */
  .unitcard{
    position:fixed;z-index:60;display:none;
    min-width:190px;padding:12px 14px;
    background:rgba(9,11,14,.985);
    border:1px solid var(--line);border-radius:2px;
    box-shadow:0 10px 24px rgba(0,0,0,.55);
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  }
  .unitcard.open{display:block}
  .unit-name{color:var(--hot);letter-spacing:.22em;margin-bottom:8px}
  .unit-row{
    display:flex;justify-content:space-between;gap:18px;
    margin-top:5px;color:var(--ink-dim);font-variant-numeric:tabular-nums;
  }
  .unit-row b{color:var(--ink);font-weight:400}
  .unitcard button{width:100%;margin-top:10px}

  .stats{display:flex;gap:24px;align-items:center;justify-content:center;
         margin-top:12px;font-size:22px;letter-spacing:.10em;
         font-variant-numeric:tabular-nums}
  .stat{color:var(--ink-dim)}
  .stat b{color:var(--ink);font-weight:400;margin-left:10px}
  .stat.soon b{color:var(--hot)}
  .stat.hurt b{color:#ff5f56}
  /* Integrity is the only life total in the game, so it gets the loudest
     element on screen: black tube, red rule, red column. */
  .hpbar{
    position:relative;
    width:min(440px,64vw);height:34px;margin:6px auto 0;
    background:#050507;
    border:2px solid #ff2f2f;
    box-shadow:0 0 14px rgba(255,47,47,.28), inset 0 0 22px rgba(255,47,47,.10);
    overflow:hidden;
  }
  .hpfill{
    height:100%;width:100%;
    background:linear-gradient(180deg,#ff6a52 0%,#e01f14 55%,#8d0d06 100%);
    box-shadow:0 0 18px rgba(255,70,45,.55);
    transition:width .18s linear;
  }
  /* segment ticks, drawn over the fill so they read at any level */
  .hpbar::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg,
      rgba(0,0,0,0) 0 20px, rgba(0,0,0,.55) 20px 23px);
  }
  .hpfill.low{
    background:linear-gradient(180deg,#ff8a6a 0%,#ff2f2f 55%,#a11109 100%);
    animation:hpPulse .8s ease-in-out infinite;
  }
  @keyframes hpPulse{ 50%{ filter:brightness(1.55) } }
  /* the landing alarm: BREACH! strobes across the bar that just paid for it */
  .breach{
    position:absolute;inset:0;z-index:1;
    display:flex;align-items:center;justify-content:center;
    font-size:21px;letter-spacing:.34em;text-indent:.34em;
    color:#fff;text-shadow:0 0 10px #ff2f2f,0 1px 2px #000;
    opacity:0;pointer-events:none;
  }
  .breach.on{animation:breach 1.2s linear}
  @keyframes breach{
    0%,22%,44%{opacity:1}
    12%,34%,100%{opacity:0}
    66%{opacity:1}
  }
  @media (prefers-reduced-motion: reduce){
    .breach.on{animation:breachHold 1.2s linear}
    @keyframes breachHold{ 0%,80%{opacity:1} 100%{opacity:0} }
  }
  .hplabel{
    font-size:22px;
    letter-spacing:.20em;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .hplabel.low{color:#ff5f56}
  .alert{
    margin-top:8px;color:var(--hot);min-height:13px;
    transition:opacity .3s ease;
  }
  .alert.quiet{opacity:0}

  .title{font-size:12px;letter-spacing:.34em;color:var(--ink)}

  .hint{
    color:var(--ink-dim);
    transition:opacity .6s ease, color .2s ease;
    margin-bottom:12px;
    max-width:48ch;
  }
  .hint.gone{opacity:0}
  .hint.live{opacity:1;color:var(--hot)}

  .bar{
    pointer-events:auto;
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }

  /* the shop: image buttons stacked down the right edge, cost beside art,
     the gold readout sitting right on top of where it gets spent */
  .buildbar{
    right:20px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:9px;
    pointer-events:auto;
  }
  .buildbar .gold{
    text-align:center;font-size:19px;letter-spacing:.10em;
    font-variant-numeric:tabular-nums;margin-bottom:2px;
  }
  /* tools the situation has not yet demanded stay off the shelf */
  .buy.locked{display:none}
  .buy{
    display:flex;align-items:center;gap:10px;
    padding:5px 12px 5px 6px;
  }
  .buy img{
    width:46px;height:46px;display:block;
    object-fit:contain;
  }
  .buy .cost{
    font-size:15px;color:var(--hot);
    font-variant-numeric:tabular-nums;letter-spacing:.08em;
  }
  .buy[aria-pressed="true"] .cost{color:var(--void)}

  /* the one button that starts trouble on purpose: front and centre,
     sized like the integrity/gold readouts so it cannot be missed */
  .hud.bc{bottom:26px;left:50%;transform:translateX(-50%)}
  .nextwave{
    pointer-events:auto;
    font-size:22px;letter-spacing:.24em;
    padding:13px 30px;
  }

  /* the catalog: every unit on both sides, with its art and its job */
  .catalog-card{min-width:400px;max-width:480px;text-align:left}
  .catalog-title{
    font-size:20px;letter-spacing:.30em;color:var(--hot);
    text-transform:uppercase;text-align:center;
  }
  .catalog-list{
    margin-top:14px;max-height:60vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:12px;padding-right:6px;
  }
  .cat-side{
    color:var(--hot);font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;margin-top:6px;
  }
  .cat-row{display:flex;gap:12px;align-items:center}
  .cat-row img{width:52px;height:52px;flex:none;object-fit:contain}
  .cat-name{
    color:var(--ink);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;
  }
  .cat-name b{color:var(--hot);font-weight:400;margin-left:8px}
  .cat-desc{color:var(--ink-dim);font-size:12px;line-height:1.55;margin-top:3px}
  #catalogClose{margin-top:14px;width:100%}
  button{
    font:inherit;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink);
    background:rgba(21,27,37,.82);
    border:1px solid var(--line);
    border-radius:2px;
    padding:9px 14px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button:hover:not(:disabled){border-color:var(--ink-dim)}
  button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
  button[aria-pressed="true"]{
    color:var(--void);
    background:var(--hot);
    border-color:var(--hot);
  }
  button:disabled{opacity:.35;cursor:default}
  .count{
    color:var(--ink-dim);
    font-size:11px;
    letter-spacing:.12em;
    font-variant-numeric:tabular-nums;
  }
  @media (max-width:520px){
    .hud{font-size:10px}
    .hud.tl{top:14px;left:14px}
    .hud.bl{bottom:14px;left:14px}
    .hud.br{bottom:14px;right:14px}
    .hud.tc{top:14px}
    .hud.tr{top:14px;right:14px}
    .hpbar{height:26px;margin-top:8px}
    .stats{font-size:20px;gap:16px;letter-spacing:.06em}
    .modal-card{min-width:0;width:min(300px,84vw);padding:18px 18px 14px}
    .modal-title{font-size:17px;letter-spacing:.22em}
    .modal-row{font-size:13px;gap:16px}
    .start-title{font-size:19px;letter-spacing:.22em}
    .sizes button{padding:8px 4px}
    .hplabel{font-size:20px;letter-spacing:.14em}
    .buildbar{right:10px;gap:6px}
    .buildbar .gold{font-size:15px}
    .buy img{width:36px;height:36px}
    .nextwave{font-size:17px;padding:11px 20px}
    .hud.bc{bottom:16px}
    .catalog-card{min-width:0;width:92vw}
    .hpbar::after{background:repeating-linear-gradient(90deg,
      rgba(0,0,0,0) 0 14px, rgba(0,0,0,.55) 14px 16px)}
    button{padding:11px 12px}
  }
</style>
</head>
<body>

<div id="stage" role="application" aria-label="Rotatable hex-tiled sphere. Use arrow keys to orbit the camera." tabindex="0"></div>

<div class="hud tl">
  <div class="title">WORLD</div>
</div>

<div class="hud tr">
  <div class="menu">
    <button id="menuBtn" aria-expanded="false" aria-controls="menuPanel">Menu ▾</button>
    <div class="menu-panel" id="menuPanel">
      <button id="randBtn">New world</button>
      <button id="gridBtn">Grid: 362</button>
      <button id="catalogBtn">Catalog</button>
      <span class="count" id="count"></span>
    </div>
  </div>
</div>

<div class="hud bl">
  <div class="hint gone" id="hint"></div>
  <div class="bar">
    <button id="viewBtn">Surface view</button>
  </div>
</div>

<!-- the shop: one image button per buildable, cost beside the picture -->
<div class="hud buildbar">
  <!-- the wallet lives over the shop: what you can afford, where you spend it -->
  <div class="stat gold">gold<b id="goldVal">25</b></div>
  <button id="buildBtn" class="buy" title="Railgun turret"><img id="img-turret" alt="Railgun turret"><span class="cost">5</span></button>
  <button id="jetBtn" class="buy" title="Fighter"><img id="img-jet" alt="Fighter"><span class="cost">10</span></button>
  <button id="cannonBtn" class="buy locked" title="Sea cannon"><img id="img-cannon" alt="Sea cannon"><span class="cost">12</span></button>
  <button id="batteryBtn" class="buy" title="Missile battery"><img id="img-battery" alt="Missile battery"><span class="cost">18</span></button>
  <button id="recoveryBtn" class="buy locked" title="Recovery team"><img id="img-recovery" alt="Recovery team"><span class="cost">15</span></button>
  <button id="satBtn" class="buy locked" title="Recon satellite"><img id="img-sat" alt="Recon satellite"><span class="cost">8</span></button>
</div>

<div class="hud bc">
  <button id="waveBtn" class="nextwave">Next Wave</button>
</div>

<div class="modal open" id="startModal">
  <div class="modal-card">
    <div class="start-title">Hex Defense</div>
    <div class="start-sub">Choose a world</div>
    <div class="sizes">
      <button data-freq="0" aria-pressed="false">Small<span class="n">92 tiles</span></button>
      <button data-freq="1" aria-pressed="true">Medium<span class="n">362 tiles</span></button>
      <button data-freq="2" aria-pressed="false">Large<span class="n">812 tiles</span></button>
    </div>
    <button id="startBtn">Start</button>
  </div>
</div>

<div class="modal" id="waveModal">
  <div class="modal-card wave-card">
    <div class="wc-line wc-title" id="wcTitle">Wave 1 Cleared!</div>
    <div class="wc-line wc-stat pay">Payout: <b id="wcPay">0</b></div>
    <div class="wc-line wc-stat" id="wcLandedLine">Invaders Landed: <b id="wcLanded">0</b></div>
    <div class="wc-line wc-stat" id="wcNextLine">Next Wave: <b id="wcNext"></b></div>
    <div class="wc-line modal-warn" id="modalWarn">⚠ An additional mothership approaches!</div>
    <div class="wc-line wc-new" id="wcNew">
      <div class="wc-new-h">New Enemy Unit:</div>
      <div class="wc-new-d" id="wcNewDesc"></div>
    </div>
    <button class="wc-line wc-continue" id="modalBtn">Continue</button>
    <label class="check wc-line"><input type="checkbox" id="autoBox">Check to auto-continue</label>
  </div>
</div>

<!-- the loss card: the run's obituary, and the way back in -->
<div class="modal" id="lossModal">
  <div class="modal-card wave-card">
    <div class="wc-line on wc-title" style="color:#ff5f56">Planet Lost</div>
    <div class="wc-line on wc-stat">Waves Survived: <b id="lossWaves">0</b></div>
    <div class="wc-line on wc-stat">Gold Spent: <b id="lossSpent">0</b></div>
    <button class="wc-line on wc-continue" id="lossBtn">New Game</button>
  </div>
</div>

<div class="unitcard" id="unitCard">
  <div class="unit-name" id="unitName">Turret</div>
  <div class="unit-row" id="unitDmgRow"><span id="unitDmgLabel">damage</span><b id="unitDmg"></b></div>
  <div class="unit-row" id="unitRateRow"><span>attack speed</span><b id="unitRate"></b></div>
  <div class="unit-row"><span>level</span><b id="unitLvl"></b></div>
  <button id="unitUpgBtn">Upgrade</button>
</div>

<div class="modal" id="catalogModal">
  <div class="modal-card catalog-card">
    <div class="catalog-title">Catalog</div>
    <div class="catalog-list" id="catalogList"></div>
    <button id="catalogClose">Close</button>
  </div>
</div>

<div class="hud tc">
  <div class="hplabel" id="hpVal">planet defense 100</div>
  <div class="hpbar">
    <div class="hpfill" id="hpFill" style="width:100%"></div>
    <div class="breach" id="breachFlash">Breach!</div>
  </div>
  <div class="stats">
    <span class="stat">wave<b id="waveVal">0</b></span>
    <span class="stat">next<b id="nextVal">20s</b></span>
  </div>
  <div class="alert quiet" id="alert"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const stage = document.getElementById('stage');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 200);

  const RADIUS = 1.0;
  // Tiles meet edge to edge. The dual cells tile the sphere exactly, so
  // neighbouring tiles share corner vertices and the ground is watertight:
  // no gap for anything to show through, and nothing floating above anything.
  const TILE_INSET = 1.0;
  const TILE_BORDER = 0.13;          // the grid line is painted, not a gap

  // Everything that is part of the globe lives in this group. In surface view
  // the camera is bolted down and THIS is what turns, so the ball spins about
  // its own centre instead of the camera swinging around it. Lights are left
  // on the scene so the lighting stays put while the terrain moves under it.
  const world = new THREE.Group();
  scene.add(world);

  // A backstop only, never meant to be seen. It has to clear the deepest thing
  // in the world, which is now the point at the bottom of a deep water tile.
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS * 0.90, 96, 64),
    new THREE.MeshStandardMaterial({ color: 0x1d2a1c, metalness: 0.1, roughness: 0.9 })
  );
  world.add(shell);

  scene.add(new THREE.HemisphereLight(0x8fb6ff, 0x1a1208, 0.55));
  const key = new THREE.DirectionalLight(0xfff0dd, 1.5); key.position.set(4, 6, 5);
  const fill = new THREE.DirectionalLight(0x6fa8ff, 0.7); fill.position.set(-5, -2, -3);
  const rim = new THREE.DirectionalLight(0xffb454, 0.9); rim.position.set(0, -5, 4);
  scene.add(key, fill, rim);

  // =====================================================================
  //  Goldberg polyhedron: subdivide an icosahedron, project it onto the
  //  sphere, then take its dual. Every original vertex becomes one tile.
  //  Twelve of them are pentagons no matter the frequency; that is a
  //  property of the sphere, not a bug in the tiling.
  // =====================================================================
  function buildTiles(freq, radius) {
    const t = (1 + Math.sqrt(5)) / 2;
    const base = [
      [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
      [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
      [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]
    ];
    const baseFaces = [
      [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
      [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
      [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
      [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
    ];

    const verts = [];           // unit vectors
    const lookup = new Map();
    function addVert(x, y, z) {
      const l = Math.hypot(x, y, z);
      x /= l; y /= l; z /= l;
      const k = Math.round(x * 1e6) + ',' + Math.round(y * 1e6) + ',' + Math.round(z * 1e6);
      let i = lookup.get(k);
      if (i === undefined) {
        i = verts.length;
        verts.push(new THREE.Vector3(x, y, z));
        lookup.set(k, i);
      }
      return i;
    }

    const tris = [];
    for (const f of baseFaces) {
      const A = base[f[0]], B = base[f[1]], C = base[f[2]];
      const rows = [];
      for (let i = 0; i <= freq; i++) {
        const row = [];
        for (let j = 0; j <= freq - i; j++) {
          const a = (freq - i - j) / freq, b = i / freq, c = j / freq;
          row.push(addVert(A[0] * a + B[0] * b + C[0] * c,
                           A[1] * a + B[1] * b + C[1] * c,
                           A[2] * a + B[2] * b + C[2] * c));
        }
        rows.push(row);
      }
      for (let i = 0; i < freq; i++) {
        for (let j = 0; j < freq - i; j++) {
          tris.push([rows[i][j], rows[i + 1][j], rows[i][j + 1]]);
          if (j < freq - i - 1) tris.push([rows[i + 1][j], rows[i + 1][j + 1], rows[i][j + 1]]);
        }
      }
    }

    // face centroids become the tile corners
    const cent = tris.map(tr => {
      const v = new THREE.Vector3()
        .add(verts[tr[0]]).add(verts[tr[1]]).add(verts[tr[2]]).normalize();
      return v;
    });

    const around = verts.map(() => []);
    tris.forEach((tr, fi) => { around[tr[0]].push(fi); around[tr[1]].push(fi); around[tr[2]].push(fi); });

    // walk each tile's corners into angular order around its own normal
    const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), d = new THREE.Vector3();
    const cells = [];
    for (let vi = 0; vi < verts.length; vi++) {
      const n = verts[vi];
      e1.set(0, 0, 1);
      if (Math.abs(n.z) > 0.9) e1.set(1, 0, 0);
      e1.addScaledVector(n, -e1.dot(n)).normalize();
      e2.crossVectors(n, e1);
      const ring = around[vi].map(fi => {
        d.copy(cent[fi]).addScaledVector(n, -cent[fi].dot(n));
        return { fi, a: Math.atan2(d.dot(e2), d.dot(e1)) };
      }).sort((p, q) => p.a - q.a).map(p => cent[p.fi]);
      cells.push({ center: n.clone(), ring });
    }

    // ---- per-cell metrics only. The geometry is built separately, because
    //      every tile IS a terrain tile and its shape depends on its type.
    const inradius = [];
    const tmp = new THREE.Vector3();

    cells.forEach(cell => {
      const ctr = tmp.copy(cell.center).multiplyScalar(radius).clone();
      const corners = cell.ring.map(r => {
        const p = r.clone().multiplyScalar(radius);
        return p.lerp(ctr, 1 - TILE_INSET).setLength(radius);
      });
      const e = corners[0].clone().sub(ctr).cross(corners[1].clone().sub(ctr));
      if (e.dot(ctr) < 0) cell.ring.reverse();      // wind every cell outward once, here

      let inr = Infinity;
      for (let i = 0; i < corners.length; i++) {
        const a = corners[i], b = corners[(i + 1) % corners.length];
        const m = Math.hypot((a.x + b.x) / 2 - ctr.x, (a.y + b.y) / 2 - ctr.y, (a.z + b.z) / 2 - ctr.z);
        if (m < inr) inr = m;
      }
      inradius.push(inr);
    });

    // Which tiles touch which. Every corner of the dual is shared by exactly
    // three cells, and any two of those three share an edge, so cells that meet
    // at a corner are neighbours. The ring entries are the same Vector3 objects
    // across cells, so this is identity lookup, no float comparison needed.
    const atCorner = new Map();
    cells.forEach((cell, ci) => cell.ring.forEach(p => {
      let list = atCorner.get(p);
      if (!list) { list = []; atCorner.set(p, list); }
      list.push(ci);
    }));
    const neighbours = cells.map(() => new Set());
    atCorner.forEach(list => {
      for (const a of list) for (const b of list) if (a !== b) neighbours[a].add(b);
    });

    const meanInr = inradius.reduce((a, b) => a + b, 0) / inradius.length;

    return { cells, inradius, atCorner, meanInr,
             neighbours: neighbours.map(s => [...s]) };
  }

  // ---------- tile state ----------
  const FREQS = [3, 6, 9];
  let freqIdx = 1;
  let tiles = null, tileMesh = null;
  let cellType = null;               // one terrain id per cell; this IS the grid
  let cellGeo = null;                // that cell's generated triangles, cached

  let coast = null;                  // water tile touching land
  // Beaches live ONLY inside water tiles, so water can never wash into a land
  // tile. Inside a coast tile the beach is a contour: 1 at any corner that
  // touches land, 0 at the tile centre, cut at BEACH_LEVEL. Corners are shared
  // between tiles, so two neighbouring coast tiles cut their shared edge at the
  // identical point and their beaches join into one continuous strip.
  let cornerLand = null;             // Map: corner point -> 1 if land touches it
  const BEACH_LEVEL = 0.55;
  let WATER_DROP = 0;                // how far the water sits below the land
  let cellSig = null;                // what each cached tile was generated for
  // Generating a tile is the expensive part, so each cell's triangles are
  // cached and only the tile you actually tapped is regenerated. Rebuilding is
  // then a straight typed-array copy.
  function regenCell(ci) {
    const t = terrainArrays(ci, cellType[ci]);
    cellGeo[ci] = { pos: new Float32Array(t.pos), col: new Float32Array(t.col) };
  }

  // Water splits itself: a lake tile with any non-water neighbour is coast,
  // otherwise it is deep. Painting one tile can therefore change how its
  // neighbours look, so this reclassifies everything and regenerates only the
  // tiles whose (terrain, water class) actually changed.
  function refreshWater() {
    const N = cellType.length;
    for (let ci = 0; ci < N; ci++) {
      if (cellType[ci] !== 'lake') { coast[ci] = false; continue; }
      let touchesLand = false;
      for (const nb of tiles.neighbours[ci]) {
        if (cellType[nb] !== 'lake') { touchesLand = true; break; }
      }
      coast[ci] = touchesLand;
    }
    // A corner counts as land if ANY of the three cells meeting there is land.
    // Every corner of a land tile therefore reads 1, so land tiles are never
    // cut and the water stays inside the water tiles.
    cornerLand.clear();
    tiles.atCorner.forEach((list, p) => {
      let land = 0;
      for (const ci of list) if (cellType[ci] !== 'lake') { land = 1; break; }
      cornerLand.set(p, land);
    });
    WATER_DROP = 0.30 * tiles.meanInr;   // one depth for the whole grid, so
                                         // neighbours always agree on a corner
    for (let ci = 0; ci < N; ci++) {
      // A tile depends on its terrain and on which of its corners touch land.
      let sig = cellType[ci] + (cellType[ci] === 'lake' ? (coast[ci] ? ':c' : ':d') : '');
      for (const p of tiles.cells[ci].ring) sig += cornerLand.get(p);
      if (sig !== cellSig[ci]) { cellSig[ci] = sig; regenCell(ci); }
    }
  }

  // Merge every cell into one mesh, so the whole globe is one draw call
  // however much of it is painted.
  const cellFaceStart = [];          // first triangle index of each cell in the merged mesh

  function rebuildTerrain() {
    const N = cellGeo.length;
    let total = 0;
    for (let ci = 0; ci < N; ci++) total += cellGeo[ci].pos.length;

    const position = new Float32Array(total);
    const colour = new Float32Array(total);

    let o = 0;
    cellFaceStart.length = N;
    for (let ci = 0; ci < N; ci++) {
      const g = cellGeo[ci];
      cellFaceStart[ci] = o / 9;     // 9 floats per triangle
      position.set(g.pos, o);
      colour.set(g.col, o);
      o += g.pos.length;
    }

    if (tileMesh) { world.remove(tileMesh); tileMesh.geometry.dispose(); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(position, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colour, 3));
    geo.computeVertexNormals();
    tileMesh = new THREE.Mesh(geo, terrainMat);
    world.add(tileMesh);

    updateCount();
  }

  function makeGrid() {
    tiles = buildTiles(FREQS[freqIdx], RADIUS);
    const N = tiles.cells.length;
    cellType = new Array(N).fill('plain');
    cellDead = new Uint8Array(N);
    cellDeadWave = new Int32Array(N).fill(-1);
    deadTris.clear();
    rebuildDeadMesh();
    cellGeo = new Array(N);
    coast = new Array(N).fill(false);
    cornerLand = new Map();
    cellSig = new Array(N).fill(null);
    fitCache.clear();
    refreshWater();
    rebuildTerrain();

    document.getElementById('gridBtn').textContent = 'Grid: ' + tiles.cells.length;
  }

  // =====================================================================
  //  Terrain tiles.
  //
  //  Every tile in the grid IS one of these, 'plain' included, built from
  //  that cell's OWN polygon, which is why pentagons and the stretched
  //  hexagons come out right.
  //
  //  The rule that keeps the world looking like one sphere: a tile's OUTER
  //  EDGE always sits exactly on radius R, same as every other tile. Terrain
  //  grows out of the face or sinks into it, but the face is never lifted off
  //  the ball, so tiles meet flush instead of shingling like scales.
  //
  //  Sizes are multiples of the cell's inscribed radius, so a mountain looks
  //  the same at 92 tiles as at 812 rather than becoming a spike or a bump.
  // =====================================================================
  const terrainMat = new THREE.MeshStandardMaterial({
    vertexColors: true, metalness: 0.15, roughness: 0.7, flatShading: true
  });

  // Height is a pure function of the landness field, and the field lives on
  // corners that neighbouring tiles share. So two tiles meeting at a corner
  // always place that corner at the same radius, and the ground stays
  // watertight even though the shore cuts across tiles at any angle.
  // Corner height depends only on whether land touches that corner, which is a
  // property of the corner and not of the tile asking, so every tile that meets
  // there places it at exactly the same radius.
  function cornerHeight(p) { return cornerLand.get(p) ? 0 : -WATER_DROP; }

  function terrainArrays(ci, kind) {
    const cell = tiles.cells[ci];
    const inr = tiles.inradius[ci];

    const n = cell.center.clone().normalize();
    const ctr = n.clone().multiplyScalar(RADIUS);

    const pos = [], col = [];

    function lift(p, h) { return p.clone().setLength(RADIUS + h); }
    function tri(a, b, c, ca, cb, cc) {
      pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
      col.push(ca[0], ca[1], ca[2], cb[0], cb[1], cb[2], cc[0], cc[1], cc[2]);
    }
    function quad(a, b, c, d, cl) { tri(a, b, c, cl, cl, cl); tri(a, c, d, cl, cl, cl); }

    // The tile outline, each corner already sitting at its field height.
    const flat = cell.ring.map(r => r.clone().multiplyScalar(RADIUS));
    const vR = cell.ring.map(p => cornerLand.get(p));
    const hR = cell.ring.map(cornerHeight);
    const vC = 0;                     // the centre of a water tile is always sea
    // ...but only a water tile. Land sits flat at ground level; this was
    // pinned to the water level for every tile, which put an inverted point in
    // the middle of every hex on the globe.
    const hC = kind === 'lake' ? -WATER_DROP : 0;
    const rim = flat.map((p, i) => lift(p, hR[i]));

    function border(col, dh) {
      const inner = flat.map((p, i) => lift(p.clone().lerp(ctr, TILE_BORDER), hR[i] + (dh || 0)));
      for (let i = 0; i < rim.length; i++) {
        const j = (i + 1) % rim.length;
        quad(rim[i], rim[j], inner[j], inner[i], col);
      }
      return inner;
    }
    function ring(k, dh) {
      return flat.map((p, i) => lift(p.clone().lerp(ctr, 1 - k), hR[i] + (dh || 0)));
    }
    function band(a, b, cl) {
      for (let i = 0; i < a.length; i++) {
        const j = (i + 1) % a.length;
        quad(a[i], a[j], b[j], b[i], cl);
      }
    }
    function face(from, colEdge, colCentre, centreH) {
      const c = lift(ctr, hC + (centreH || 0));
      for (let i = 0; i < from.length; i++) {
        const j = (i + 1) % from.length;
        tri(from[i], from[j], c, colEdge, colEdge, colCentre || colEdge);
      }
    }
    // ---- clip a polygon at the waterline. Points carry their own value, and a
    //      crossing is interpolated from the two values, so any two polygons
    //      sharing an edge produce the identical crossing point.
    // Cut a polygon along the beach line. The crossing point is a straight lerp
    // of the two endpoints as they already sit in space - no re-projection - so
    // it lands exactly on the shared edge and two tiles computing it from the
    // same pair of corners get bit-identical results.
    function clip(P, V, colAbove, colBelow) {
      const up = [], dn = [];
      for (let k = 0; k < P.length; k++) {
        const k2 = (k + 1) % P.length;
        const a = V[k] >= BEACH_LEVEL, b = V[k2] >= BEACH_LEVEL;
        (a ? up : dn).push(P[k]);
        if (a !== b) {
          const t = (BEACH_LEVEL - V[k]) / (V[k2] - V[k]);
          const m = P[k].clone().lerp(P[k2], t);
          up.push(m); dn.push(m);
        }
      }
      for (let k = 1; k + 1 < up.length; k++) tri(up[0], up[k], up[k + 1], colAbove, colAbove, colAbove);
      for (let k = 1; k + 1 < dn.length; k++) tri(dn[0], dn[k], dn[k + 1], colBelow, colBelow, colBelow);
    }

    if (kind === 'lake' && coast[ci]) {
      // COAST. Beach around every corner that touches land, water in the middle.
      // Both the rim band and the fan are clipped, so the beach reaches the tile
      // edge and joins the neighbouring coast tile's beach into one strip.
      const sand = [0.749, 0.647, 0.427], sandDark = [0.463, 0.396, 0.259];
      const sea  = [0.161, 0.510, 0.588], seaDark  = [0.098, 0.318, 0.400];

      const inner = flat.map((p, i) => lift(p.clone().lerp(ctr, TILE_BORDER), hR[i]));
      for (let i = 0; i < rim.length; i++) {
        const j = (i + 1) % rim.length;
        clip([rim[i], rim[j], inner[j], inner[i]],
             [vR[i], vR[j], vR[j], vR[i]], sandDark, seaDark);
      }
      const c0 = lift(ctr, hC);
      for (let i = 0; i < inner.length; i++) {
        const j = (i + 1) % inner.length;
        clip([c0, inner[i], inner[j]], [vC, vR[i], vR[j]], sand, sea);
      }

    } else if (kind === 'plain') {
      const w = Math.sin(ci * 12.9898) * 43758.5453;
      const j = 0.93 + (w - Math.floor(w)) * 0.14;
      const grass = [0.342 * j, 0.624 * j, 0.195 * j];
      face(border([grass[0] * 0.50, grass[1] * 0.50, grass[2] * 0.50]), grass);

    } else if (kind === 'swamp') {
      // much darker than forest, and dead flat like the rest of the land
      face(border([0.020, 0.045, 0.028]), [0.047, 0.106, 0.063], [0.056, 0.126, 0.072]);

    } else if (kind === 'forest') {
      face(border([0.062, 0.132, 0.070]), [0.129, 0.271, 0.145], [0.153, 0.310, 0.165]);

    } else if (kind === 'mountain') {
      const rock = [0.132, 0.128, 0.118], scree = [0.096, 0.094, 0.088];
      face(border([0.058, 0.057, 0.055]), scree, rock);

    } else if (kind === 'lake') {
      // DEEP water: the mirror of the desert tile. Desert fans up to a shallow
      // point at its centre; this fans down to one. Its rim already sits low,
      // because the field puts it there.
      const lip = ring(1 - TILE_BORDER, -0.06 * inr);
      band(border([0.118, 0.126, 0.145]), lip, [0.086, 0.094, 0.114]);
      face(lip, [0.055, 0.180, 0.353], [0.016, 0.063, 0.169], -0.16 * inr);

    } else {   // desert
      const sand = [0.796, 0.659, 0.404], pale = [0.882, 0.776, 0.541];
      face(border([0.418, 0.342, 0.202]), sand, pale);   // flat, like the rest
    }

    return { pos, col };
  }

  // =====================================================================
  //  Randomise the whole globe.
  //
  //  Pure per-tile randomness looks like TV static, so this lays down two
  //  smooth fields over the sphere - elevation and moisture - and reads the
  //  terrain out of them, which gives continent-shaped runs of forest and
  //  desert instead of confetti. Thresholds are percentiles of the actual
  //  values, so every world gets a full mix rather than occasionally coming
  //  out with no mountains at all.
  // =====================================================================
  function noiseField(octaves) {
    const w = [];
    for (let i = 0; i < octaves; i++) {
      let x = Math.random() * 2 - 1, y = Math.random() * 2 - 1, z = Math.random() * 2 - 1;
      const l = Math.hypot(x, y, z) || 1, f = 1.6 + i * 1.9;   // coarse first, then detail
      w.push({ x: x / l * f, y: y / l * f, z: z / l * f,
               p: Math.random() * 6.283, a: 1 / (1 + i * 0.8) });
    }
    const norm = w.reduce((t, o) => t + o.a, 0);
    return p => w.reduce((t, o) =>
      t + o.a * Math.sin(p.x * o.x + p.y * o.y + p.z * o.z + o.p), 0) / norm;
  }

  function percentile(arr, q) {
    const s = arr.slice().sort((a, b) => a - b);
    return s[Math.min(s.length - 1, Math.max(0, Math.floor(q * s.length)))];
  }

  function randomise() {
    const N = tiles.cells.length;
    const elev = noiseField(5), moist = noiseField(4);
    const e = new Array(N), m = new Array(N);
    for (let ci = 0; ci < N; ci++) { e[ci] = elev(tiles.cells[ci].center); m[ci] = moist(tiles.cells[ci].center); }

    const hi = percentile(e, 0.88), lo = percentile(e, 0.18);
    const mid = [];
    for (let ci = 0; ci < N; ci++) if (e[ci] <= hi && e[ci] >= lo) mid.push(m[ci]);
    const wet = percentile(mid, 0.68), dry = percentile(mid, 0.26);

    for (let ci = 0; ci < N; ci++) {
      let k;
      if (e[ci] > hi) k = 'mountain';
      else if (e[ci] < lo) k = 'lake';
      else if (m[ci] > wet) k = 'forest';
      else if (m[ci] < dry) k = 'desert';
      else k = 'plain';
      cellType[ci] = k;
    }
    capMountains(e, m, wet, dry);
    growSwamps();
    refreshWater();
    rebuildTerrain();
    if (G.ready) resetGame();        // the old defences do not survive a new world
  }

  // Swamp forms where forest meets the sea. Any water tile touching land is a
  // coast tile by definition, so a forest with a water neighbour is exactly a
  // forest touching a coast, and half of those turn to swamp.
  const SWAMP_CHANCE = 0.5;

  function growSwamps() {
    const N = cellType.length;
    const next = cellType.slice();          // decide from the original map, so
    for (let ci = 0; ci < N; ci++) {        // one swamp cannot seed the next
      if (cellType[ci] !== 'forest') continue;
      if (!tiles.neighbours[ci].some(nb => cellType[nb] === 'lake')) continue;
      if (Math.random() < SWAMP_CHANCE) next[ci] = 'swamp';
    }
    for (let ci = 0; ci < N; ci++) cellType[ci] = next[ci];
  }

  const MAX_MASSIF = 5;

  // The noise happily produces mountain blobs a third of a continent wide. This
  // walks each connected run of mountains and carves it into massifs of at most
  // MAX_MASSIF tiles, each separated from the next by at least one tile of
  // ordinary ground, so a range reads as a chain of peaks instead of a plateau.
  function capMountains(e, m, wet, dry) {
    const N = cellType.length;
    const demote = ci => {
      cellType[ci] = m[ci] > wet ? 'forest' : m[ci] < dry ? 'desert' : 'plain';
    };

    const seen = new Uint8Array(N);
    for (let start = 0; start < N; start++) {
      if (cellType[start] !== 'mountain' || seen[start]) continue;

      // the whole connected run of mountains this tile belongs to
      const comp = [start];
      seen[start] = 1;
      for (let i = 0; i < comp.length; i++) {
        for (const nb of tiles.neighbours[comp[i]]) {
          if (!seen[nb] && cellType[nb] === 'mountain') { seen[nb] = 1; comp.push(nb); }
        }
      }
      if (comp.length <= MAX_MASSIF) continue;

      // carve it up, always starting from the highest ground left
      const left = new Set(comp);
      while (left.size) {
        let peak = -1;
        for (const ci of left) if (peak < 0 || e[ci] > e[peak]) peak = ci;

        const blob = [peak];
        left.delete(peak);
        for (let i = 0; i < blob.length && blob.length < MAX_MASSIF; i++) {
          for (const nb of tiles.neighbours[blob[i]]) {
            if (blob.length >= MAX_MASSIF) break;
            if (left.has(nb)) { left.delete(nb); blob.push(nb); }
          }
        }

        // anything still touching this massif becomes the gap around it
        const gap = [];
        for (const ci of blob) {
          for (const nb of tiles.neighbours[ci]) if (left.has(nb)) gap.push(nb);
        }
        for (const ci of gap) { left.delete(ci); demote(ci); }
      }
    }
  }

  // =====================================================================
  //  GAME LAYER
  //
  //  The aliens never reach the ground on purpose. They descend toward a
  //  target tile from orbit and the turrets have a window to kill them on
  //  the way down. Anything that touches the surface costs planetary
  //  planet defense, which is the only life total in the game.
  //
  //  A turret's reach is expressed in TILE RINGS, not metres. It can engage
  //  anything falling toward a tile within N rings of its own tile, once
  //  that thing drops below its ceiling. Coverage is therefore a set of
  //  tiles you can highlight and count, rather than an invisible cone.
  // =====================================================================
  const G = {
    hp: 100, hpMax: 100, gold: 25, wave: 0,
    inWave: false, breakLeft: 20, spawnTimer: 0, queue: [],
    ready: false, over: false, started: false, paused: false,
    build: null, bearing: null, nextComp: null,
    shipDist: 1.55, landed: 0, spent: 0, ships: [],
    newShip: null,                 // a just-arrived mothership's bearing, for the camera
    // tools that unlock when the situation first demands them
    unlocked: { cannon: false, recovery: false, sat: false }
  };

  // Every number that decides whether the game is fair lives here and nowhere
  // else, so it can be swept from a test harness instead of guessed at.
  const BAL = {
    turretCost: 5,
    range: 4, ceiling: 0.95, rate: 0.60, dmg: 11,
    rockRange: 1, rockCeiling: 0.25,          // what a mountain tile adds
    cannonCost: 12,
    cannonRange: 1,                         // extra rings over a land turret
    cannonCeiling: 0.35,
    cannonRate: 0.85, cannonDmg: 20,        // slower, heavier
    // the first five waves run at half strength, so the opening is about
    // learning the ground rather than surviving the full flood
    alienN:     w => w <= 5 ? (10 + w * 6) / 2 : 10 + w * 6,
    rampWaves:  22,                         // waves to reach the widest launch
    zoneMax:    1.45,                       // ~83 degrees, most of a hemisphere
    zoneRings:  2,                          // hex rings a freshly claimed zone covers
    zoneGrow:   0.055,                      // radians its radius adds per wave aboard
    shipNear:   3.10,                       // mothership distance, sphere radii
    shipFar:    6.60,
    motherSize: 0.20,                       // length in sphere radii
    shipEvery:  5,                          // waves between each extra mothership
    shipSepMin: 0.85,                       // radians apart they try to stay
    converge:   0.60,                       // fraction of the fall spent turning
    flameGap:   0.035,                      // seconds between exhaust puffs
    flameLife:  0.30,                       // how long one puff lasts
    // wave-1 stats are double the game's original tuning; hull and descent
    // speed then compound 10% per wave, so the late game outgrows a static
    // defense (landing damage stays a flat share - see the roster below)
    waveRamp:   w => Math.pow(1.10, w - 1),
    alienHp:    w => 46 * BAL.waveRamp(w),
    alienSpeed: w => 0.148 * BAL.waveRamp(w),  // sphere radii per second
    spawnGap:   0.55,
    income:     w => 5 * w,                 // five per wave cleared
    // a landing costs a flat share of the planet's defense, whatever the
    // wave: the roster's dmg field IS that fraction. Reclaiming a hex
    // hands a share back.
    recoverHeal: 0.05,
    // ---- enemy roster. hp/speed multiply the wave's base numbers; dmg is
    //      the FRACTION of max planet defense a landing costs; pay is the
    //      bounty for that type; size is a length in tile inradii.
    //      Waves are all vipers until the entry waves below, then the mix
    //      shifts so the late game asks different questions: hulks soak a
    //      turret's whole magazine, darts outrun its tracking window.
    // shield: fraction of max hp below which the type's energy shield
    // visual drops - a bare hulk IS the damage readout
    enemies: {
      viper: { hp: 1.0,  speed: 1.0,  dmg: 0.05, pay: 1, size: 0.53 },
      hulk:  { hp: 3.2,  speed: 0.62, dmg: 0.10, pay: 3, size: 0.80, shield: 0.5 },
      dart:  { hp: 0.55, speed: 0.85, dmg: 0.05, pay: 2, size: 0.42 },
      dread: { hp: 4.0,  speed: 0.45, dmg: 0,    pay: 6, size: 1.05 }
    },
    dartFrom: 4,                            // first wave fast darts appear
    hulkFrom: 7,                            // first wave armoured hulks appear
    dreadFrom: 10,                          // first wave orbital dreadnaughts appear
    hulkFrac: w => Math.min(0.35, 0.04 + w * 0.02),   // share of the wave
    dartFrac: w => Math.min(0.30, 0.03 + w * 0.02),
    dreadFrac: w => Math.min(0.10, 0.02 + w * 0.01),
    // ---- dart combat. Darts are interceptor hunters: while a player
    //      fighter flies INSIDE the dart's own landing zone, the dart
    //      abandons its landing run to chase and shoot it, then goes in
    //      to land once its zone's sky is clear. Fighters elsewhere on
    //      the planet are ignored.
    dartHunt:  0.70,                        // radians/s a dart closes on a fighter
    dartClimb: 0.60,                        // radii/s it matches altitude
    dartReach: 4.5,                         // firing range, tile inradii (outranges a jet)
    dartRate:  0.6, dartDmg: 6,             // its gun: whittles a hull, doesn't delete it
    // ---- dreadnaught. The orbital sieger: it stops its descent at holding
    //      altitude and shells your emplacements with exactly a railgun's
    //      ring reach, so whatever it is pounding can always answer back.
    //      It never lands - the wave does not end until it is shot down.
    dreadOrbit: 0.88,                       // holding altitude, under every gun ceiling
    dreadDrift: 0.10,                       // radians/s it repositions over the surface
    dreadRate:  2.4, dreadDmg: 18,          // its bombardment gun
    // the cannon's ball is bolted flat to the hull, so the barrel only
    // trims a few degrees off vertical - the SHIP flies the firing
    // solution, and keeps creeping until its prey is nearly beneath it
    dreadTilt:  0.30,                       // max barrel tilt off vertical, radians
    dreadTrim:  0.10,                       // keeps repositioning above this aim error
    towerHp:    50,                         // what one emplacement soaks before falling
    jetHp:     60,                          // a fighter's hull
    breakTime:  20,
    summaryTime: 5,                         // seconds the wave report lingers
    startGold:  25,
    aimAtBuilt: 0.6,                        // odds a pod picks an occupied tile
    jetCost:    10,
    jetRing:    4,                          // patrol circle, in tile rings
    jetSpeed:   1.20,                       // radians of arc per second
    jetTurn:    2.2,                        // radians per second of heading change
    jetClimb:   1.00,
    jetCruise:  0.16,                       // idle altitude
    jetFloor:   0.06,                       // never dives below this
    jetCeiling: 1.05,
    jetReach:   4.0,                        // firing range, in tile inradii
    jetRate:    0.28,
    jetDmg:     15,
    jetSize:    1.5,                        // length, in tile inradii
    shellSpeed: 1.15,                       // missile flight speed; it homes
    slugSpeed:  2.3,                        // railgun slug: straight-line, no homing
    slugRange:  1.6,                        // sphere radii a slug flies before detonating;
                                            // long enough for the doubled ring reach
                                            // at full ceiling on the smallest worlds
    trailGap:   0.012,                      // distance between smoke puffs
    strayLife:  2.0,                        // seconds a shell with no target keeps going
    batteryCost: 18,
    recoveryCost: 15,                       // a team to dig one lost tile back out
    recoveryRange: 1,                       // the team's sidearms; self-defence only
    recoveryCeiling: 0.60,
    recoveryRate: 0.5, recoveryDmg: 4,
    batteryRange: 3,                        // rings; no mountain bonus
    batteryCeiling: 1.30,                   // engages higher than any turret
    // a burst attacker: five tubes, each reloading on its own clock. It
    // ripples off whatever is loaded, retargeting per launch, then the
    // empty tubes come back one by one - slower per tube than the old
    // single launcher, ferocious in a full salvo.
    batteryTubes: 5,
    batterySalvo: 0.5,                      // seconds between launches in a ripple
    batteryRate: 3.0, batteryDmg: 30,       // per-tube reload; the payload is unchanged
    // ---- cloaking, and the eye that answers it. From cloakFrom on, every
    //      ship the motherships launch is cloaked: the model is hidden and
    //      your units will not fire at what they cannot see - only the red
    //      outline betrays the approach. A recon satellite parked in orbit
    //      reveals every cloaked ship in the rings beneath it.
    cloakFrom: 15,
    satCost:   8,
    satRange:  3,                           // rings of sky one satellite uncloaks
    satAlt:    1.55,                        // stationary orbit, above every ceiling
    gunTurn:    4.2,                        // radians/s a railgun mount slews
    batteryTurn: 1.8,                       // the launcher swings heavier
    aimSettle:  0.05,                       // radians off-solution a mount may fire at
    splashRadius: 2.2,                      // burst radius, tile inradii
    splashDmg: 14,                          // dealt to everything else in it
    upgradeMax: 3,                          // levels a building can reach
    upgradeCost: (base, lvl) => Math.ceil(base * 0.6 * lvl),   // lvl being bought
    upgradeDmg: 1.5,                        // per level, anything that shoots
    upgradeCeil: 0.10,                      // per level, turret-family ceilings
    autoFace: false,                        // swing the planet to face a new drop zone
    dryWaves: 10,                           // waves that get a mostly-dry landing zone
    dryMax:   0.25                          // most water a zone may hold during them
  };


  const towers = [];
  const towerAt = new Map();     // cell index -> turret
  const aliens = [];
  const LOCAL_UP = new THREE.Vector3(0, 1, 0);

  // ---- which tiles a turret defends. Straight breadth-first walk over the
  //      adjacency the grid already computed, so it is correct across the
  //      twelve pentagons without a special case.
  function ringSet(ci, r) {
    const seen = new Set([ci]);
    let front = [ci];
    for (let d = 0; d < r; d++) {
      const next = [];
      for (const c of front) for (const nb of tiles.neighbours[c]) {
        if (!seen.has(nb)) { seen.add(nb); next.push(nb); }
      }
      front = next;
    }
    return seen;
  }

  // =====================================================================
  //  Turret models
  //
  //  Two GLBs, fetched alongside the other models at startup.
  //  Both are stripped down hard from the source exports: 43 MB and 776k
  //  triangles between them originally, which is not a thing you can ship
  //  to a browser. Geometry is decimated to about 2%, normal and roughness
  //  maps are dropped for uniform material values, textures are 512px.
  //  Pivots are baked in: the pad's underside sits at y=0, and the gun
  //  rotates about its own ball centre so aiming is one quaternion.
  // =====================================================================
  const PAD_R = 1.104;        // pad's widest radius, in model units
  const PAD_H = 1.109;
  const GUN_SEAT = 0.66;      // where the ball centre rides above the pad
  const GUN_TIP = 1.459;      // mast tip, measured from the ball centre
  const MAX_TURRETS = 1024;  // instance capacity; covers every tile of the largest (812) world

  function parseGLB(buffer) {
    const u8 = new Uint8Array(buffer);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

    let json = null, buf = null, off = 12;
    while (off < u8.length) {
      const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true);
      const at = off + 8;
      if (type === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(u8.subarray(at, at + len)));
      else if (type === 0x004E4942) buf = u8.subarray(at, at + len);
      off = at + len;
    }

    // Read what the accessor declares rather than assuming float32/uint16:
    // a model with uint32 indices or quantised attributes would otherwise be
    // reinterpreted with the wrong type and come out as silent garbage.
    const COMP_ARRAYS = {
      5120: Int8Array, 5121: Uint8Array, 5122: Int16Array,
      5123: Uint16Array, 5125: Uint32Array, 5126: Float32Array
    };
    const COMP_COUNT = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 };

    function accessorAttr(accIdx) {
      const a = json.accessors[accIdx];
      const bv = json.bufferViews[a.bufferView];
      const Type = COMP_ARRAYS[a.componentType];
      const comps = COMP_COUNT[a.type];
      if (!Type || !comps) {
        throw new Error('unsupported accessor: componentType ' + a.componentType + ', type ' + a.type);
      }
      const base = buf.byteOffset + (bv.byteOffset || 0) + (a.byteOffset || 0);
      const tight = comps * Type.BYTES_PER_ELEMENT;
      let arr;
      if (!bv.byteStride || bv.byteStride === tight) {
        arr = new Type(buf.buffer, base, a.count * comps);
      } else {
        // interleaved view: copy each element out into a tight array
        arr = new Type(a.count * comps);
        for (let i = 0; i < a.count; i++) {
          arr.set(new Type(buf.buffer, base + i * bv.byteStride, comps), i * comps);
        }
      }
      return new THREE.BufferAttribute(arr, comps, !!a.normalized);
    }

    if (json.meshes.length > 1 || json.meshes[0].primitives.length > 1) {
      console.warn('GLB carries multiple meshes/primitives; only the first is rendered');
    }
    const prim = json.meshes[0].primitives[0];

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', accessorAttr(prim.attributes.POSITION));
    if (prim.attributes.TEXCOORD_0 !== undefined) geo.setAttribute('uv', accessorAttr(prim.attributes.TEXCOORD_0));
    if (prim.indices !== undefined) geo.setIndex(accessorAttr(prim.indices));
    if (prim.attributes.NORMAL !== undefined) geo.setAttribute('normal', accessorAttr(prim.attributes.NORMAL));
    else geo.computeVertexNormals();

    // Data URI, not a blob URL. ImageLoader sets crossOrigin on a blob URL,
    // and from file:// the page origin is opaque, so that load fails CORS and
    // three binds its 1x1 empty texture instead: the model comes out black.
    // A data: URI is same-origin by definition and the loader skips the header.
    function bytesToB64(bytes) {
      let s = '';
      const CH = 0x8000;                       // chunked, or fromCharCode blows the stack
      for (let i = 0; i < bytes.length; i += CH) {
        s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CH, bytes.length)));
      }
      return btoa(s);
    }

    function texture(texIdx, onFail) {
      try {
        const texDef = json.textures[texIdx];
        // WebP-encoded textures park their image index inside the
        // EXT_texture_webp extension instead of texture.source
        const src = texDef.source !== undefined ? texDef.source
                  : texDef.extensions && texDef.extensions.EXT_texture_webp
                    ? texDef.extensions.EXT_texture_webp.source : undefined;
        const img = json.images[src];
        const bv = json.bufferViews[img.bufferView];
        const o = bv.byteOffset || 0;
        const uri = 'data:' + img.mimeType + ';base64,' +
                    bytesToB64(buf.subarray(o, o + bv.byteLength));
        const t = new THREE.TextureLoader().load(uri, undefined, undefined, onFail);
        t.flipY = false;                       // glTF UV convention
        t.encoding = THREE.sRGBEncoding;
        t.anisotropy = 4;
        return t;
      } catch (e) { if (onFail) onFail(e); return null; }
    }

    // the primitive's own material, if it names one; a bare mesh gets defaults
    const m = (json.materials && json.materials[prim.material !== undefined ? prim.material : 0]) || {};
    const pbr = m.pbrMetallicRoughness || {};
    // Low metalness on purpose. There is no environment map in this scene, and
    // a metallic surface with nothing to reflect renders nearly black no matter
    // how many lights you point at it.
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      metalness: 0.18,
      roughness: 0.55
    });
    if (pbr.baseColorTexture) {
      // if the image ever fails, fall back to a visible grey rather than black
      mat.map = texture(pbr.baseColorTexture.index, () => {
        mat.map = null; mat.color.setHex(0xa8b4c6); mat.needsUpdate = true;
      });
    }
    if (m.emissiveTexture) {
      // a bright emissive with no map would glow the whole mesh white, so
      // the colour is only set once the map actually exists, and a failed
      // load resets it
      const em = texture(m.emissiveTexture.index, () => {
        mat.emissiveMap = null; mat.emissive.setHex(0x000000); mat.needsUpdate = true;
      });
      if (em) {
        mat.emissiveMap = em;
        mat.emissive = new THREE.Color(0.9, 0.9, 0.9);
      }
    }
    return { geo, mat };
  }

  let padMesh = null, gunMesh = null, modelsOK = false;

  const mPos = new THREE.Vector3(), mQuat = new THREE.Quaternion(),
        mScale = new THREE.Vector3(), mMat = new THREE.Matrix4();

  //  cell.center is the icosphere VERTEX the tile was built around, not the
  //  middle of the polygon that ends up drawn there. On a Goldberg solid the
  //  surrounding triangles are unequal, so the two differ by up to 7% of the
  //  tile's inradius, which is exactly enough to read as "slightly off". This
  //  returns the polygon's own centroid, plus the largest radius that still
  //  clears every edge FROM that point, so the pad is both centred and never
  //  overhangs into a neighbour.
  const fitCache = new Map();
  const fA = new THREE.Vector3(), fB = new THREE.Vector3(), fP = new THREE.Vector3();

  function tileFit(ci) {
    let f = fitCache.get(ci);
    if (f) return f;
    const ring = tiles.cells[ci].ring, n = ring.length;
    const mid = new THREE.Vector3();
    for (const p of ring) mid.add(p);
    mid.normalize();

    fA.set(0, 0, 1);
    if (Math.abs(mid.z) > 0.9) fA.set(1, 0, 0);
    fA.addScaledVector(mid, -fA.dot(mid)).normalize();
    fB.crossVectors(mid, fA);

    const xs = [], ys = [];
    for (const p of ring) {
      fP.copy(p).addScaledVector(mid, -p.dot(mid));   // flatten onto the tangent plane
      xs.push(fP.dot(fA)); ys.push(fP.dot(fB));
    }
    let r = Infinity;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const ex = xs[j] - xs[i], ey = ys[j] - ys[i];
      const len = Math.hypot(ex, ey) || 1;
      const d = Math.abs(ex * -ys[i] - ey * -xs[i]) / len;   // centroid to that edge
      if (d < r) r = d;
    }
    f = { up: mid, fit: r };
    fitCache.set(ci, f);
    return f;
  }

  //  Orbital fire needs something to chew through: every emplacement carries
  //  a hull the dreadnaught's shells wear down. The fields mirror an alien
  //  target (dir/alt place it in space, incoming reserves shells in flight,
  //  pay 0 because the enemy earns nothing for the kill) so the bullet code
  //  runs unchanged against it.
  function armour(tur) {
    tur.hp = BAL.towerHp; tur.incoming = 0; tur.alive = true; tur.pay = 0;
    tur.dir = tur.up; tur.alt = tur.seat.length() - RADIUS;
    return tur;
  }

  function placeTurret(ci) {
    if (towers.length >= MAX_TURRETS) return null;
    const onRock = cellType[ci] === 'mountain';
    const f = tileFit(ci);
    const up = f.up;
    const k = f.fit / PAD_R;                   // pad spans the tile edge to edge

    const tur = {
      ci, k, kind: 'turret', level: 1,
      up: up.clone(),
      seat: up.clone().multiplyScalar(RADIUS + GUN_SEAT * k),
      aimQ: new THREE.Quaternion().setFromUnitVectors(LOCAL_UP, up),
      aimDir: up.clone(),
      cover: ringSet(ci, BAL.range + (onRock ? BAL.rockRange : 0)),
      ceiling: BAL.ceiling + (onRock ? BAL.rockCeiling : 0),
      rate: BAL.rate, dmg: BAL.dmg, cool: 0,
      turn: BAL.gunTurn
    };
    tur.pos = up.clone().multiplyScalar(RADIUS + (GUN_SEAT + GUN_TIP) * k);
    armour(tur);
    towers.push(tur);
    towerAt.set(ci, tur);

    if (modelsOK) {
      mPos.copy(up).multiplyScalar(RADIUS - f.fit * 0.04);          // sunk a hair
      mQuat.setFromUnitVectors(LOCAL_UP, up);
      mScale.setScalar(k);
      tur.padMat = new THREE.Matrix4().compose(mPos, mQuat, mScale);
      rebuildEmplacements();
    }
    return tur;
  }

  function writeGun(t) {
    if (!modelsOK || !(t.gunSlot >= 0)) return;
    mScale.setScalar(t.k);
    gunMesh.setMatrixAt(t.gunSlot, mMat.compose(t.seat, t.aimQ, mScale));
  }

  function clearTurrets() {
    towers.length = 0;
    towerAt.clear();
    if (modelsOK) { padMesh.count = 0; gunMesh.count = 0; }
    if (platMesh) { platMesh.count = 0; coreMesh.count = 0; }
    if (batteryMesh) batteryMesh.count = 0;
  }

  // =====================================================================
  //  FIGHTERS
  //
  //  A turret is a gun bolted to one tile: it reaches everything in its
  //  ring but only from where it stands. A fighter owns the SAME circle
  //  and can be anywhere inside it, so it never has a bad angle, but it
  //  can only be in one place at a time and has to fly there first. That
  //  trade is the whole point of the unit: turrets buy coverage, fighters
  //  buy reach, and neither one substitutes for the other.
  // =====================================================================
  const fighters = [];
  const fighterAt = new Map();
  const JET_LEN = 1.898;
  //  The landing pad that marks a fighter's home hex: the modular road
  //  platform deck in jetpad.glb, measured at its widest footprint radius
  //  (half its long axis) so it spans the tile edge to edge.
  const JETPAD_R = 0.952;
  //  The deck reads better with air around it: the pad takes 80% of the
  //  tile instead of spanning it edge to edge.
  const JETPAD_FIT = 0.80;

  //  Deck top and jet belly clearance, both remeasured from the loaded
  //  models in buildModels so a parked jet sits ON the deck, not in it.
  let JETPAD_H = 0.16, JET_BELLY = 0.20;
  function restAlt(f) { return JETPAD_H * f.padK + JET_BELLY * f.k; }

  let jetMesh = null, jetOutlineMesh = null, jetpadMesh = null, jetpadOutline = null;

  const fA1 = new THREE.Vector3(), fA2 = new THREE.Vector3(), fWant = new THREE.Vector3(),
        fAxis = new THREE.Vector3(), fQ = new THREE.Quaternion(), fPos = new THREE.Vector3(),
        fX = new THREE.Vector3(), fY = new THREE.Vector3(), fZ = new THREE.Vector3(),
        fBasis = new THREE.Matrix4(), fRoll = new THREE.Quaternion();
  // scratch for the dreadnaught's slung cannon
  const gPos = new THREE.Vector3(), gDir = new THREE.Vector3(), gUp = new THREE.Vector3(),
        gX = new THREE.Vector3(), gZ = new THREE.Vector3(), gBasis = new THREE.Matrix4();

  function placeFighter(ci) {
    if (fighters.length >= MAX_TURRETS) return null;
    const f0 = tileFit(ci);
    const home = f0.up.clone();
    const cover = ringSet(ci, BAL.jetRing);

    // the patrol circle is measured from the cover set itself, so it stays
    // honest when the grid size changes instead of assuming a tile pitch
    let radius = 0;
    for (const c of cover) radius = Math.max(radius, home.angleTo(tiles.cells[c].center));

    // a tangent basis at home, used for the idle orbit
    const e1 = new THREE.Vector3(0, 0, 1);
    if (Math.abs(home.z) > 0.9) e1.set(1, 0, 0);
    e1.addScaledVector(home, -e1.dot(home)).normalize();
    const e2 = new THREE.Vector3().crossVectors(home, e1);

    const start = home.clone().multiplyScalar(Math.cos(radius * 0.7))
                     .addScaledVector(e1, Math.sin(radius * 0.7)).normalize();
    const head = new THREE.Vector3().crossVectors(home, start).normalize();

    const jf = {
      ci, home, cover, radius, e1, e2,
      dir: start, head,
      alt: BAL.jetCruise,
      k: tiles.meanInr * BAL.jetSize / JET_LEN,
      ceiling: BAL.jetCeiling,
      dmg: BAL.jetDmg, level: 1,
      hp: BAL.jetHp, incoming: 0, alive: true, pay: 0,   // darts hunt it
      cool: 0, bank: 0,
      // where it drew last frame and the smoothed true flight direction,
      // which is what the nose actually follows
      prevPos: start.clone().multiplyScalar(RADIUS + BAL.jetCruise),
      vel: head.clone(),
      emit: Math.random() * 0.03, phase: Math.random() * Math.PI * 2
    };
    // the pad that claims the hex, laid flat on the tile like a turret's
    jf.padK = f0.fit * JETPAD_FIT / JETPAD_R;
    mPos.copy(home).multiplyScalar(RADIUS - f0.fit * 0.04);
    mQuat.setFromUnitVectors(LOCAL_UP, home);
    mScale.setScalar(jf.padK);
    jf.padMat = new THREE.Matrix4().compose(mPos, mQuat, mScale);
    // flying if built mid-wave; built in a break, it starts ON its pad
    jf.state = 'flying';
    if (!G.inWave) {
      jf.state = 'landed';
      jf.dir = home.clone();
      jf.alt = restAlt(jf);
      jf.prevPos.copy(jf.dir).multiplyScalar(RADIUS + jf.alt);
    }
    fighters.push(jf);
    fighterAt.set(ci, jf);
    if (jetMesh) jetMesh.count = fighters.length;
    return jf;
  }

  function clearFighters() {
    fighters.length = 0;
    fighterAt.clear();
    if (jetMesh) jetMesh.count = 0;
    if (jetOutlineMesh) jetOutlineMesh.count = 0;
    if (jetpadMesh) { jetpadMesh.count = 0; jetpadOutline.count = 0; }
  }

  // =====================================================================
  //  RECON SATELLITE
  //
  //  The answer to cloaking. It parks in stationary orbit over its hex,
  //  higher than anything can shoot, and reveals every cloaked ship in
  //  the rings beneath it so the guns below can do their work. No weapons
  //  of its own: it is a purchase of information, not firepower.
  // =====================================================================
  const satellites = [];
  const satAt = new Map();
  const SAT_LEN = 1.9;         // sentinel's widest extent, model units
  //  The ground station that claims the hex beneath the orbiting bird.
  //  Placeholder drum until satpad.glb lands in public/assets; measure its
  //  widest footprint radius into SATPAD_R then.
  const SATPAD_R = 1.0;
  const SATPAD_FIT = 0.70;     // fraction of the tile the station covers
  let satMesh = null, satOutline = null, satpadMesh = null, satpadOutline = null;
  const sQ = new THREE.Quaternion();

  function placeSat(ci) {
    if (satellites.length >= MAX_TURRETS) return null;
    const f = tileFit(ci);
    const home = f.up.clone();
    const cover = ringSet(ci, BAL.satRange);
    // the detection dome, measured from the cover set like a patrol circle
    let radius = 0;
    for (const c of cover) radius = Math.max(radius, home.angleTo(tiles.cells[c].center));
    const s = { ci, home, radius, level: 1,
                k: tiles.meanInr * 0.9 / SAT_LEN,
                spin: Math.random() * Math.PI * 2 };
    // the ground station that marks the claimed hex, flat on the tile
    mPos.copy(home).multiplyScalar(RADIUS - f.fit * 0.04);
    mQuat.setFromUnitVectors(LOCAL_UP, home);
    mScale.setScalar(f.fit * SATPAD_FIT / SATPAD_R);
    s.padMat = new THREE.Matrix4().compose(mPos, mQuat, mScale);
    satellites.push(s);
    satAt.set(ci, s);
    return s;
  }

  function removeSat(ci) {
    const s = satAt.get(ci);
    if (!s) return false;
    satellites.splice(satellites.indexOf(s), 1);
    satAt.delete(ci);
    return true;
  }

  function clearSats() {
    satellites.length = 0;
    satAt.clear();
    if (satMesh) { satMesh.count = 0; satOutline.count = 0; }
    if (satpadMesh) { satpadMesh.count = 0; satpadOutline.count = 0; }
  }

  function updateSats(dt) {
    if (satMesh) {
      for (let i = 0; i < satellites.length; i++) {
        const s = satellites[i];
        s.spin += dt * 0.5;                  // a slow roll, so it reads alive
        mPos.copy(s.home).multiplyScalar(RADIUS + BAL.satAlt);
        mQuat.setFromUnitVectors(LOCAL_UP, s.home);
        sQ.setFromAxisAngle(s.home, s.spin);
        mQuat.premultiply(sQ);
        mScale.setScalar(s.k);
        satMesh.setMatrixAt(i, mMat.compose(mPos, mQuat, mScale));
      }
      satMesh.count = satellites.length;
      if (satellites.length) satMesh.instanceMatrix.needsUpdate = true;
      mirrorOutline(satMesh, satOutline);
    }
    // every bird's ground station holds its hex below
    if (satpadMesh) {
      for (let i = 0; i < satellites.length; i++) satpadMesh.setMatrixAt(i, satellites[i].padMat);
      satpadMesh.count = satellites.length;
      if (satellites.length) satpadMesh.instanceMatrix.needsUpdate = true;
      mirrorOutline(satpadMesh, satpadOutline);
    }
    // detection: any cloaked ship under a satellite's dome loses its veil
    for (const a of aliens) {
      if (!a.cloak) continue;
      a.seen = false;
      for (const s of satellites) {
        if (a.dir.angleTo(s.home) < s.radius) { a.seen = true; break; }
      }
    }
  }

  //  One pose writer for every fighter state: nose down the given
  //  direction, wings squared to the local up, banked by f.bank.
  function writeJetPose(i, f, noseDir) {
    fZ.copy(noseDir).multiplyScalar(-1);         // model nose is -Z
    fY.copy(f.dir).addScaledVector(fZ, -f.dir.dot(fZ));
    if (fY.lengthSq() < 1e-12) fY.set(0, 1, 0);
    fY.normalize();
    fX.crossVectors(fY, fZ).normalize();
    fBasis.makeBasis(fX, fY, fZ);
    fQ.setFromRotationMatrix(fBasis);
    fRoll.setFromAxisAngle(fZ, -f.bank);
    fQ.premultiply(fRoll);
    mScale.setScalar(f.k);
    jetMesh.setMatrixAt(i, mMat.compose(fPos, fQ, mScale));
    mScale.setScalar(f.k * OUTLINE_SCALE);
    jetOutlineMesh.setMatrixAt(i, mMat.compose(fPos, fQ, mScale));
  }

  function updateFighters(dt) {
    // bring out the dead first, so darts never chase a ghost
    for (let i = fighters.length - 1; i >= 0; i--) {
      if (!fighters[i].alive) {
        fighterAt.delete(fighters[i].ci);
        fighters.splice(i, 1);
        say('FIGHTER DOWN');
      }
    }
    if (jetMesh) jetMesh.count = fighters.length;

    // every based fighter parks its landing pad on its home hex
    if (jetpadMesh) {
      for (let i = 0; i < fighters.length; i++) jetpadMesh.setMatrixAt(i, fighters[i].padMat);
      jetpadMesh.count = fighters.length;
      jetpadMesh.instanceMatrix.needsUpdate = true;
      mirrorOutline(jetpadMesh, jetpadOutline);
    }

    for (let i = 0; i < fighters.length; i++) {
      const f = fighters[i];
      f.cool -= dt;

      let best = null;
      for (const a of aliens) {
        if (!a.alive || a.alt > f.ceiling) continue;
        if (a.cloak && !a.seen) continue;          // pilots cannot chase a ghost
        // a dart on THIS fighter's tail may be engaged anywhere;
        // everything else must be inside the patrol circle
        if (!f.cover.has(a.ci) && a.hunting !== f) continue;
        if (a.hp - a.incoming <= 0) continue;
        if (!best || a.alt < best.alt) best = a;
      }

      // Between waves the wing stands down: each jet makes for its pad,
      // hovers in over the deck, settles onto it, and sits there - engines
      // off - until the next wave scrambles the lot back into the air.
      if (G.inWave && f.state !== 'flying') f.state = 'flying';
      if (!G.inWave && !best) {
        // the settle gate must be at least the jet's own turning circle
        // (speed over turn rate), or an unlucky approach angle can orbit
        // home forever, always too wide to ever begin the descent
        const gate = Math.max(f.radius * 0.30, BAL.jetSpeed / BAL.jetTurn * 1.2);
        if (f.state === 'flying' && f.dir.angleTo(f.home) < gate) f.state = 'settling';
        if (f.state === 'settling') {
          // hover in: slide over the pad and sink onto the deck
          const rest = restAlt(f);
          const dHome = f.dir.angleTo(f.home);
          if (dHome > 1e-6) {
            fAxis.crossVectors(f.dir, f.home);
            if (fAxis.lengthSq() > 1e-12) {
              fAxis.normalize();
              fQ.setFromAxisAngle(fAxis, Math.min(dHome, BAL.jetSpeed * 0.35 * dt));
              f.dir.applyQuaternion(fQ).normalize();
              f.head.applyQuaternion(fQ);
              f.head.addScaledVector(f.dir, -f.head.dot(f.dir)).normalize();
            }
          }
          f.alt += THREE.MathUtils.clamp(rest - f.alt, -BAL.jetClimb * 0.6 * dt, BAL.jetClimb * 0.6 * dt);
          if (dHome < Math.max(0.02 * f.radius, 1e-4) && Math.abs(f.alt - rest) < 1e-3) {
            f.state = 'landed';
            f.dir.copy(f.home);
          }
        }
        if (f.state === 'landed') {
          f.dir.copy(f.home);
          f.alt = restAlt(f);
        }
        if (f.state !== 'flying') {
          // grounded or nearly: wings level, nose held on the heading, and
          // the true-path smoothing is parked with it for a clean scramble
          f.bank += (0 - f.bank) * Math.min(1, dt * 5);
          fPos.copy(f.dir).multiplyScalar(RADIUS + f.alt);
          f.prevPos.copy(fPos);
          f.vel.copy(f.head);
          if (jetMesh) writeJetPose(i, f, f.head);
          continue;
        }
      }

      let wantAlt;
      if (best) {
        fWant.copy(best.dir);
        wantAlt = Math.max(best.alt, BAL.jetFloor);
      } else if (!G.inWave) {
        // stand-down but still far out: make straight for the pad, low
        fWant.copy(f.home);
        wantAlt = Math.max(BAL.jetCruise * 0.5, restAlt(f));
      } else {
        // idle: circle the home tile so the unit reads as patrolling
        f.phase += dt * BAL.jetSpeed / Math.max(f.radius * 0.7, 1e-3);
        const rr = f.radius * 0.7;
        fWant.copy(f.home).multiplyScalar(Math.cos(rr))
             .addScaledVector(f.e1, Math.sin(rr) * Math.cos(f.phase))
             .addScaledVector(f.e2, Math.sin(rr) * Math.sin(f.phase)).normalize();
        wantAlt = BAL.jetCruise;
      }

      // steer: turn the heading toward the bearing of the wanted point,
      // capped by a turn rate so it banks around instead of snapping
      fA1.copy(fWant).addScaledVector(f.dir, -fWant.dot(f.dir));
      let turn = 0;
      if (fA1.lengthSq() > 1e-10) {
        fA1.normalize();
        const ang = f.head.angleTo(fA1);
        const lim = BAL.jetTurn * dt;
        turn = Math.min(ang, lim);
        if (ang > 1e-6) {
          fA2.crossVectors(f.head, fA1);
          const sign = fA2.dot(f.dir) >= 0 ? 1 : -1;
          fQ.setFromAxisAngle(f.dir, sign * turn);
          f.head.applyQuaternion(fQ);
          f.head.addScaledVector(f.dir, -f.head.dot(f.dir)).normalize();
          turn *= sign;
        }
      }
      f.bank += (THREE.MathUtils.clamp(turn / Math.max(dt, 1e-4) * 0.30, -1.0, 1.0) - f.bank)
                * Math.min(1, dt * 4);

      // fly forward along the great circle the heading points down
      fAxis.crossVectors(f.dir, f.head);
      if (fAxis.lengthSq() > 1e-12) {
        fAxis.normalize();
        fQ.setFromAxisAngle(fAxis, BAL.jetSpeed * dt);
        f.dir.applyQuaternion(fQ).normalize();
        f.head.applyQuaternion(fQ).normalize();
      }

      // it may go anywhere inside its circle and nowhere outside it
      const away = f.home.angleTo(f.dir);
      if (away > f.radius) {
        fAxis.crossVectors(f.dir, f.home);
        if (fAxis.lengthSq() > 1e-12) {
          fAxis.normalize();
          fQ.setFromAxisAngle(fAxis, away - f.radius);
          f.dir.applyQuaternion(fQ).normalize();
          f.head.applyQuaternion(fQ).normalize();
        }
      }

      const dv = THREE.MathUtils.clamp(wantAlt - f.alt, -BAL.jetClimb * dt, BAL.jetClimb * dt);
      f.alt += dv;

      // guns are short ranged on purpose: it has to actually get there
      fPos.copy(f.dir).multiplyScalar(RADIUS + f.alt);
      if (best && f.cool <= 0) {
        const reach = BAL.jetReach * tiles.meanInr;
        const dist = fPos.distanceTo(posOf(best));
        if (dist < reach) {
          f.cool = BAL.jetRate;
          fA2.copy(predictAlien(best, dist / BAL.slugSpeed, pPred)).sub(fPos).normalize();
          muzzle.copy(f.head).multiplyScalar(JET_LEN * 0.5 * f.k).add(fPos);
          fireShell(muzzle, fA2, best, f.dmg);
        }
      }

      if (jetMesh) {
        // The nose follows the ACTUAL path. Everything that moves the jet -
        // the turn, the climb, even the patrol boundary shoving it back
        // inside its circle - lands in the frame-to-frame displacement, so
        // pointing the nose down the (smoothed) displacement means nothing
        // can read as sliding: however the jet moved, the nose leads it.
